   <script>
    // --- 1. 全域變數 ---
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    let fullDataList = [];
    let lastUpdatedTime = null;
    let currentSort = { column: 'realDiscountPct', dir: 'desc' };
    let currentMinPct = 30;

    function getText(content, lang) {
        if (!content) return '-';
        if (typeof content === 'string') return content;
        if (typeof content === 'object') {
            return content[lang] || content['zh-Hant'] || Object.values(content)[0] || '-';
        }
        return String(content);
    }

    const statusI18n = {
        'drop': { 'en': '📉 Real Price Drop', 'zh-Hant': '📉 真降價', 'zh-Hans': '📉 真降价', 'color': 'text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30 border-green-200 dark:border-green-800' },
        'fake': { 'en': '⚠️ Fake Promo', 'zh-Hant': '⚠️ 假促銷(無平到)', 'zh-Hans': '⚠️ 假促销(无降价)', 'color': 'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 border-amber-200 dark:border-amber-800' },
        'increase': { 'en': '📈 Hidden Increase', 'zh-Hant': '📈 價格暗升', 'zh-Hans': '📈 价格暗升', 'color': 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-800' },
        'promo_changed': { 'en': '🏷️ Promo Changed', 'zh-Hant': '🏷️ 換新優惠', 'zh-Hans': '🏷️ 换新优惠', 'color': 'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 border-blue-200 dark:border-blue-800' },
        'maintained': { 'en': '⏸️ Maintained', 'zh-Hant': '⏸️ 價格維持', 'zh-Hans': '⏸️ 价格维持', 'color': 'text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700' },
        'new': { 'en': '🆕 Newly Added', 'zh-Hant': '🆕 首次上架', 'zh-Hans': '🆕 首次上架', 'color': 'text-[#345B8C] dark:text-[#6A95CC] bg-[#E8F0F8] dark:bg-slate-700 border-[#345B8C]/20 dark:border-[#6A95CC]/30' }
    };

    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function getSmName(code, lang) {
        let c = (code || '').toUpperCase();
        if (typeof supermarketDict !== 'undefined' && supermarketDict[lang] && supermarketDict[lang][c]) return supermarketDict[lang][c];
        if (typeof supermarketDict !== 'undefined' && supermarketDict['zh-Hant'] && supermarketDict['zh-Hant'][c]) return supermarketDict['zh-Hant'][c];
        return c;
    }

    function getSmBadge(smCode, lang) {
        let code = (smCode || '').toUpperCase();
        let name = getSmName(code, lang);
        let style = (typeof supermarketStyleDict !== 'undefined' && supermarketStyleDict[code]) 
            ? supermarketStyleDict[code] 
            : { badgeBg: 'bg-slate-100 dark:bg-slate-700', badgeText: 'text-slate-600 dark:text-slate-300', badgeBorder: 'border-slate-200 dark:border-slate-600' };
            
        return `<span onclick="setQuickSearch('${name}'); window.scrollTo({ top: 0, behavior: 'smooth' });" class="px-2.5 py-1 text-[11px] font-black rounded-md border ${style.badgeBg} ${style.badgeText} ${style.badgeBorder} whitespace-nowrap shadow-sm cursor-pointer hover:opacity-75 transition-all inline-block">${name}</span>`;
    }

    function goToProductSearch(productName) {
        window.location.href = 'index.html?lang=' + currentLang + '&q=' + encodeURIComponent(productName);
    }

   // --- 🚀 V12.0 實時雙軌直連：前端大腦實時運算 (廢除 true_discount.json) ---
    async function loadTrueDiscountData() {
        try {
            const tbody = document.getElementById('leaderboardTableBody');
            const mbody = document.getElementById('leaderboardMobile');
            
            let loadingStr = currentLang === 'en' ? '⏳ Calculating Live Discount Data...' : (currentLang === 'zh-Hans' ? '⏳ 正在实时运算真抵榜数据...' : '⏳ 正在即時運算真抵榜數據...');
            const loadingHTML = `<div class="p-10 text-center font-bold text-slate-500 dark:text-slate-400 animate-pulse text-[15px] flex flex-col items-center justify-center gap-3"><div class="w-8 h-8 border-4 border-slate-200 border-t-[#345B8C] rounded-full animate-spin"></div>${loadingStr}</div>`;
            if (tbody) tbody.innerHTML = `<tr><td colspan="10">${loadingHTML}</td></tr>`;
            if (mbody) mbody.innerHTML = loadingHTML;

            const nocache = new Date().getTime();
            const pwUrl = `https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/pricewatch.json?v=${nocache}`;
            const snapUrl = `https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/snapshot.json?v=${nocache}`;
            const logUrl = `https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/update_log.txt?v=${nocache}`;

            const [pwRes, snapRes, logRes] = await Promise.all([
                fetch(pwUrl, { cache: 'no-store' }),
                fetch(snapUrl, { cache: 'no-store' }).catch(e => null),
                fetch(logUrl, { cache: 'no-store' }).catch(e => null)
            ]);

            if (!pwRes.ok) throw new Error("無法取得最新官方即時數據");
            const rawApiData = await pwRes.json();
            
            let snapshotData = [];
            if (snapRes && snapRes.ok) {
                const snapJson = await snapRes.json();
                snapshotData = Array.isArray(snapJson) ? snapJson : (snapJson.results || []);
            }

            if (logRes && logRes.ok) lastUpdatedTime = new Date((await logRes.text()).trim());
            else lastUpdatedTime = new Date();

            let leaderboard = [];

            // 🧠 前端實時大腦：遍歷所有商品並運算
            rawApiData.forEach(item => {
                if (!item.prices || !Array.isArray(item.prices)) return;
                
                let validPrices = [];
                item.prices.forEach(p => {
                    let codeUpper = (p.supermarketCode || '').toUpperCase();
                    if (codeUpper === 'ZTORE') return; 

                    let basePrice = parseFloat(p.price);
                    if (isNaN(basePrice)) return;
                    
                    let effPrice = basePrice;
                    let promoCalcEn = '';
                    let promoDisplayZh = '';
                    let promoDisplayHans = '';
                    
                    // 攔截促銷字串
                    const promoKeys = ['offers', 'promotions', 'promotion', 'offer', 'promotionDesc'];
                    for (let key of promoKeys) {
                        if (Array.isArray(item[key])) {
                            let matchingOffer = item[key].find(o => String(o.supermarketCode) === String(p.supermarketCode) || String(o.supermarket) === String(p.supermarketCode));
                            if (matchingOffer) {
                                let exEn = typeof extractDeepPromoText === 'function' ? extractDeepPromoText(matchingOffer, 'en') : '';
                                if (exEn && exEn !== "[object Object]") {
                                    promoCalcEn = exEn;
                                    promoDisplayZh = extractDeepPromoText(matchingOffer, 'zh-Hant');
                                    promoDisplayHans = extractDeepPromoText(matchingOffer, 'zh-Hans');
                                    break; 
                                }
                            }
                        } else if (p[key]) {
                            let exEn = typeof extractDeepPromoText === 'function' ? extractDeepPromoText(p[key], 'en') : '';
                            if (exEn && exEn !== "[object Object]") {
                                promoCalcEn = exEn;
                                promoDisplayZh = extractDeepPromoText(p[key], 'zh-Hant');
                                promoDisplayHans = extractDeepPromoText(p[key], 'zh-Hans');
                                break;
                            }
                        }
                    }
                    
                    // 呼叫 promoEngine.js 實時計算單件折實價
                    if (typeof calculateAvgPrice === 'function' && promoCalcEn) {
                        let avg = calculateAvgPrice(promoCalcEn, basePrice);
                        if (avg && avg > 0 && avg < basePrice) effPrice = avg;
                        else if (avg && avg.price !== undefined && avg.price !== null) effPrice = avg.price;
                    }
                    
                    validPrices.push({ smCode: codeUpper, basePrice: basePrice, effPrice: effPrice, promoEn: promoCalcEn, promoZh: promoDisplayZh, promoHans: promoDisplayHans });
                });
                
                // 必須要在兩間以上超市有售，才能計算全城平均價
                if (validPrices.length < 2) return; 
                
                let marketAvgPrice = validPrices.reduce((acc, curr) => acc + curr.effPrice, 0) / validPrices.length;
                let winner = validPrices.reduce((prev, curr) => prev.effPrice < curr.effPrice ? prev : curr);
                
                // 如果最低價並沒有低於全城平均，就沒有上榜資格
                if (winner.effPrice >= marketAvgPrice) return; 
                
                let discountPct = ((marketAvgPrice - winner.effPrice) / marketAvgPrice) * 100;
                if (discountPct <= 0) return;

                // 🕰️ 即時對碰 Snapshot 歷史大腦
                let historyStatus = 'maintained';
                let prevEffPrice = null;
                let prevBasePrice = null;
                let lastChangeDate = null;
                let prevOfferEn = null;
                let prevOfferZh = null;
                let prevOfferHans = null;

                const snapRecord = snapshotData.find(s => String(s.product_code) === String(item.code) && String(s.supermarket_code) === winner.smCode);
                if (snapRecord) {
                    let rawStatus = snapRecord.change_status || 'maintained';
                    let prevEffNum = parseFloat(snapRecord.previous_effective_price);
                    
                    // V12.0 狀態翻譯：依據實質數字推導終極狀態
                    if (rawStatus === 'NEW_ADDED') {
                        historyStatus = 'new';
                    } else if (rawStatus.includes('PRICE_CHANGED') || rawStatus === 'drop' || rawStatus === 'increase') {
                        if (!isNaN(prevEffNum) && winner.effPrice < prevEffNum) historyStatus = 'drop';
                        else if (!isNaN(prevEffNum) && winner.effPrice > prevEffNum) historyStatus = 'increase';
                        else historyStatus = 'promo_changed';
                    } else if (rawStatus.includes('OFFER_CHANGED') || rawStatus === 'promo_changed') {
                        historyStatus = 'promo_changed';
                    }
                    
                    // 假促銷捕捉
                    if (winner.promoEn && !isNaN(prevEffNum) && winner.effPrice >= prevEffNum && historyStatus !== 'increase') {
                        historyStatus = 'fake';
                    }

                    prevEffPrice = snapRecord.previous_effective_price;
                    prevBasePrice = snapRecord.previous_base_price;
                    lastChangeDate = snapRecord.last_changed_date;
                    prevOfferEn = snapRecord.previous_offer_en;
                    prevOfferZh = snapRecord.previous_offer_zh_hant;
                    prevOfferHans = snapRecord.previous_offer_zh_hans;
                } else {
                    historyStatus = 'new';
                }

                let otherPrices = validPrices.filter(v => v.smCode !== winner.smCode).map(v => ({ smCode: v.smCode, price: v.effPrice }));

                leaderboard.push({
                    name: item.name || {'zh-Hant': 'Unknown'},
                    brand: item.brand || item.brandName || '',
                    categoryRaw: item.cat1Name || item.categoryRaw || '',
                    smCode: winner.smCode,
                    originalPrice: winner.basePrice,
                    effectivePrice: winner.effPrice,
                    currentOfferEn: winner.promoEn,
                    currentOfferZh: winner.promoZh,
                    currentOfferHans: winner.promoHans,
                    realDiscountPct: discountPct,
                    statusKey: historyStatus,
                    prevEffPrice: prevEffPrice,
                    prevBasePrice: prevBasePrice,
                    lastChangeDate: lastChangeDate,
                    prevOfferEn: prevOfferEn,
                    prevOfferZh: prevOfferZh,
                    prevOfferHans: prevOfferHans,
                    otherPricesRaw: JSON.stringify(otherPrices)
                });
            });

            fullDataList = leaderboard;
            
            if (typeof updateLocalLanguage === 'function') {
                updateLocalLanguage(currentLang);
            }
            
        } catch (e) { 
            console.error("數據載入崩潰:", e); 
            const errorStr = currentLang === 'en' ? 'Failed to load live data' : '無法取得最新即時數據';
            const errorHTML = `
                <div class="p-10 text-center flex flex-col items-center justify-center gap-3">
                    <span class="text-red-500 dark:text-red-400 font-black text-[16px]">${errorStr}</span>
                    <span class="text-[12px] font-mono text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 max-w-md break-words">${e.message}</span>
                </div>`;
            const tbody = document.getElementById('leaderboardTableBody');
            const mbody = document.getElementById('leaderboardMobile');
            if(tbody) tbody.innerHTML = `<tr><td colspan="10">${errorHTML}</td></tr>`;
            if(mbody) mbody.innerHTML = errorHTML;
        }
    }

    function applyFilters() {
        const kwInput = document.getElementById('filterInput');
        const kw = kwInput ? kwInput.value.toLowerCase().trim() : '';
        const sm = document.getElementById('smFilter').value;
        const cat = document.getElementById('catFilter').value;
        const clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) clearBtn.classList.toggle('hidden', kw.length === 0);

        let filtered = fullDataList.filter(i => {
            const name = getText(i.name, currentLang).toLowerCase();
            const smNameText = getSmName(i.smCode, currentLang).toLowerCase(); 
            const rawCatValue = typeof i.categoryRaw === 'object' ? (i.categoryRaw['zh-Hant'] || '') : String(i.categoryRaw || '');
            const translatedCatText = getText(i.categoryRaw, currentLang).toLowerCase();
            
            const matchesKw = name.includes(kw) || smNameText.includes(kw) || translatedCatText.includes(kw);
            const matchesSm = (sm === 'ALL' || i.smCode === sm);
            const matchesCat = (cat === 'ALL' || rawCatValue === cat);
            const matchesPct = currentMinPct > 0 ? (parseFloat(i.realDiscountPct) >= currentMinPct) : true;
            
            return matchesKw && matchesSm && matchesCat && matchesPct;
        });

        filtered.sort((a, b) => {
            let valA = a[currentSort.column], valB = b[currentSort.column];
            
            if (currentSort.column === 'realDiscountPct' || currentSort.column === 'effectivePrice' || currentSort.column === 'originalPrice') {
                 valA = parseFloat(valA) || 0;
                 valB = parseFloat(valB) || 0;
            } else if (currentSort.column === 'categoryRaw' || currentSort.column === 'name') {
                 valA = getText(a[currentSort.column], currentLang); valB = getText(b[currentSort.column], currentLang);
                 return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            } else {
                valA = String(valA || ''); valB = String(valB || '');
                return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            return currentSort.dir === 'asc' ? valA - valB : valB - valA;
        });

        updateSortUI();
        renderLeaderboard(filtered);
    }

                    <div class="flex items-start gap-2"><span class="px-1.5 py-0.5 text-[10px] font-bold rounded border text-red-600 bg-red-50 border-red-200 shrink-0">📈 Hidden Increase</span> <span class="text-slate-600 dark:text-slate-400">Today's effective price is <b>higher</b> than the last recorded price.</span></div>
                    <div class="flex items-start gap-2"><span class="px-1.5 py-0.5 text-[10px] font-bold rounded border text-slate-500 bg-slate-100 border-slate-200 shrink-0">⏸️ Maintained</span> <span class="text-slate-600 dark:text-slate-400">Price and promotions are identical to the last record.</span></div>
                    <div class="flex items-start gap-2"><span class="px-1.5 py-0.5 text-[10px] font-bold rounded border text-[#345B8C] bg-[#E8F0F8] border-[#6A95CC]/30 shrink-0">🆕 Newly Added</span> <span class="text-slate-600 dark:text-slate-400">First time this product's price at this supermarket is recorded since late 2025.</span></div>

                <p class="mb-2"><b>1. For Reference Only:</b> Prices are auto-calculated from public data. Discrepancies may occur due to branch variations. Always verify at the physical store before purchasing.</p>

                <p><b>3. Liability:</b> Provided "AS IS". The developers accept no liability for any losses caused by data discrepancies.</p>
            `
        }
    };

    function openCalcInfoModal() {
        const modal = document.getElementById('calcInfoModal');
        const box = document.getElementById('calcInfoBox');
        
        const langData = calcInfoTexts[currentLang] || calcInfoTexts['zh-Hant'];
        document.getElementById('calcModalTitle').innerHTML = langData.title;
        document.getElementById('calcModalContent').innerHTML = langData.content;
        document.getElementById('calcModalCloseBtn').innerText = langData.close;

        if (modal && box) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }
    }

    function closeCalcInfoModal() {
        const modal = document.getElementById('calcInfoModal');
        const box = document.getElementById('calcInfoBox');
        if (modal && box) {
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }
    }

    // --- 啟動初始化 ---
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof window.currentLang !== 'undefined') {
            updateLocalLanguage(window.currentLang);
        } else {
            updateLocalLanguage(currentLang);
        }
    });

    loadTrueDiscountData();
</script>
</body>
</html>
