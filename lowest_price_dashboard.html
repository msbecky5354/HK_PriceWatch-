            stackedBarChart.on('click', triggerSmFilter);

            smDivergingChart.on('click', triggerSmFilter);

            catDivergingChart.getZr().on('click', triggerResetCat);

       // 🟢 SPA 分頁無縫切換邏輯 (Tab Switching)
        window.switchTab = function(tabId) {

            const btnTracker = document.getElementById('btn-tab-tracker');

            const inactiveClass = "flex-1 px-6 py-2.5 rounded-lg font-bold text-[13px] md:text-[14px] text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-all text-center";

            if (tabId === 'winners') {
                btnWinners.className = activeClass + " mb-1 sm:mb-0 sm:mr-1";

        const getXAxisConfig = () => ({
            type: 'value',
            axisLabel: { formatter: (value) => Math.abs(value), color: isDarkMode ? '#94a3b8' : '#64748b' },
            splitLine: { lineStyle: { type: 'dashed', color: isDarkMode ? '#334155' : '#e2e8f0' } }
        });

        const buildDivergingTooltip = function(statsMap) {
            return function (params) {
                const origCode = params[0].name; 
                const name = getSmName(origCode) || getCatName(origCode) || origCode;
                let html = `<div class="font-bold border-b border-slate-200 dark:border-slate-600 pb-1 mb-1">${name}</div>`;
                let dynamicTotal = 0;
                params.forEach(p => {
                    const val = Math.abs(p.value);
                    if(val > 0) { html += `${p.marker} ${p.seriesName}: <b>${val}</b><br/>`; dynamicTotal += val; }
                });
                const tLocal = localI18n[currentLang] || localI18n['zh-Hant'];
                const flatCount = statsMap[origCode] ? statsMap[origCode].flat_beaten : 0;
                if (flatCount > 0 || dynamicTotal > 0) {
                    html += `<div style="margin-top:4px; padding-top:4px; border-top:1px dashed #e2e8f0;">
                                <span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:#94a3b8;"></span> <span class="text-slate-600 dark:text-slate-300">${tLocal.mcPillFlat.replace('🛡️ ', '')}:</span> <b class="text-slate-700 dark:text-slate-100">${flatCount}</b>
                             </div>`;
                }
                const grandTotal = dynamicTotal + flatCount;
                html += `<div class="mt-1 pt-1 border-t border-slate-100 dark:border-slate-600 text-xs text-slate-500 dark:text-slate-400">Total: <b>${grandTotal}</b></div>`;
                return html;
            };
        };

        let allValidItems = []; 
        let filteredData = [];
        let state = { sm: 'ALL', cat: 'ALL', strategy: 'ALL', search: '', sortCol: null, sortAsc: true, page: 1 };
        const rowsPerPage = 50;

        async function fetchAndProcessData() {
            try {
                initCharts();
                const nocache = new Date().getTime();
                
                let tdLogUrl = `https://msbecky5354.github.io/JSON/data/update_log_TrueDiscount.txt?v=${nocache}`;
                try {
                    const logRes = await fetch(tdLogUrl);
                    if (logRes.ok) {
                        let serverTimeStr = (await logRes.text()).trim();
                        let safeTimeStr = serverTimeStr.replace(/-/g, '/').replace('T', ' '); 
                        tdLastUpdatedTime = new Date(safeTimeStr);
                    }
                } catch(e) { console.warn("Time fetch failed"); }

                const res = await fetch(`https://msbecky5354.github.io/JSON/data/bi_lowestprice.json?v=${nocache}`, { cache: 'no-store' });
                let rawData = await res.json();
                
                let data = [];
                if (Array.isArray(rawData)) {
                    if (rawData.length > 0 && rawData[0].snapshot_data) data = rawData[0].snapshot_data;
                    else if (rawData.length > 0 && rawData[0].json && rawData[0].json.snapshot_data) data = rawData[0].json.snapshot_data;
                    else data = rawData.map(r => r.json || r);
                } else if (rawData && rawData.snapshot_data) {
                    data = rawData.snapshot_data;
                } else if (rawData && rawData.data) {
                    data = rawData.data;
                } else {
                    data = [rawData];
                }
                if (data.length === 1 && Array.isArray(data[0])) data = data[0];
                
                if (!data || data.length === 0) throw new Error("JSON is empty.");

                const summary = { true_drop: 0, competitive_up: 0, flat_beaten: 0 };
                allValidItems = []; 

                data.forEach(winnerItem => {
                    const sm = (winnerItem.sm || 'OTHER').toUpperCase();
                    if (sm === 'ZTORE') return;
                    
                    const catRaw = winnerItem.c1 || '未分類';
                    const currEff = parseFloat(winnerItem.ce_p) || 0;
                    const currBase = parseFloat(winnerItem.cb_p) || 0;
                    const prevEff = parseFloat(winnerItem.pe_p) || 0;
                    
                    let strategy = 'normal_change';
                    if (winnerItem.macroGroup === 'NEW_ADDED') strategy = 'normal_change';
                    else if (winnerItem.macroGroup === 'MACRO_DOWN') strategy = 'true_drop';
                    else if (winnerItem.macroGroup === 'MACRO_UP') strategy = 'competitive_up';
                    else strategy = 'flat_beaten';

                    if (strategy !== 'normal_change') {
                        summary[strategy]++;
                        const diffPct = parseFloat(winnerItem.diff) || 0;
                        
                        const marketAvgBase = parseFloat(winnerItem.m_avg) || parseFloat(winnerItem.market_avg_base_price) || 0;
                        const devPct = marketAvgBase > 0 ? ((currBase - marketAvgBase) / marketAvgBase) * 100 : 0;
                        const realDropPct = marketAvgBase > 0 ? ((marketAvgBase - currEff) / marketAvgBase) * 100 : 0;
                        
                        let nameEn = winnerItem.name_en || winnerItem.n || '';
                        let nameTc = winnerItem.n || '';
                        let nameSc = winnerItem.name_zh_hans || nameTc;
                        
                        let brandEn = winnerItem.brand_name_en || winnerItem.b || '';
                        let brandTc = winnerItem.b || '無品牌';
                        let brandSc = winnerItem.brand_name_hans || brandTc;

                        let offerEn = winnerItem.offer_en || winnerItem.co || '-';
                        let offerTc = winnerItem.co || '-';
                        let offerSc = winnerItem.offer_hans || offerTc;

                        allValidItems.push({
                            sm: sm, catRaw: catRaw, 
                            nameEn: nameEn, nameTc: nameTc, nameSc: nameSc,
                            brandEn: brandEn, brandTc: brandTc, brandSc: brandSc,
                            offerEn: offerEn, offerTc: offerTc, offerSc: offerSc,
                            strategy: strategy, prev: prevEff, curr: currEff, currBase: currBase, diff: diffPct,
                            avgBase: marketAvgBase, dev: devPct, realDrop: realDropPct
                        });
                    }
                });

                document.getElementById('countTrueDrop').innerText = summary.true_drop;
                document.getElementById('countTrueUp').innerText = summary.competitive_up;
                document.getElementById('countFlatBeaten').innerText = summary.flat_beaten;
                document.getElementById('pillAll').innerText = `(${summary.true_drop + summary.competitive_up + summary.flat_beaten})`;
                document.getElementById('pillDrop').innerText = `(${summary.true_drop})`;
                document.getElementById('pillFlat').innerText = `(${summary.flat_beaten})`;
                document.getElementById('pillUp').innerText = `(${summary.competitive_up})`;

                updateLocalLanguage(); 
                document.getElementById('loadingOverlay').style.display = 'none';

                applyStateFilter('strategy', 'ALL');

            } catch (err) {
                console.error("Data Fetch Error:", err);
                const tLocal = localI18n[currentLang] || localI18n['zh-Hant'];
                document.getElementById('loadingOverlay').innerHTML = `<span class='text-red-500 font-bold'>${tLocal.mcTableTitle} (Failed)</span>`;
            }
        }

        function populateDropdowns() {
            const uniqueSms = [...new Set(allValidItems.map(i => i.sm))].sort();
            const uniqueCatsRaw = [...new Set(allValidItems.map(i => i.catRaw))].sort();

            const selSm = document.getElementById('selSm');
            selSm.innerHTML = `<option value="ALL">ALL</option>`;
            uniqueSms.forEach(sm => selSm.add(new Option(getSmName(sm), sm)));

            const selCat = document.getElementById('selCat');
            selCat.innerHTML = `<option value="ALL">ALL</option>`;
            uniqueCatsRaw.forEach(cat => selCat.add(new Option(getCatName(cat), cat)));
            
            document.getElementById('selSm').value = state.sm;
            document.getElementById('selCat').value = state.cat;
            document.getElementById('selStrategy').value = state.strategy;
        }

        function applyStateFilter(type, value) {
            if (type === 'sm') state.sm = value;
            if (type === 'sm' && value !== 'ALL') {
                const found = allValidItems.find(i => getSmName(i.sm) === value || i.sm === value);
                if(found) state.sm = found.sm;
            }
            if (type === 'cat') state.cat = value;
            if (type === 'strategy') state.strategy = value;
            if (type === 'search') state.search = value;
            state.page = 1;
            syncUI();
            applyFiltersCore();
        }

        function syncUI() {
            document.querySelectorAll('#macroPills .v-pill').forEach(pill => {
                pill.classList.toggle('active', pill.getAttribute('onclick').includes(`('${state.strategy}')`));
            });
            document.getElementById('selSm').value = state.sm;
            document.getElementById('selCat').value = state.cat;
            document.getElementById('selStrategy').value = state.strategy;
            
            const tLocal = localI18n[currentLang] || localI18n['zh-Hant'];
            const indSm = document.getElementById('indSm');
            if (state.sm !== 'ALL') { indSm.innerHTML = `<span class="font-black">${getSmName(state.sm)}</span> ${tLocal.mcClickToCancel}`; indSm.classList.remove('hidden'); }
            else { indSm.classList.add('hidden'); }
            
            const indCat = document.getElementById('indCat');
            if (state.cat !== 'ALL') { indCat.innerHTML = `<span class="font-black">${getCatName(state.cat)}</span> ${tLocal.mcClickToCancel}`; indCat.classList.remove('hidden'); }
            else { indCat.classList.add('hidden'); }
        }

        function resetFilters() {
            state.sm = 'ALL'; state.cat = 'ALL'; state.strategy = 'ALL'; state.search = '';
            document.getElementById('searchInput').value = '';
            state.sortCol = null; state.sortAsc = true;
            document.querySelectorAll('.sort-icon').forEach(el => {
                el.innerHTML = '↕';
                el.classList.remove('text-slate-500', 'dark:text-slate-300', 'font-black');
                el.classList.add('text-slate-300', 'dark:text-slate-500', 'font-normal');
            });
            syncUI();
            applyFiltersCore();
        }

        function applyFiltersCore() {
            const kw = state.search.toLowerCase();
            filteredData = allValidItems.filter(item => {
                const name = currentLang === 'en' ? item.nameEn : (currentLang === 'zh-Hans' ? item.nameSc : item.nameTc);
                const brand = currentLang === 'en' ? item.brandEn : (currentLang === 'zh-Hans' ? item.brandSc : item.brandTc);
                const matchKw = name.toLowerCase().includes(kw) || brand.toLowerCase().includes(kw) || getSmName(item.sm).toLowerCase().includes(kw) || getCatName(item.catRaw).toLowerCase().includes(kw);
                const matchSt = state.strategy === 'ALL' ? true : item.strategy === state.strategy;
                const matchSm = state.sm === 'ALL' ? true : item.sm === state.sm; 
                const matchCat = state.cat === 'ALL' ? true : item.catRaw === state.cat; 
                return matchKw && matchSt && matchSm && matchCat;
            });

            renderChartsFromFiltered();
            renderTable();
        }

        function renderChartsFromFiltered() {
            const tLocal = localI18n[currentLang] || localI18n['zh-Hant'];
            const smStats = {};
            const catStats = {};
            const smBehaviors = {};

            filteredData.forEach(i => {
                smStats[i.sm] = (smStats[i.sm] || 0) + 1;
            });

            const kw = state.search.toLowerCase();
            
            // 🟢 安全的扁平化獨立過濾邏輯 (避免 TypeError)
            const chartDataSm = allValidItems.filter(item => {
                const name = currentLang === 'en' ? item.nameEn : (currentLang === 'zh-Hans' ? item.nameSc : item.nameTc);
                const brand = currentLang === 'en' ? item.brandEn : (currentLang === 'zh-Hans' ? item.brandSc : item.brandTc);
                const matchKw = name.toLowerCase().includes(kw) || brand.toLowerCase().includes(kw) || getSmName(item.sm).toLowerCase().includes(kw) || getCatName(item.catRaw).toLowerCase().includes(kw);
                const matchCat = state.cat === 'ALL' ? true : item.catRaw === state.cat;
                const matchSt = state.strategy === 'ALL' ? true : item.strategy === state.strategy;
                return matchKw && matchCat && matchSt;
            });

            const chartDataCat = allValidItems.filter(item => {
                const name = currentLang === 'en' ? item.nameEn : (currentLang === 'zh-Hans' ? item.nameSc : item.nameTc);
                const brand = currentLang === 'en' ? item.brandEn : (currentLang === 'zh-Hans' ? item.brandSc : item.brandTc);
                const matchKw = name.toLowerCase().includes(kw) || brand.toLowerCase().includes(kw) || getSmName(item.sm).toLowerCase().includes(kw) || getCatName(item.catRaw).toLowerCase().includes(kw);
                const matchSm = state.sm === 'ALL' ? true : item.sm === state.sm;
                const matchSt = state.strategy === 'ALL' ? true : item.strategy === state.strategy;
                return matchKw && matchSm && matchSt;
            });

            const baseDataForStacked = allValidItems.filter(item => {
                const name = currentLang === 'en' ? item.nameEn : (currentLang === 'zh-Hans' ? item.nameSc : item.nameTc);
                const brand = currentLang === 'en' ? item.brandEn : (currentLang === 'zh-Hans' ? item.brandSc : item.brandTc);
                const matchKw = name.toLowerCase().includes(kw) || brand.toLowerCase().includes(kw) || getSmName(item.sm).toLowerCase().includes(kw) || getCatName(item.catRaw).toLowerCase().includes(kw);
                const matchSm = state.sm === 'ALL' ? true : item.sm === state.sm;
                const matchCat = state.cat === 'ALL' ? true : item.catRaw === state.cat;
                return matchKw && matchSm && matchCat;
            });

            const trackerSmStats = {};
            chartDataSm.forEach(i => {
                if (!trackerSmStats[i.sm]) trackerSmStats[i.sm] = { true_drop: 0, competitive_up: 0, flat_beaten: 0 };
                trackerSmStats[i.sm][i.strategy]++;
            });
            chartDataCat.forEach(i => {
                if (!catStats[i.catRaw]) catStats[i.catRaw] = { true_drop: 0, competitive_up: 0, flat_beaten: 0 };
                catStats[i.catRaw][i.strategy]++;
            });
            baseDataForStacked.forEach(i => {
                if (!smBehaviors[i.sm]) smBehaviors[i.sm] = { true_drop: 0, competitive_up: 0, flat_beaten: 0, total: 0 };
                smBehaviors[i.sm][i.strategy]++;
                smBehaviors[i.sm].total++;
            });

            const legendDrop = tLocal.mcPillDrop.replace('📉 ', '');
            const legendFlat = tLocal.mcPillFlat.replace('🛡️ ', '');
            const legendUp = tLocal.mcPillUp.replace('📈 ', '');

            // ==========================================
            // 📊 1. Treemap (Winners)
            // ==========================================
            const logoFileMap = {
                'PARKNSHOP': 'pns', 
                'JASONS': 'marketplace', 
                'AEON': 'aeon',
                'WELLCOME': 'wellcome', 
                'MANNINGS': 'mannings', 
                'WATSONS': 'watsons',
                'SASA': 'SaSa',
                'DCHFOOD': 'DCH_Food',
                'LUNGFUNG': 'lungfung'
            };

            const logoSizeMap = {
                'SASA': { width: 55, height: 20 },
                'DCHFOOD': { width: 60, height: 24 },
                'LUNGFUNG': { width: 60, height: 20 },
                'DEFAULT': { width: 32, height: 32 }
            };

            const dynamicRich = {
                name: { fontSize: 13, fontWeight: 'bold', color: '#ffffff', align: 'center', textShadowColor: 'rgba(0,0,0,0.5)', textShadowBlur: 3, lineHeight: 16 },
                count: { fontSize: 11, fontWeight: 'bold', color: '#ffffff', align: 'center', backgroundColor: 'rgba(0,0,0,0.3)', padding: [2, 4], borderRadius: 4, marginTop: 4, lineHeight: 12 }
            };

            const treemapData = Object.keys(smStats).map(sm => {
                const smCode = sm.toUpperCase().trim();
                const richKey = 'logo_' + smCode.replace(/[^a-zA-Z0-9]/g, '');
                const fileName = logoFileMap[smCode] || smCode.toLowerCase();
                const size = logoSizeMap[smCode] || logoSizeMap['DEFAULT'];
                
                dynamicRich[richKey] = {
                    backgroundColor: { image: `https://msbecky5354.github.io/JSON/img/${fileName}.png` },
                    width: size.width, height: size.height, align: 'center'
                };

                return { name: getSmName(smCode), value: smStats[sm], smCode: smCode, richKey: richKey };
            });

            const treemapColorMap = {
                'ALL': ['#93C5FD', '#60A5FA', '#3B82F6', '#2563EB'], 
                'true_drop': ['#A7F3D0', '#34D399', '#10B981', '#059669'], 
                'competitive_up': ['#FDE68A', '#FCD34D', '#F59E0B', '#D97706'], 
                'flat_beaten': ['#CBD5E1', '#94A3B8', '#64748B', '#475569'] 
            };
            const currentTreemapColor = treemapColorMap[state.strategy] || treemapColorMap['ALL'];

            const titleEl = document.getElementById('txt-mcChartTreemap');
            if (titleEl) {
                let suffix = tLocal.mcSuffixAll;
                if (state.strategy === 'true_drop') suffix = tLocal.mcSuffixDrop;
                if (state.strategy === 'competitive_up') suffix = tLocal.mcSuffixUp;
                if (state.strategy === 'flat_beaten') suffix = tLocal.mcSuffixFlat;
                titleEl.innerHTML = `${tLocal.mcChartTreemap} <span class="text-xs font-normal text-slate-500">${suffix}</span>`;
            }

            treemapChart.setOption({
                tooltip: {
                    formatter: function (info) {
                        const smCode = info.data.smCode;
                        const fileName = logoFileMap[smCode] || smCode.toLowerCase();
                        const size = logoSizeMap[smCode] || logoSizeMap['DEFAULT'];
                        const logoHtml = `<img src="https://msbecky5354.github.io/JSON/img/${fileName}.png" onerror="this.style.display='none'" style="height:${size.height}px;width:${size.width}px;vertical-align:middle;margin-right:6px;border-radius:2px;display:inline-block;">`;
                        
                        return `<div style="font-weight:bold; margin-bottom:4px; border-bottom:1px solid #e2e8f0; padding-bottom:4px; color:#1e293b; display:flex; align-items:center;">${logoHtml}${info.name}</div>
                                <span style="color:#10b981; font-weight:900; font-size:16px;">${info.value}</span> <span style="color:#1e293b;">件</span>`;
                    },
                    backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#e2e8f0', borderWidth: 1
                },
                series: [{
                    type: 'treemap', data: treemapData, roam: false, nodeClick: false, breadcrumb: { show: false },
                    label: { 
                        show: true, position: 'inside', align: 'center',
                        formatter: function(params) {
                            if (params.value < 5) return `{name|${params.name}}\n{count|${params.value} 件}`; 
                            let rKey = params.data.richKey;
                            return `{${rKey}|}\n{name|${params.name}}\n{count|${params.value} 件}`; 
                        },
                        rich: dynamicRich
                    },
                    itemStyle: { borderColor: isDarkMode ? '#1e293b' : '#F8FAFC', borderWidth: 2 },
                    colorMappingBy: 'value', levels: [{ color: currentTreemapColor, colorAlpha: [0.8, 1] }]
                }]
            }, true);

            // ==========================================
            // 📊 2. Stacked Bar (Winners)
            // ==========================================
            const sortedSms = Object.keys(smBehaviors).filter(sm => smBehaviors[sm].total >= 1).sort((a, b) => smBehaviors[b].total - smBehaviors[a].total);

            const yAxisDataObj = sortedSms.map(sm => {
                return { value: getSmName(sm), textStyle: { color: getBrandColor(sm, isDarkMode) } };
            });
            const pctDown = sortedSms.map(sm => ((smBehaviors[sm].true_drop / smBehaviors[sm].total) * 100).toFixed(1));
            const pctFlat = sortedSms.map(sm => ((smBehaviors[sm].flat_beaten / smBehaviors[sm].total) * 100).toFixed(1));
            const pctUp = sortedSms.map(sm => ((smBehaviors[sm].competitive_up / smBehaviors[sm].total) * 100).toFixed(1));

            stackedBarChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: '{b}<br/>{a0}: <b>{c0}%</b><br/>{a1}: <b>{c1}%</b><br/>{a2}: <b>{c2}%</b>' },
                legend: { data: [legendDrop, legendFlat, legendUp], bottom: 0, itemWidth: 12, itemHeight: 12, textStyle: { fontWeight: 'bold', color: isDarkMode ? '#cbd5e1' : '#475569' } },
                grid: { left: '2%', right: '4%', bottom: '12%', top: '5%', containLabel: true },
                xAxis: { type: 'value', max: 100, axisLabel: { formatter: '{value}%', color: isDarkMode ? '#94a3b8' : '#64748b' }, splitLine: { lineStyle: { type: 'dashed', color: isDarkMode ? '#334155' : '#e2e8f0' } } },
                yAxis: { type: 'category', data: yAxisDataObj, axisLabel: { fontWeight: 'bold', cursor: 'pointer' }, inverse: true },
                series: [
                    { name: legendDrop, type: 'bar', stack: 'total', data: pctDown, itemStyle: { color: chartColors.true_drop, borderRadius: [2, 0, 0, 2] }, label: { show: true, position: 'inside', formatter: p => p.value > 5 ? p.value + '%' : '', color: '#fff', fontWeight: 'bold', fontSize: 11 } },
                    { name: legendFlat, type: 'bar', stack: 'total', data: pctFlat, itemStyle: { color: chartColors.flat_beaten }, label: { show: true, position: 'inside', formatter: p => p.value > 5 ? p.value + '%' : '', color: '#fff', fontWeight: 'bold', fontSize: 11 } },
                    { name: legendUp, type: 'bar', stack: 'total', data: pctUp, itemStyle: { color: chartColors.competitive_up, borderRadius: [0, 2, 2, 0] }, label: { show: true, position: 'inside', formatter: p => p.value > 5 ? p.value + '%' : '', color: '#fff', fontWeight: 'bold', fontSize: 11 } }
                ]
            });

            // ==========================================
            // 📊 3. Diverging SM Bar (Tracker)
            // ==========================================
            const finalSmCodes = Object.keys(trackerSmStats).sort((a, b) => (trackerSmStats[a]?.true_drop || 0) - (trackerSmStats[b]?.true_drop || 0)); 
            const divSmSeries = { true_drop: [], competitive_up: [] };
            finalSmCodes.forEach(sm => {
                divSmSeries.true_drop.push(-(trackerSmStats[sm]?.true_drop || 0));
                divSmSeries.competitive_up.push(trackerSmStats[sm]?.competitive_up || 0);
            });

            smDivergingChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: buildDivergingTooltip(trackerSmStats) },
                legend: { data: [legendDrop, legendUp], bottom: 0, textStyle: { color: isDarkMode ? '#cbd5e1' : '#475569' } },
                grid: { left: '2%', right: '4%', bottom: '10%', top: '5%', containLabel: true },
                xAxis: getXAxisConfig(), 
                yAxis: { 
                    type: 'category', 
                    data: finalSmCodes, 
                    axisLabel: { 
                        fontWeight: 'bold', 
                        formatter: function(value) { return getSmName(value); },
                        color: function(value) { return getBrandColor(value, isDarkMode); }, 
                        cursor: 'pointer' 
                    } 
                },
                color: divergingColors,
                series: [
                    { name: legendDrop, type: 'bar', stack: 'total', data: divSmSeries.true_drop },
                    { name: legendUp, type: 'bar', stack: 'total', data: divSmSeries.competitive_up }
                ]
            });

            // ==========================================
            // 📊 4. Diverging Cat Bar (Tracker)
            // ==========================================
            const catArray = Object.keys(catStats).map(cat => ({ name: cat, total: catStats[cat].true_drop + catStats[cat].competitive_up + catStats[cat].flat_beaten, stats: catStats[cat] }));
            catArray.sort((a, b) => b.total - a.total);
            const topCats = catArray.slice(0, 10).reverse(); 
            const catNames = topCats.map(c => ({ value: getCatName(c.name), name: c.name })); 
            
            const divCatSeries = { true_drop: [], competitive_up: [] };
            topCats.forEach(c => {
                divCatSeries.true_drop.push(-c.stats.true_drop);
                divCatSeries.competitive_up.push(c.stats.competitive_up);
            });

            catDivergingChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: buildDivergingTooltip(catStats) },
                legend: { data: [legendDrop, legendUp], bottom: 0, textStyle: { color: isDarkMode ? '#cbd5e1' : '#475569' } },
                grid: { left: '2%', right: '4%', bottom: '10%', top: '5%', containLabel: true },
                xAxis: getXAxisConfig(), 
                yAxis: { type: 'category', data: catNames, axisLabel: { fontWeight: 'bold', color: isDarkMode ? '#cbd5e1' : '#475569', cursor: 'pointer' } },
                color: divergingColors,
                series: [
                    { name: legendDrop, type: 'bar', stack: 'total', data: divCatSeries.true_drop },
                    { name: legendUp, type: 'bar', stack: 'total', data: divCatSeries.competitive_up }
                ]
            });
            
            document.getElementById('catDrillTitle').innerText = state.cat !== 'ALL' ? `(${tLocal.mcFilteredCat}${getCatName(state.cat)})` : "";
            document.getElementById('smDrillTitle').innerText = state.sm !== 'ALL' ? `(${tLocal.mcFilteredSm}${getSmName(state.sm)})` : "";
        }

        function handleSort(col) {
            if (state.sortCol === col) { state.sortAsc = !state.sortAsc; } 
            else { state.sortCol = col; state.sortAsc = true; }
            document.querySelectorAll('.sort-icon').forEach(el => {
                el.innerHTML = '↕';
                el.classList.remove('text-slate-500', 'dark:text-slate-300', 'font-black');
                el.classList.add('text-slate-300', 'dark:text-slate-500', 'font-normal');
            });
            const activeIcon = document.getElementById(`sort-${col}`);
            if (activeIcon) {
                activeIcon.innerHTML = state.sortAsc ? '↑' : '↓';
                activeIcon.classList.remove('text-slate-300', 'dark:text-slate-500', 'font-normal');
                activeIcon.classList.add('text-slate-500', 'dark:text-slate-300', 'font-black');
            }
            state.page = 1;
            renderTable();
        }

        function renderTable() {
            if (state.sortCol) {
                filteredData.sort((a, b) => {
                    let valA = a[state.sortCol]; let valB = b[state.sortCol];
                    if(state.sortCol === 'name') { valA = currentLang === 'en' ? a.nameEn : (currentLang === 'zh-Hans' ? a.nameSc : a.nameTc); valB = currentLang === 'en' ? b.nameEn : (currentLang === 'zh-Hans' ? b.nameSc : b.nameTc); }
                    if(state.sortCol === 'brand') { valA = currentLang === 'en' ? a.brandEn : (currentLang === 'zh-Hans' ? a.brandSc : a.brandTc); valB = currentLang === 'en' ? b.brandEn : (currentLang === 'zh-Hans' ? b.brandSc : b.brandTc); }
                    if(state.sortCol === 'sm') { valA = getSmName(a.sm); valB = getSmName(b.sm); }
                    if(state.sortCol === 'cat') { valA = getCatName(a.catRaw); valB = getCatName(b.catRaw); }

                    if (typeof valA === 'string') return state.sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    else return state.sortAsc ? valA - valB : valB - valA;
                });
            }

            const total = filteredData.length;
            const totalPages = Math.ceil(total / rowsPerPage) || 1;
            if (state.page > totalPages) state.page = totalPages;

            const startIdx = (state.page - 1) * rowsPerPage;
            const endIdx = Math.min(startIdx + rowsPerPage, total);
            const currentChunk = filteredData.slice(startIdx, endIdx);

            const thDiffCol = document.getElementById('th-diff-col');
            if (thDiffCol) {
                if (state.strategy === 'flat_beaten') thDiffCol.classList.add('hidden');
                else thDiffCol.classList.remove('hidden');
            }
            const hideDiffClass = state.strategy === 'flat_beaten' ? 'hidden' : '';

            const tLocal = localI18n[currentLang] || localI18n['zh-Hant'];

            let html = '';
            currentChunk.forEach((item, index) => {
                const conf = colorConfig[item.strategy];
                let lblConf = '未知';
                if(item.strategy === 'true_drop') lblConf = tLocal.mcPillDrop;
                if(item.strategy === 'competitive_up') lblConf = tLocal.mcPillUp;
                if(item.strategy === 'flat_beaten') lblConf = tLocal.mcPillFlat;
                
                const diffNum = item.diff;
                let diffTextColor = 'text-slate-400';
                let diffSign = '';
                
                if (diffNum <= -1.0) { diffTextColor = 'text-emerald-600 dark:text-emerald-400'; diffSign = ''; }
                else if (diffNum >= 1.0) { diffTextColor = 'text-amber-500 dark:text-amber-400'; diffSign = '+'; }

                const microBarHtml = `
                    <div class="flex items-center justify-center w-full min-w-[120px] ${hideDiffClass}">
                        <div class="w-1/2 flex justify-end pr-2">
                            <div class="h-1.5 bg-emerald-500 dark:bg-emerald-400 rounded-sm micro-bar" style="width: ${diffNum < 0 ? Math.min(Math.abs(diffNum)*2.5, 100) : 0}%;"></div>
                        </div>
                        <div class="w-14 text-center text-[11px] font-black ${diffTextColor}">${diffNum !== 0 ? diffSign + diffNum.toFixed(1) + '%' : '-'}</div>
                        <div class="w-1/2 flex justify-start pl-2">
                            <div class="h-1.5 bg-amber-500 dark:bg-amber-400 rounded-sm micro-bar" style="width: ${diffNum > 0 ? Math.min(diffNum*2.5, 100) : 0}%;"></div>
                        </div>
                    </div>
                `;

                const dName = currentLang === 'en' ? item.nameEn : (currentLang === 'zh-Hans' ? item.nameSc : item.nameTc);
                const dBrand = currentLang === 'en' ? item.brandEn : (currentLang === 'zh-Hans' ? item.brandSc : item.brandTc);
                const dOffer = currentLang === 'en' ? item.offerEn : (currentLang === 'zh-Hans' ? item.offerSc : item.offerTc);

                const avgBase = item.avgBase || 0;
                const devPct = item.dev || 0;
                const realDropPct = item.realDrop || 0;
                
                const devColor = devPct > 0 ? 'text-amber-600 bg-amber-50 border-amber-200 dark:text-amber-400 dark:bg-amber-900/30 dark:border-amber-800' : (devPct < 0 ? 'text-emerald-700 bg-emerald-50 border-emerald-200 dark:text-emerald-400 dark:bg-emerald-900/30 dark:border-emerald-800' : 'text-slate-500 bg-slate-100 border-slate-200 dark:text-slate-400 dark:bg-slate-800 dark:border-slate-700');
                const devSign = devPct > 0 ? '+' : '';
                
                const dropColor = realDropPct > 0 ? 'text-emerald-700 dark:text-emerald-400 font-black' : (realDropPct < 0 ? 'text-amber-600 dark:text-amber-400' : 'text-slate-400');
                const dropSign = realDropPct > 0 ? '↓ ' : (realDropPct < 0 ? '↑ ' : '');

                const displayBase = item.currBase > 0 ? item.currBase : item.curr;

                html += `
                <tr class="border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                    <td class="p-3 pl-5 text-center text-slate-400 dark:text-slate-500 font-bold text-[11px]">${startIdx + index + 1}</td>
                    <td class="p-3 dblclick-cell" title="Double-click to filter" ondblclick="applyStateFilter('sm', '${item.sm}')">${getSmBadge(item.sm)}</td>
                    <td class="p-3 text-[11px] text-slate-600 dark:text-slate-300 font-bold uppercase tracking-wider dblclick-cell" title="Double-click to filter" ondblclick="applyStateFilter('cat', '${item.catRaw}')">${getCatName(item.catRaw)}</td>
                    <td class="p-3">
                        <div class="font-bold text-slate-700 dark:text-slate-200 text-xs">${dBrand}</div>
                        <div class="text-[10px] text-red-600 dark:text-red-400 font-bold mt-0.5 max-w-[150px] truncate" title="${dOffer}">${dOffer !== '-' ? '🏷️ ' + dOffer : '-'}</div>
                    </td>
                    <td class="p-3 font-bold text-slate-800 dark:text-slate-100">${dName}</td>
                    
                    <td class="p-2 md:p-3 text-center dblclick-cell border-x border-slate-100 dark:border-slate-700 align-middle" title="Double-click to filter" ondblclick="applyStateFilter('strategy', '${item.strategy}')">
                        <div class="flex justify-center items-center">
                            <span class="px-2.5 py-1 border rounded font-black text-[11px] ${conf.style} pointer-events-none shadow-sm whitespace-nowrap tracking-wide min-w-[80px]">${lblConf}</span>
                        </div>
                    </td>
                    
                    <td class="p-3 text-right font-bold text-slate-400 line-through decoration-slate-300 dark:decoration-slate-600">${displayBase > 0 ? '$'+displayBase.toFixed(1) : '-'}</td>
                    <td class="p-3 text-right font-black text-emerald-600 dark:text-emerald-400 text-[14px] whitespace-nowrap">$${item.curr.toFixed(1)}</td>
                    
                    <td class="p-3 ${hideDiffClass}">${microBarHtml}</td>
                    
                    <td class="p-3 text-right font-bold text-slate-500 border-l border-slate-200 dark:border-slate-700 whitespace-nowrap">${avgBase > 0 ? '$' + avgBase.toFixed(1) : '-'}</td>
                    <td class="p-3 text-right"><span class="px-1.5 py-0.5 border rounded font-bold text-[11px] ${avgBase > 0 ? devColor : 'text-slate-500 bg-slate-100 border-slate-200 dark:text-slate-400 dark:bg-slate-800 dark:border-slate-700'}">${avgBase > 0 ? devSign + devPct.toFixed(1) + '%' : '-'}</span></td>
                    <td class="p-3 pr-5 text-right font-bold ${avgBase > 0 ? dropColor : 'text-slate-400'} text-[13px]">${avgBase > 0 ? dropSign + Math.abs(realDropPct).toFixed(1) + '%' : '-'}</td>
                </tr>`;
            });

            if (total === 0) html = `<tr><td colspan="12" class="p-10 text-center text-slate-400 font-bold">${tLocal.mcNoData}</td></tr>`;

            document.getElementById('tableBody').innerHTML = html;
            document.getElementById('pageStart').innerText = total === 0 ? 0 : startIdx + 1;
            document.getElementById('pageEnd').innerText = endIdx;
            document.getElementById('totalItems').innerText = total;
            document.getElementById('pageNumbers').innerText = `${state.page} / ${totalPages}`;

            document.getElementById('prevBtn').disabled = state.page === 1;
            document.getElementById('nextBtn').disabled = state.page === totalPages;
        }

        function openCalcInfoModal() {
            const modal = document.getElementById('calcInfoModal');
            const box = document.getElementById('calcInfoBox');
            if (modal && box) {
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
            }
        }

        function closeCalcInfoModal() {
            const modal = document.getElementById('calcInfoModal');
            const box = document.getElementById('calcInfoBox');
            if (modal && box) {
                modal.classList.add('opacity-0');
                box.classList.remove('scale-100'); box.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => applyStateFilter('search', e.target.value));
        document.getElementById('prevBtn').addEventListener('click', () => { if(state.page > 1) { state.page--; renderTable(); } });
        document.getElementById('nextBtn').addEventListener('click', () => { if(state.page < Math.ceil(filteredData.length / rowsPerPage)) { state.page++; renderTable(); } });

        const observer = new MutationObserver(() => {
            let newDark = document.documentElement.classList.contains('dark');
            if (newDark !== isDarkMode) {
                isDarkMode = newDark;
                initCharts();
                renderChartsFromFiltered();
            }
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

        fetchAndProcessData();
    </script>
</body>
</html>
