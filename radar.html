    <script>
        function initTheme() {
            const themeBtn = document.getElementById('themeBtn');
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if (themeBtn) themeBtn.textContent = '🌙';
            } else {
                document.documentElement.classList.remove('dark');
                if (themeBtn) themeBtn.textContent = '☀️';
            }
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const themeBtn = document.getElementById('themeBtn');
            if (document.documentElement.classList.contains('dark')) {
                themeBtn.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                themeBtn.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }
        initTheme();

        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || localStorage.getItem('appLang') || 'zh-Hant';
        let cachedData = [];
        let lastUpdatedTime = null;
        window.fullRadarList = []; 
        let currentSearchKw = '';

        let currentSortColumn = 'diffP';
        let currentSortAsc = false;

        function formatDateTime(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}`;
        }

        function openManual() {
            if (currentLang === 'zh-Hans') window.location.href = 'manual_cn.html';
            else if (currentLang === 'en') window.location.href = 'manual_en.html';
            else window.location.href = 'manual_tw.html';
        }

        const uiDict = {
            'zh-Hant': { appTitle: "慳真D", title: "跨超市海鮮價雷達", back: "返回", brand: "品牌", cat: "分類", name: "貨品名稱", maxP: "全城最貴 ($)", minP: "全城最平 ($)", diffP: "慳幾多 ($)", percent: "相差 (%)", bestSm: "推薦超市", loading: "正在掃描全城數據...", fail: "讀取失敗", cheapest: "全城最平", exp: "全城最貴", gap: "差價", noData: "暫時未有數據 🤷‍♂️", lastUpdated: "更新於: ", filterPlace: "搜尋分類、品牌、貨品或推薦超市...", optSmAll: "推薦超市 (全部)", optCatAll: "所有分類", optSortDiff: "🤑 慳最多金額", optSortPercent: "📉 相差比例最高", optSortMinP: "💰 最平價錢最低", optSortCustom: "自訂排序", qsLabel: "熱門搜尋:", qs1: "可樂", qs2: "紙巾", qs3: "百佳", qs4: "屈臣氏", compareBtn: "查全城 🔍" },
            'zh-Hans': { appTitle: "悭真D", title: "跨超市海鲜价雷达", back: "返回", brand: "品牌", cat: "分类", name: "商品名称", maxP: "全城最贵 ($)", minP: "全城最平 ($)", diffP: "省多少 ($)", percent: "相差 (%)", bestSm: "推荐超市", loading: "正在扫描全城数据...", fail: "读取失败", cheapest: "全城最平", exp: "全城最贵", gap: "差价", noData: "暂无数据 🤷‍♂️", lastUpdated: "更新于: ", filterPlace: "搜索分类、品牌、商品或推荐超市...", optSmAll: "推荐超市 (全部)", optCatAll: "所有分类", optSortDiff: "🤑 省最多金额", optSortPercent: "📉 相差比例最高", optSortMinP: "💰 最平价格最低", optSortCustom: "自定义排序", qsLabel: "热门搜索:", qs1: "可乐", qs2: "纸巾", qs3: "百佳", qs4: "屈臣氏", compareBtn: "查全城 🔍" },
            'en': { appTitle: "HK Smart Price", title: "Price Gap Radar", back: "Back", brand: "Brand", cat: "Category", name: "Product Name", maxP: "Max Price ($)", minP: "Min Price ($)", diffP: "Save ($)", percent: "Diff (%)", bestSm: "Best Supermarket", loading: "Scanning citywide data...", fail: "Load Failed", cheapest: "Lowest", exp: "Highest", gap: "Gap", noData: "No Data Found 🤷‍♂️", lastUpdated: "Updated: ", filterPlace: "Search category, brand, product or best store...", optSmAll: "Best Store (All)", optCatAll: "All Categories", optSortDiff: "🤑 Max Amount Saved", optSortPercent: "📉 Highest Diff %", optSortMinP: "💰 Lowest Price", optSortCustom: "Custom Sort", qsLabel: "Quick Search:", qs1: "Cola", qs2: "Tissue", qs3: "PARKnSHOP", qs4: "Watsons", compareBtn: "Check 🔍" }
        };

        function getSmName(code, lang) {
            let c = (code || '').toUpperCase();
            if (typeof supermarketDict !== 'undefined' && supermarketDict[lang] && supermarketDict[lang][c]) {
                return supermarketDict[lang][c];
            }
            return c; 
        }

        // 🌟 超市顏色標籤生成器
        function getSmColor(code) {
            let c = (code || '').toUpperCase();
            let bgCls = 'border-slate-200 bg-slate-50 dark:border-slate-700 dark:bg-slate-800';
            let textCls = 'text-slate-600 dark:text-slate-400';

            if (c === 'WELLCOME' || c === 'LUNGFUNG') { bgCls = 'border-red-200 bg-red-50/30 dark:border-red-900/50 dark:bg-red-900/20'; textCls = 'text-red-700 dark:text-red-400'; }
            else if (c === 'PARKNSHOP') { bgCls = 'border-blue-200 bg-blue-50/30 dark:border-blue-900/50 dark:bg-blue-900/20'; textCls = 'text-blue-700 dark:text-blue-400'; }
            else if (c === 'WATSONS') { bgCls = 'border-teal-200 bg-teal-50/30 dark:border-teal-900/50 dark:bg-teal-900/20'; textCls = 'text-teal-700 dark:text-teal-400'; }
            else if (c === 'HKTVMALL') { bgCls = 'border-green-200 bg-green-50/30 dark:border-green-900/50 dark:bg-green-900/20'; textCls = 'text-green-700 dark:text-green-400'; }
            else if (c === 'JASONS') { bgCls = 'border-emerald-300 bg-emerald-100/40 dark:border-emerald-900/50 dark:bg-emerald-900/20'; textCls = 'text-emerald-800 dark:text-emerald-400'; }
            else if (c === 'MANNINGS') { bgCls = 'border-orange-200 bg-orange-50/30 dark:border-orange-900/50 dark:bg-orange-900/20'; textCls = 'text-orange-600 dark:text-orange-400'; }
            else if (c === 'AEON') { bgCls = 'border-fuchsia-200 bg-fuchsia-50/30 dark:border-fuchsia-900/50 dark:bg-fuchsia-900/20'; textCls = 'text-fuchsia-700 dark:text-fuchsia-400'; }

            return { bg: bgCls, text: textCls };
        }

        // 🌟 跳轉搜索
        function redirectToGlobalSearch(keyword) {
            window.location.href = 'index.html?lang=' + currentLang + '&q=' + encodeURIComponent(keyword);
        }

        function changeLanguage(lang) {
            try {
                currentLang = lang;
                localStorage.setItem('appLang', lang); 
                
                const langSel = document.getElementById('langSelector');
                if(langSel) langSel.value = lang;

                let d = uiDict[lang] || uiDict['zh-Hant'];
                
                if(document.getElementById('appTitle')) document.getElementById('appTitle').innerText = d.appTitle;
                if(document.getElementById('pageTitleText')) document.getElementById('pageTitleText').innerText = d.title;
                if(document.getElementById('backBtn')) document.getElementById('backBtn').innerText = d.back;
                
                if(document.getElementById('filterInput')) document.getElementById('filterInput').placeholder = d.filterPlace;
                if(document.getElementById('optSmAll')) document.getElementById('optSmAll').innerText = d.optSmAll;
                if(document.getElementById('optCatAll')) document.getElementById('optCatAll').innerText = d.optCatAll;
                if(document.getElementById('optSortDiff')) document.getElementById('optSortDiff').innerText = d.optSortDiff;
                if(document.getElementById('optSortPercent')) document.getElementById('optSortPercent').innerText = d.optSortPercent;
                if(document.getElementById('optSortMinP')) document.getElementById('optSortMinP').innerText = d.optSortMinP;
                if(document.getElementById('optSortCustom')) document.getElementById('optSortCustom').innerText = d.optSortCustom;
                
                if(document.getElementById('qsLabel')) document.getElementById('qsLabel').innerText = d.qsLabel;
                if(document.getElementById('qs1')) document.getElementById('qs1').innerText = d.qs1;
                if(document.getElementById('qs2')) document.getElementById('qs2').innerText = d.qs2;
                if(document.getElementById('qs3')) document.getElementById('qs3').innerText = d.qs3;
                if(document.getElementById('qs4')) document.getElementById('qs4').innerText = d.qs4;

                if(document.getElementById('txt-cat')) document.getElementById('txt-cat').innerText = d.cat;
                if(document.getElementById('txt-brand')) document.getElementById('txt-brand').innerText = d.brand;
                if(document.getElementById('txt-label')) document.getElementById('txt-label').innerText = d.name;
                if(document.getElementById('txt-maxP')) document.getElementById('txt-maxP').innerText = d.maxP;
                if(document.getElementById('txt-minP')) document.getElementById('txt-minP').innerText = d.minP;
                if(document.getElementById('txt-diffP')) document.getElementById('txt-diffP').innerText = d.diffP;
                if(document.getElementById('txt-percent')) document.getElementById('txt-percent').innerText = d.percent;
                if(document.getElementById('txt-bestSm')) document.getElementById('txt-bestSm').innerText = d.bestSm;

                if(document.getElementById('loadingText1')) document.getElementById('loadingText1').innerText = d.loading;
                if(document.getElementById('loadingText2')) document.getElementById('loadingText2').innerText = d.loading;
                
                if (lastUpdatedTime && document.getElementById('todayStatusLabel')) {
                    document.getElementById('todayStatusLabel').innerText = (d.lastUpdated || '更新於: ') + formatDateTime(lastUpdatedTime);
                }

                if(cachedData.length > 0) applyFilters();
            } catch(e) { console.warn(e); }
        }

        async function loadRadarData() {
            try {
                const [timeRes, dataRes] = await Promise.all([
                    fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/update_log.txt"),
                    fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/pricewatch.json")
                ]);

                if (timeRes.ok) {
                    const timeText = await timeRes.text();
                    lastUpdatedTime = new Date(timeText.trim());
                    changeLanguage(currentLang); 
                }

                if(!dataRes.ok) throw new Error("HTTP " + dataRes.status);
                const rawData = await dataRes.json();
                cachedData = Array.isArray(rawData) ? rawData : (rawData.data || []);
                processAndRender(cachedData);
            } catch (e) {
                const failMsg = uiDict[currentLang] ? uiDict[currentLang].fail : "Failed";
                document.getElementById('radarTableBody').innerHTML = `<tr><td colspan="9" class="text-center py-10 text-red-500 font-bold">${failMsg}</td></tr>`;
                document.getElementById('radarMobileList').innerHTML = `<div class="text-center py-10 text-red-500 font-bold">${failMsg}</div>`;
            }
        }

   // 💡 1. 修正 populateDropdowns：配合 lang.js 的 uiText，並使用 Raw Key 做 ID
       function populateDropdowns(list) {
            const smSelect = document.getElementById('smFilter');
            const catSelect = document.getElementById('catFilter');
            if(!smSelect || !catSelect) return;

            const smVal = smSelect.value;
            const catVal = catSelect.value;
            
            const smCodes = Array.from(new Set(list.map(i => i.smCode))).sort();
            smSelect.innerHTML = `<option value="ALL">${uiDict[currentLang].optSmAll}</option>` + 
                smCodes.map(c => `<option value="${c}">${getSmName(c, currentLang)}</option>`).join('');
            smSelect.value = smVal;

            const catKeys = Array.from(new Set(list.map(i => i.categoryRaw || 'Other'))).sort();
            catSelect.innerHTML = `<option value="ALL">${uiDict[currentLang].optCatAll}</option>` + 
                catKeys.map(key => {
                    let item = list.find(i => (i.categoryRaw || 'Other') === key);
                    let label = (typeof item.category === 'object') ? (item.category[currentLang] || item.category['zh-Hant']) : key;
                    return `<option value="${key}">${label}</option>`;
                }).join('');
            catSelect.value = catVal;
        }
        function updateClearBtn() {
            const btn = document.getElementById('clearSearchBtn');
            if (currentSearchKw.length > 0) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        }

        function setQuickSearch(kw) {
            document.getElementById('filterInput').value = kw;
            currentSearchKw = kw.toLowerCase().trim();
            updateClearBtn();
            applyFilters();
        }

        document.getElementById('filterInput').addEventListener('input', function(e) {
            currentSearchKw = e.target.value.toLowerCase().trim();
            updateClearBtn();
            applyFilters();
        });

        function handleDropdownSort() {
            let val = document.getElementById('sortFilter').value;
            if (val === 'custom') return; 
            let parts = val.split('_');
            currentSortColumn = parts[0];
            currentSortAsc = (parts[1] === 'asc');
            applyFilters();
        }

        function handleSort(col) {
            if (currentSortColumn === col) {
                currentSortAsc = !currentSortAsc; 
            } else {
                currentSortColumn = col;
                currentSortAsc = true; 
            }
            
            let dropdown = document.getElementById('sortFilter');
            let matchedVal = currentSortColumn + '_' + (currentSortAsc ? 'asc' : 'desc');
            let optionExists = Array.from(dropdown.options).some(opt => opt.value === matchedVal);
            
            if(optionExists) {
                dropdown.value = matchedVal;
            } else {
                dropdown.value = 'custom'; 
            }
            applyFilters();
        }

        // 💡 2. 修正 applyFilters：使用 smCode 同 categoryRaw 做對比
        function applyFilters() {
            const sm = document.getElementById('smFilter').value;
            const cat = document.getElementById('catFilter').value;
            const filterInput = document.getElementById('filterInput');
            const kw = filterInput ? filterInput.value.toLowerCase() : ''; // 💡 只宣告一次 kw
            
            let filtered = window.fullRadarList.filter(item => {
                const matchSm = sm === 'ALL' || item.smCode === sm;
                const matchCat = cat === 'ALL' || (item.categoryRaw || 'Other') === cat;
                
                const nameStr = (typeof item.name === 'object') ? (item.name[currentLang] || item.name['zh-Hant'] || '').toLowerCase() : (item.name || '').toLowerCase();
                const brandStr = (typeof item.brand === 'object') ? (item.brand[currentLang] || item.brand['zh-Hant'] || '').toLowerCase() : (item.brand || '').toLowerCase();
                
                const matchKw = !kw || nameStr.includes(kw) || brandStr.includes(kw);
                return matchSm && matchCat && matchKw;
            });
            renderUI(filtered.slice(0, 100));
        }


        // 💡 3. 修正 processAndRender：儲存原始 Object (Raw Data)
       function processAndRender(items) {
            let radarList = [];
            items.forEach(item => {
                if (Array.isArray(item.prices) && item.prices.length >= 2) {
                    let validPrices = item.prices.map(p => ({
                        smCode: (p.supermarketCode || p.supermarket || "UNKNOWN").toUpperCase(),
                        price: parseFloat(p.price)
                    })).filter(p => !isNaN(p.price));
                    
                    if (validPrices.length >= 2) {
                        let min = validPrices.reduce((a, b) => a.price < b.price ? a : b);
                        let max = validPrices.reduce((a, b) => a.price > b.price ? a : b);
                        
                        radarList.push({ 
                            brand: item.brand, 
                            category: item.cat1Name,
                            categoryRaw: item.cat1Name ? (item.cat1Name['zh-Hant'] || 'Other') : 'Other',
                            name: item.name, 
                            maxP: max.price, 
                            minP: min.price, 
                            diffP: max.price - min.price, 
                            percent: ((max.price - min.price) / min.price) * 100, 
                            smCode: min.smCode 
                        });
                    }
                }
            });
            window.fullRadarList = radarList;
            populateDropdowns(radarList);
            applyFilters();
        }


        function renderUI(list) {
    let d = uiDict[currentLang];
    if (list.length === 0) {
        document.getElementById('radarTableBody').innerHTML = `<tr><td colspan="9" class="text-center py-10 text-slate-500">${d.noData}</td></tr>`;
        document.getElementById('radarMobileList').innerHTML = `<div class="text-center py-10 text-slate-500">${d.noData}</div>`;
        return;
    }

    // Desktop 表格渲染
    document.getElementById('radarTableBody').innerHTML = list.map(item => {
        let smStyle = getSmColor(item.smCode);
        let smLabelHtml = getSmName(item.smCode, currentLang);
        if (item.smCode === 'JASONS') {
            smLabelHtml = `<div class="flex flex-col items-center leading-tight"><span>Jasons</span><span class="text-[10px] opacity-90">(Market Place)</span></div>`;
        }

        // 💡 修正：先用 getText 拎文字，再處理 replace
        let catText = getText(item.category, currentLang);
        let brandText = getText(item.brand, currentLang);
        let nameText = getText(item.name, currentLang);
        
        let escapedQuery = nameText.replace(/'/g, "\\'");

        return `
        <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/40 transition border-b border-slate-100 dark:border-slate-700">
            <td class="py-3 px-4 text-sm text-slate-500 text-center cursor-pointer hover:text-blue-600 hover:underline" onclick="setQuickSearch('${catText.replace(/'/g, "\\'")}')">${catText}</td>
            <td class="py-3 px-4 text-sm text-slate-600 text-center cursor-pointer hover:text-blue-600 hover:underline" onclick="setQuickSearch('${brandText.replace(/'/g, "\\'")}')">${brandText}</td>
            <td class="py-3 px-4 text-sm font-medium text-slate-800 cursor-pointer hover:text-blue-600 hover:underline flex items-center justify-between" onclick="redirectToGlobalSearch('${escapedQuery}')">
                <span>${nameText}</span>
                <span class="text-[11px] text-blue-500 font-bold bg-blue-50 px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100">查全城 🔍</span>
            </td>
            <td class="py-3 px-4 text-sm text-right">${item.maxP.toFixed(1)}</td>
            <td class="py-3 px-4 text-sm font-bold text-green-600 text-right">${item.minP.toFixed(1)}</td>
            <td class="py-3 px-4 text-sm text-right">${item.diffP.toFixed(1)}</td>
            <td class="py-3 px-4 text-sm font-bold text-red-500 text-right">+${item.percent.toFixed(1)}%</td>
            <td class="py-3 px-4 text-sm text-center cursor-pointer hover:opacity-80" onclick="setQuickSearch('${getSmName(item.smCode, currentLang).replace(/'/g, "\\'")}')">
                <span class="inline-block px-2.5 py-1 rounded-lg border ${smStyle.bg} ${smStyle.text}">${smLabelHtml}</span>
            </td>
            <td class="py-3 px-4 text-center">
                <button onclick="redirectToGlobalSearch('${escapedQuery}')" class="px-2 py-1 text-xs font-bold text-white bg-blue-600 rounded-lg">${d.compareBtn}</button>
            </td>
        </tr>`;
    }).join('');

    // Mobile 列表渲染
    document.getElementById('radarMobileList').innerHTML = list.map(item => {
        let smStyle = getSmColor(item.smCode);
        let catText = getText(item.category, currentLang);
        let brandText = getText(item.brand, currentLang);
        let nameText = getText(item.name, currentLang);
        let escapedQuery = nameText.replace(/'/g, "\\'");

        return `
        <div class="bg-white dark:bg-slate-800 border rounded-2xl p-4 shadow-sm">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full cursor-pointer" onclick="setQuickSearch('${catText.replace(/'/g, "\\'")}')">${catText}</span>
                <span class="text-[11px] text-blue-500 font-bold uppercase">${brandText}</span>
            </div>
            <div onclick="redirectToGlobalSearch('${escapedQuery}')" class="text-[14px] font-bold text-slate-800 cursor-pointer hover:text-blue-600">
                ${nameText}
            </div>
        </div>`;
    }).join('');
}

loadRadarData();

// 你喺 script 入面要定義呢個 helper
function getText(obj, lang) {
    if (!obj) return '-';
    if (typeof obj !== 'object') return obj;
    return obj[lang] || obj['zh-Hant'] || obj['en'] || Object.values(obj)[0];
}
