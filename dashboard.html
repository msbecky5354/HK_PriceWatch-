<script>
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    
    let treemapChartHc = null;
    let heatmapChartHc = null;
    
    let globalNormalizedData = [];
    let currentHeatmapModeHc = 'real'; 
    let mainLastUpdatedTime = null;
    let biLastUpdatedTime = null;

    window.switchMainTab = function(tabId) {
        const btnTree = document.getElementById('tabBtnTree');
        const btnHeat = document.getElementById('tabBtnHeat');
        const viewTree = document.getElementById('viewTree');
        const viewHeat = document.getElementById('viewHeat');

        const activeClass = "px-6 py-2.5 rounded-lg font-bold text-[14px] bg-white dark:bg-slate-800 shadow-sm text-blue-600 dark:text-blue-400 transition-all";
        const inactiveClass = "px-6 py-2.5 rounded-lg font-bold text-[14px] text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-all";

        if (tabId === 'tree') {
            btnTree.className = activeClass;
            btnHeat.className = inactiveClass;
            viewTree.classList.remove('hidden');
            viewHeat.classList.add('hidden');
            setTimeout(() => { if (treemapChartHc) treemapChartHc.resize(); }, 50);
        } else {
            btnHeat.className = activeClass;
            btnTree.className = inactiveClass;
            viewHeat.classList.remove('hidden');
            viewTree.classList.add('hidden');
            setTimeout(() => { if (heatmapChartHc) heatmapChartHc.resize(); }, 50);
        }
    };

    window.switchHeatmapMode = function(mode, isHc) {
        if (isHc) {
            currentHeatmapModeHc = mode;
            const btnReal = document.getElementById('btnHeatModeRealHc');
            const btnMarket = document.getElementById('btnHeatModeMarketHc');
            if (mode === 'real') {
                btnReal.className = "px-4 py-1.5 text-[12px] font-bold rounded-md bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 shadow-sm transition-all";
                btnMarket.className = "px-4 py-1.5 text-[12px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
            } else {
                btnMarket.className = "px-4 py-1.5 text-[12px] font-bold rounded-md bg-white dark:bg-slate-800 text-orange-600 dark:text-orange-400 shadow-sm transition-all";
                btnReal.className = "px-4 py-1.5 text-[12px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
            }
            updateHardcoreCharts();
        }
    };

    function openMechanismModal() { document.getElementById('mechanismModal').classList.remove('hidden'); }
    function closeMechanismModal() { document.getElementById('mechanismModal').classList.add('hidden'); }

    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    const i18n = {
        'zh-Hant': { 
            title: '降價分析看板', sub: '實時視覺化降價分佈，並與真降價數據表進行交叉比對', back: '返回', 
            tabTree: '🔲 降價分佈版圖', tabHeat: '🔥 降幅深度熱力矩陣',
            btnReal: '📉 自身真降幅', btnMarket: '⚔️ 擊穿市價幅',
            opt0: '全部真降價貨品 (顯示全部)', opt5: '≥ 5% (降幅門檻)', opt10: '≥ 10% (降幅門檻)', opt15: '≥ 15% (降幅門檻)', opt20: '≥ 20% (降幅門檻)',
            loading: '數據匯入中...', ttDrop: '真降價件數：', ttShare: '規模佔比：', itemUnit: '件'
        },
        'zh-Hans': { 
            title: '降价分析看板', sub: '实时可视化降价分布，并与真降价数据表进行交叉比对', back: '返回', 
            tabTree: '🔲 降价分布版图', tabHeat: '🔥 降幅深度热力矩阵',
            btnReal: '📉 自身真降幅', btnMarket: '⚔️ 击穿市价幅',
            opt0: '全部真降价商品 (显示全部)', opt5: '≥ 5% (降幅门槛)', opt10: '≥ 10% (降幅门槛)', opt15: '≥ 15% (降幅门槛)', opt20: '≥ 20% (降幅门槛)',
            loading: '数据汇入中...', ttDrop: '真降价件数：', ttShare: '规模占比：', itemUnit: '件'
        },
        'en': { 
            title: 'Discount Analytics Dashboard', sub: 'Visualizing real-time discount distribution and cross-checking with the True Discount datatable', back: 'Back',

            btnReal: '📉 True Drop', btnMarket: '⚔️ Market Drop',

            loading: 'Loading Data...', ttDrop: 'Drop Items:', ttShare: 'Market Share:', itemUnit: 'items'
        }
    };

    function updateLocalLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);
        const t = i18n[lang] || i18n['zh-Hant'];

        const appName = lang === 'en' ? 'SmartDeal' : (lang === 'zh-Hans' ? '悭真D' : '慳真D');
        document.title = `${t.title} | ${appName}🔎`;

        const setTxt = (id, txt) => { const el = document.getElementById(id); if (el) el.innerText = txt; };
        const setElHtml = (id, html) => { const el = document.getElementById(id); if (el && html) el.innerHTML = html; };
        
        setTxt('pageTitleText', t.title);
        setTxt('subTitleText', t.sub);
        setTxt('backBtn', t.back);

        setTxt('tabBtnTree', t.tabTree);
        setTxt('tabBtnHeat', t.tabHeat);
        
        setTxt('btnHeatModeRealHc', t.btnReal);
        setTxt('btnHeatModeMarketHc', t.btnMarket);

        const hcSelect = document.getElementById('hcThreshold');
        if (hcSelect && hcSelect.options.length >= 5) {
            hcSelect.options[0].text = t.opt0;
            hcSelect.options[1].text = t.opt5;
            hcSelect.options[2].text = t.opt10;
            hcSelect.options[3].text = t.opt15;
            hcSelect.options[4].text = t.opt20;
        }

        const lblHcMatchedTxt = lang === 'en' ? 'Items Matching Criteria:' : (lang === 'zh-Hans' ? '符合条件:' : '符合條件:');
        const lblHcReducedTxt = lang === 'en' ? 'Reduction:' : (lang === 'zh-Hans' ? '对比全量减少:' : '對比全量減少:');
        const lblHcUnitTxt = lang === 'en' ? 'items' : '件';

        setTxt('lblHcMatched', lblHcMatchedTxt);
        setTxt('lblHcReduced', lblHcReducedTxt);
        setTxt('lblHcUnit1', lblHcUnitTxt);
        setTxt('lblHcUnit2', lblHcUnitTxt);

        const statusLabel = document.getElementById('todayStatusLabel');
        if (statusLabel) {
            if (mainLastUpdatedTime && !isNaN(mainLastUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Updated: ' : (lang === 'zh-Hans' ? '更新于: ' : '更新於: ');
                statusLabel.innerText = prefix + formatDateTime(mainLastUpdatedTime);
            } else {
                statusLabel.innerText = lang === 'en' ? 'Loading...' : (lang === 'zh-Hans' ? '载入中...' : '載入中...');
            }
        }

        const biBadge = document.getElementById('biUpdateBadge');
        if (biBadge) {
            if (biLastUpdatedTime && !isNaN(biLastUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Data Updated: ' : (lang === 'zh-Hans' ? '战情更新于: ' : '戰情更新於: ');
                biBadge.innerText = prefix + formatDateTime(biLastUpdatedTime);
            } else {
                biBadge.innerText = lang === 'en' ? 'Loading...' : (lang === 'zh-Hans' ? '载入中...' : '載入中...');
            }
        }

        const uiDict = (typeof uiText !== 'undefined' && uiText[lang]) ? uiText[lang] : null;
        if (uiDict) {
            setTxt('miniFooterLinks', uiDict.miniFooterLinks || '關於我們、條款及免責聲明');
            setTxt('miniFooterCopy', uiDict.miniFooterCopy || '© 2026 慳真D');
            setTxt('disclaimerTitle', uiDict.disclaimerTitle || '免責聲明及服務條款');
            setElHtml('disclaimerBody', uiDict.disclaimerText || '請參閱首頁免責聲明內容。');
            setTxt('modalCloseBtn', uiDict.modalBtn || '我明白及接受');
        } else {
            setTxt('miniFooterLinks', lang === 'en' ? 'About Us, Terms & Disclaimer' : (lang === 'zh-Hans' ? '关于我们、条款及免责声明' : '關於我們、條款及免責聲明'));
            setTxt('miniFooterCopy', lang === 'en' ? '© 2026 SmartDeal' : '© 2026 慳真D');
            setTxt('disclaimerTitle', lang === 'en' ? 'Disclaimer & Terms' : (lang === 'zh-Hans' ? '免责声明及服务条款' : '免責聲明及服務條款'));
            setTxt('modalCloseBtn', lang === 'en' ? 'I Understand & Accept' : '我明白及接受');
        }

        if (devTeam) devTeam.innerText = lang === 'en' ? 'Developed by: ' : (lang === 'zh-Hans' ? '开发团队: ' : '開發團隊: ');

        const devName = document.getElementById('footerDevName');
        if (devName) devName.innerText = lang === 'en' ? 'Lazy Tools Station' : (lang === 'zh-Hans' ? '懒人工具站' : '懒人工具駅');

        const mechText = {
            'zh-Hant': {
                title: '📊 降價分析看板：運算與視覺化聲明',

                r1t: '📉 甚麼是「真降價」？', r1d: '系統每日將即時標價與 <b>2025 年 12 月 31 日以來</b> 的最新歷史紀錄進行比對。唯有當「今日折實價」嚴格 <b>低於</b>「上次紀錄之折實價」時，該貨品方會被系統認證為「真降價」，藉此精準過濾表面促銷的營銷錯覺。',
                r2t: '🔲 降價分佈版圖 (Treemap)', r2d: '圖表中的方塊面積越大，代表該超市符合「真降價」標準的貨品數量越多，直觀反映其投入降價的貨品實質規模。',
                r3t: '🔥 降幅深度熱力矩陣 (Heatmap)', r3d: '展示各超市在不同貨品分類的整體折讓力度。色塊越深（偏紅），代表該品類的「平均真降幅」越大；色塊越淺（偏黃），代表降幅微弱。',
                r4t: '⚖️ 重要免責聲明 (Legal Compliance)', r4d: '<p><b>1. 按原樣提供 (As-Is)</b>：本面板數據基於第三方公開資料實時抓取及電腦運算，本程式不保證數據絕對無延遲或零誤差。</p><p><b>2. 第三方數據免責</b>：因零售商隨時更改定價或第三方接口延遲導致之價格落差，本平台概不負責。所有資訊僅供參考，不構成任何消費建議，請以實體店最終標價為準。</p>',
                btn: '我明白及接受'
            },

    function processDataForCharts(rawData, threshold) {
        let treeMapAgg = {};
        let heatMapAgg = {};
        let totalItems = 0;

        rawData.forEach(item => {
            let catRaw = item._catRaw;
            let smCode = item._smCode;

            if (!treeMapAgg[catRaw]) treeMapAgg[catRaw] = {};
            if (!treeMapAgg[catRaw][smCode]) treeMapAgg[catRaw][smCode] = { base: 0, filtered: 0 };
            
            let heatKey = `${smCode}_${catRaw}`;
            if (!heatMapAgg[heatKey]) {
                heatMapAgg[heatKey] = { store: smCode, category: catRaw, baseCount: 0, count: 0, sumReal: 0, sumMarket: 0, marketCount: 0 };
            }

            treeMapAgg[catRaw][smCode].base++;
            heatMapAgg[heatKey].baseCount++;

            if (item._normalizedRealDrop >= threshold) {
                treeMapAgg[catRaw][smCode].filtered++;
                heatMapAgg[heatKey].count++;
                heatMapAgg[heatKey].sumReal += item._normalizedRealDrop;
                
                if (item._hasComp) {
                    heatMapAgg[heatKey].sumMarket += item._normalizedMarketDrop;
                    heatMapAgg[heatKey].marketCount++;
                }
                totalItems++;
            }
        });

        let treemapData = Object.keys(treeMapAgg).map(cat => ({
            name: cat,
            children: Object.keys(treeMapAgg[cat]).map(sm => ({
                name: sm,
                value: treeMapAgg[cat][sm].filtered,
                baseValue: treeMapAgg[cat][sm].base 
            }))
        }));

        let heatmapData = Object.values(heatMapAgg).map(agg => ({
            store: agg.store,
            category: agg.category,
            count: agg.count,
            baseCount: agg.baseCount, 
            avgDiscount: agg.count > 0 ? (agg.sumReal / agg.count) : 0,
            avgMarketDrop: agg.marketCount > 0 ? (agg.sumMarket / agg.marketCount) : 0
        }));

        return { treemapData, heatmapData, totalItems };
    }

    window.updateHardcoreCharts = function() {

        renderTreemap(treemapChartHc, processed.treemapData, processed.totalItems, threshold);
        renderHeatmap(heatmapChartHc, processed.heatmapData, currentHeatmapModeHc, threshold);

        const baseCount = globalNormalizedData.length;
        const currentCount = processed.totalItems;
        const dropCount = baseCount - currentCount;
        const dropPct = baseCount > 0 ? ((dropCount / baseCount) * 100).toFixed(1) : 0;

        const countEl = document.getElementById('hcSumCount');
        const dropEl = document.getElementById('hcSumDrop');
        const dropPctEl = document.getElementById('hcSumDropPct');
        
        if (countEl) countEl.innerText = currentCount;

        async function fetchWithRetry(url, options = {}, retries = 3, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return await res.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    console.warn(`Fetch 失敗，${delay * Math.pow(2, i)}ms 後進行第 ${i + 1} 次重試...`);
                    await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, i)));

                updateLocalLanguage(currentLang);

        async function loadTrueDiscountData() {
            let fallbackUrl = `https://msbecky5354.github.io/JSON/data/bi_true_discount.json?v=${nocache}`;
            let primaryUrl = `https://cdn.jsdelivr.net/gh/msbecky5354/JSON@main/data/bi_true_discount.json`;
            let payload = null;

            try {
                const res = await fetch(primaryUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error('CDN API Failed');
                payload = await res.json();
            } catch (err) {
                console.warn("🔄 切換至備用線路 (Fallback to Raw GitHub)...");
                payload = await fetchWithRetry(fallbackUrl, { cache: 'no-store' });
            }
            return payload;
        }

        loadTrueDiscountData()
            .then(payload => {
                let data = payload;
                if (!Array.isArray(data) && (data.results || data.data)) data = data.results || data.data;
                if (!Array.isArray(data)) data = [data];
                if (data.length > 0 && data[0].json && data[0].json.true_discount_json) data = data[0].json.true_discount_json;
                else if (data.length > 0 && data[0].true_discount_json) data = data[0].true_discount_json;
                else if (data.length > 0 && data[0].json) data = data.map(i => i.json);
                if (data.length === 1 && data[0].true_discount_json) data = data[0].true_discount_json;

               globalNormalizedData = data.filter(item => {
    if (item.rn !== undefined && parseInt(item.rn) !== 1) return false;
    if (item.route_flag !== undefined && String(item.route_flag).includes('secondary')) return false;

    // 🚀 1. 極速 Key 檢查 (如果你個 JSON 啱啱好有呢兩個名)
    if (item.status && !String(item.status).includes('真降價')) return false;
    if (item.priceStatus && !String(item.priceStatus).includes('真降價')) return false;

    // 🚀 2. 終極防 Crash 純數學包底：舊價 <= 新價，代表根本無跌過，即刻踢走！
    let prevE = parseFloat(item.prevEffPrice) || 0;
    let currE = parseFloat(item.effectivePrice) || 0;
    if (prevE <= currE) return false;

    return true;
}).map(item => {
    
                    let smCode = (item.smCode || 'Unknown').toUpperCase().trim();
                    let catRaw = typeof item.categoryRaw === 'object' ? (item.categoryRaw['zh-Hant'] || '') : String(item.categoryRaw || '');
                    if (!catRaw) catRaw = '未分類';

                    let prevE = parseFloat(item.prevEffPrice) || 0;
                    let currE = parseFloat(item.effectivePrice) || 0;
                    let realDrop = parseFloat(item.realDiscountPct) || 0;
                    if (prevE > currE && realDrop === 0) {
                        realDrop = ((prevE - currE) / prevE) * 100;
                    }

                    let marketDrop = parseFloat(item.marketDropPct) || 0;
                    let hasComp = false;
                    if (item.otherPricesRaw && item.otherPricesRaw !== '[]' && item.otherPricesRaw !== 'null') {
                        try {
                            let opRaw = typeof item.otherPricesRaw === 'string' ? JSON.parse(item.otherPricesRaw) : item.otherPricesRaw;
                            if (Array.isArray(opRaw)) {
                                opRaw = opRaw.filter(op => op.smCode !== smCode);
                                if (opRaw.length > 0) hasComp = true;
                            }
                        } catch(e) {}
                    }

                    item._normalizedRealDrop = realDrop;
                    item._normalizedMarketDrop = marketDrop;
                    item._smCode = smCode;
                    item._catRaw = catRaw;
                    item._hasComp = hasComp;
                    return item;
                });

                treemapChartHc.hideLoading();
                heatmapChartHc.hideLoading();
                
                updateHardcoreCharts();
            })
            .catch(e => {
                console.error("Dashboard Data Fetch Error:", e);
                treemapChartHc.hideLoading(); heatmapChartHc.hideLoading();
                const errorHtml = `<div class="flex flex-col items-center justify-center mt-20 gap-3">
                                     <span class="text-red-500 font-bold">⚠️ 網絡連線稍慢，無法載入數據。</span>
                                     <button onclick="location.reload()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-sm text-slate-700 dark:text-slate-300 font-bold transition shadow-sm active:scale-95">🔄 重新載入</button>
                                   </div>`;
                document.getElementById('treemapChartHc').innerHTML = errorHtml;
                document.getElementById('heatmapChartHc').innerHTML = errorHtml;
            });

        window.addEventListener('resize', () => { 
            if(treemapChartHc) treemapChartHc.resize(); 
            if(heatmapChartHc) heatmapChartHc.resize(); 
        });
    });
</script>
