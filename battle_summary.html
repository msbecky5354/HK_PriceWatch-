<script>
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    let lastUpdatedTime = null;
    let globalLeaderboardData = []; 

    function getText(content, lang) {
        if (!content) return '-';
        if (typeof content === 'string') return content;
        if (typeof content === 'object') {
            return content[lang] || content['zh-Hant'] || Object.values(content)[0] || '-';
        }
        return String(content);
    }

    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function getSmName(code, lang) {
        let c = (code || '').toUpperCase();
        if (typeof supermarketDict !== 'undefined' && supermarketDict[lang] && supermarketDict[lang][c]) return supermarketDict[lang][c];
        if (typeof supermarketDict !== 'undefined' && supermarketDict['zh-Hant'] && supermarketDict['zh-Hant'][c]) return supermarketDict['zh-Hant'][c];
        return c;
    }

    function goToProductSearch(productName) {
        window.location.href = 'index.html?lang=' + currentLang + '&q=' + encodeURIComponent(productName);
    }

    function openMechanismModal() { document.getElementById('mechanismModal').classList.remove('hidden'); }
    function closeMechanismModal() { document.getElementById('mechanismModal').classList.add('hidden'); }

    async function loadBattleSummaryData() {
        try {
            const container = document.getElementById('battleSummaryContainer');
            let loadingStr = currentLang === 'en' ? '⏳ Calculating Live Battle Data...' : (currentLang === 'zh-Hans' ? '⏳ 正在即时运算战情数据...' : '⏳ 正在即時運算戰情數據...');
            container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500 dark:text-slate-400 animate-pulse text-[15px]">${loadingStr}</div>`;

            let commitSha = '';
            try {
                const apiRes = await fetch('https://api.github.com/repos/msbecky5354/HK_PriceWatch-/commits/main');
                if (apiRes.ok) commitSha = (await apiRes.json()).sha;
            } catch (e) {}

            let dataUrl, logUrl;
            if (commitSha) {
                dataUrl = "https://cdn.jsdelivr.net/gh/msbecky5354/HK_PriceWatch-@" + commitSha + "/data/pricewatch.json";
                logUrl = "https://cdn.jsdelivr.net/gh/msbecky5354/HK_PriceWatch-@" + commitSha + "/data/update_log.txt";
            } else {
                const nocache = new Date().getTime();
                dataUrl = "https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/pricewatch.json?v=" + nocache;
                logUrl = "https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/update_log.txt?v=" + nocache;
            }

            const [dataRes, logRes] = await Promise.all([
                fetch(dataUrl, { cache: 'no-store' }),
                fetch(logUrl, { cache: 'no-store' }).catch(e => null)
            ]);

            if (!dataRes.ok) throw new Error("無法取得最新官方價格數據");
            const rawApiData = await dataRes.json();
            
            if (logRes && logRes.ok) {
                let text = await logRes.text();
                lastUpdatedTime = new Date(text.trim());
            } else {
                lastUpdatedTime = new Date();
            }

            let leaderboard = [];

            rawApiData.forEach(item => {
                if (!item.prices || !Array.isArray(item.prices)) return;
                
                let validPrices = [];
                item.prices.forEach(p => {
                    let codeUpper = (p.supermarketCode || '').toUpperCase();
                    if (codeUpper === 'ZTORE') return; 

                    let basePrice = parseFloat(p.price);
                    if (isNaN(basePrice)) return;
                    
                    let effPrice = basePrice;
                    let promoCalcEn = '';
                    
                    const promoKeys = ['offers', 'promotions', 'promotion', 'offer'];
                    for (let key of promoKeys) {
                        if (Array.isArray(item[key])) {
                            let matchingOffer = item[key].find(o => String(o.supermarketCode) === String(p.supermarketCode));
                            if (matchingOffer) {
                                let exEn = typeof extractDeepPromoText === 'function' ? extractDeepPromoText(matchingOffer, 'en') : '';
                                if (exEn && exEn !== "[object Object]") promoCalcEn = exEn; break; 
                            }
                        } else if (p[key]) {
                            let exEn = typeof extractDeepPromoText === 'function' ? extractDeepPromoText(p[key], 'en') : '';
                            if (exEn && exEn !== "[object Object]") promoCalcEn = exEn; break;
                        }
                    }
                    
                    if (typeof calculateAvgPrice === 'function') {
                        let avg = calculateAvgPrice(promoCalcEn, basePrice);
                        if (avg && avg > 0 && avg < basePrice) effPrice = avg;
                    }
                    
                    validPrices.push({ smCode: codeUpper, effPrice: effPrice });
                });
                
                if (validPrices.length < 2) return; 
                
                let avgPrice = validPrices.reduce((acc, curr) => acc + curr.effPrice, 0) / validPrices.length;
                let winner = validPrices.reduce((prev, curr) => prev.effPrice < curr.effPrice ? prev : curr);
                if (winner.effPrice >= avgPrice) return; 
                
                let discountPct = ((avgPrice - winner.effPrice) / avgPrice) * 100;
                if (discountPct <= 0) return;
                
                leaderboard.push({
                    name: item.name || {'zh-Hant': 'Unknown'},
                    brand: item.brand || item.brandName || '',
                    categoryRaw: item.cat1Name || item.categoryRaw || '',
                    smCode: winner.smCode,
                    effectivePrice: winner.effPrice,
                    realDiscountPct: discountPct
                });
            });

            globalLeaderboardData = leaderboard; 
            
            if (typeof updateLocalLanguage === 'function') {
                updateLocalLanguage(currentLang);
            }

        } catch (e) {
            console.error("載入失敗:", e);
            document.getElementById('battleSummaryContainer').innerHTML = `<div class="col-span-full p-10 text-center text-red-500 font-bold">資料載入失敗: ${e.message}</div>`;
        }
    }

    function renderBattleSummary() {
        const container = document.getElementById('battleSummaryContainer');
        if (!container || !globalLeaderboardData || globalLeaderboardData.length === 0) return;

        const smGroups = {};
        globalLeaderboardData.forEach(item => {
            if (!smGroups[item.smCode]) smGroups[item.smCode] = [];
            smGroups[item.smCode].push(item);
        });

        container.innerHTML = '';
        
        const smOrder = ['PARKNSHOP', 'WELLCOME', 'MARKETPLACE', 'WATSONS', 'MANNINGS', 'AEON'];
        const availableSms = Object.keys(smGroups).sort((a, b) => {
            let idxA = smOrder.indexOf(a); let idxB = smOrder.indexOf(b);
            if (idxA === -1) idxA = 999; if (idxB === -1) idxB = 999;
            return idxA - idxB;
        });

        if (availableSms.length === 0) {
            const noDataMsg = currentLang === 'en' ? 'No significant price drops today.' : (currentLang === 'zh-Hans' ? '今日暂无显著差价货品。' : '今日暫無顯著差價貨品。');
            container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500">${noDataMsg}</div>`;
            return;
        }

        const totalItemsText = currentLang === 'en' ? 'Items' : (currentLang === 'zh-Hans' ? '总火力' : '總火力');
        const countText = currentLang === 'en' ? '' : (currentLang === 'zh-Hans' ? ' 件' : ' 件');

        availableSms.forEach(smCode => {
            const items = smGroups[smCode];
            items.sort((a, b) => b.realDiscountPct - a.realDiscountPct); 
            const top3 = items.slice(0, 3); 

            let style = (typeof supermarketStyleDict !== 'undefined' && supermarketStyleDict[smCode]) ? supermarketStyleDict[smCode] : (typeof supermarketStyleDict !== 'undefined' ? supermarketStyleDict['DEFAULT'] : { badgeBg: '', badgeText: '', badgeBorder: ''});
            
            let itemsHTML = top3.map((item, index) => {
                let rankMedal = index === 0 ? '🥇' : index === 1 ? '🥈' : '🥉';
                let safeName = getText(item.name, currentLang).replace(/'/g, "\\'");
                return `
                    <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm mb-2 hover:bg-blue-50 dark:hover:bg-slate-700/50 transition-colors">
                        <div class="flex items-start gap-2.5 overflow-hidden pr-2">
                            <span class="text-lg leading-none pt-0.5">${rankMedal}</span>
                            <div class="flex flex-col min-w-0">
                                <span class="text-[10px] text-slate-500 font-bold uppercase truncate">${getText(item.brand, currentLang)}</span>
                                <a href="javascript:void(0)" onclick="goToProductSearch(this.getAttribute('data-query'))" data-query="${safeName} ${item.smCode}" class="text-[14px] font-bold text-slate-800 dark:text-slate-100 truncate hover:text-[#345B8C] dark:hover:text-blue-400 transition-colors block w-full">${getText(item.name, currentLang)}</a>
                            </div>
                        </div>
                        <div class="flex flex-col items-end shrink-0">
                            <span class="text-[15px] font-black text-blue-600 dark:text-blue-400">$${item.effectivePrice.toFixed(1)}</span>
                            <span class="text-[10px] font-bold text-red-500 bg-red-50 dark:bg-red-900/30 px-1.5 py-0.5 rounded border border-red-100 dark:border-red-800">▼ ${item.realDiscountPct.toFixed(1)}%</span>
                        </div>
                    </div>
                `;
            }).join('');

            const cardHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col">
                    <div class="p-4 ${style.badgeBg} ${style.badgeText} border-b ${style.badgeBorder} flex justify-between items-center">
                        <h3 class="font-black text-[16px] tracking-wide">${getSmName(smCode, currentLang)}</h3>
                        <span class="bg-white/80 dark:bg-slate-800/80 px-2 py-0.5 rounded text-[11px] font-bold">${totalItemsText}: ${items.length}${countText}</span>
                    </div>
                    <div class="p-3 md:p-4 bg-slate-50/50 dark:bg-slate-900/50 flex-1">
                        ${itemsHTML}
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function updateLocalLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);

        const appTitle = document.getElementById('appTitle');
        if (appTitle) appTitle.innerText = lang === 'en' ? 'SmartDeal' : '慳真D';

        const statusLabel = document.getElementById('todayStatusLabel');
        if (statusLabel) {
            if (lastUpdatedTime && !isNaN(lastUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Live Data: ' : (lang === 'zh-Hans' ? '即时数据: ' : '即時數據: ');
                statusLabel.innerText = prefix + formatDateTime(lastUpdatedTime);
            } else {
                statusLabel.innerText = lang === 'en' ? 'Loading...' : (lang === 'zh-Hans' ? '载入中...' : '載入中...');
            }
        }
        
        const setTxt = (id, txt) => { const el = document.getElementById(id); if (el) el.innerText = txt; };
        const isEn = lang === 'en';
        const isSc = lang === 'zh-Hans';

        document.title = isEn ? "Battle Summary | SmartDeal" : (isSc ? "战情总结 | 悭真D" : "戰情總結 | 慳真D");
        setTxt('pageTitleText', isEn ? 'Battle Summary' : (isSc ? '战情总结' : '戰情總結'));
        setTxt('subTitleText', isEn ? 'Top 3 Price Drops by Supermarket' : (isSc ? '各大超市即时 Top 3 劈价排行榜' : '各大超市即時 Top 3 劈價排行榜'));
        setTxt('backBtn', isEn ? 'Back' : '返回');
        setTxt('listTitle', isEn ? '🏆 Supermarket Leaderboard' : (isSc ? '🏆 各大超市战况' : '🏆 各大超市戰況'));

        const uiDict = (typeof uiText !== 'undefined' && uiText[lang]) ? uiText[lang] : (typeof uiText !== 'undefined' ? uiText['zh-Hant'] : null);
        const setElTxt = (id, text) => { const el = document.getElementById(id); if (el && text) el.innerText = text; };
        const setElHtml = (id, html) => { const el = document.getElementById(id); if (el && html) el.innerHTML = html; };

        if (uiDict) {
            setElTxt('miniFooterLinks', uiDict.miniFooterLinks || '關於我們、條款及免責聲明');
            setElTxt('miniFooterCopy', uiDict.miniFooterCopy || '© 2026 慳真D');
            setElTxt('disclaimerTitle', uiDict.disclaimerTitle || '免責聲明及服務條款');
            setElHtml('disclaimerBody', uiDict.disclaimerText || '請參閱首頁免責聲明內容。');
            setElTxt('modalCloseBtn', uiDict.modalBtn || '我明白及接受');
        }

        const devTeam = document.getElementById('footerDevTeam');
        if (devTeam) devTeam.innerText = lang === 'en' ? 'Developed by: ' : (lang === 'zh-Hans' ? '开发团队: ' : '開發團隊: ');

        const devName = document.getElementById('footerDevName');
        if (devName) devName.innerText = lang === 'en' ? 'Lazy Tools Station' : (lang === 'zh-Hans' ? '懒人工具站' : '懶人工具駅');

        const mechText = {
            'zh-Hant': {
                title: '📊 戰情總結運算與聲明',
                desc: '本面板專注於 <b>「全城橫向對比」</b>，數據基於 <b>香港政府「網上價格一覽通」的即時開放數據</b>。系統即時運算各大超市的當下差價，為確保上榜貨品皆為今日真正的「全城最平」，每一件戰績均已完美通過以下 4 重嚴苛淘汰機制：',
                r1t: '1️⃣ 排除獨市生意', r1d: '系統自動剔除單一超市獨家發售之貨品（必須有競爭對手）。',
