<!DOCTYPE html>

<head>
    <script>
        (function() {
            try {
                // 🚨 純淨版：只做系統維護檢測 (防偷渡核心)
                fetch('status.txt?v=' + new Date().getTime())
                    .then(response => response.text())
                    .then(status => {
                        // 如果 status.txt 入面係 1，即刻踢去維護版面
                        if (status.trim() === '1') {
                            window.location.replace('maintenance.html');
                        }
                    })
                    .catch(error => console.error('無法讀取系統狀態:', error));
            } catch(e) {}
        })();
    </script>

                        <button onclick="openMechanismModal()" class="text-blue-500 hover:text-blue-600 dark:text-blue-400 dark:hover:text-blue-300 transition active:scale-95" title="運算與視覺化聲明">

            <div class="overflow-y-auto text-[13px] text-slate-600 dark:text-slate-300 space-y-4 pr-1 mb-2 leading-relaxed transition-colors">

                        <div id="mechR2D" class="text-slate-500 dark:text-slate-400 text-[12px]"></div>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                        <div id="mechR3T" class="font-black text-slate-800 dark:text-slate-100 mb-1"></div>
                        <div id="mechR3D" class="text-slate-500 dark:text-slate-400 text-[12px]"></div>

        </div>

<script>
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    let treemapChart = null;
    let heatmapChart = null;
    let treemapData = [];
    let totalItemsCount = 0;
    let heatmapData = []; 
    let currentHeatmapMode = 'real'; 

    window.switchHeatmapMode = function(mode) {
        currentHeatmapMode = mode;
        const btnReal = document.getElementById('btnHeatModeReal');
        const btnMarket = document.getElementById('btnHeatModeMarket');
        
        if (mode === 'real') {
            btnReal.className = "px-3 py-1 text-[11px] font-bold rounded-md bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 shadow-sm transition-all";
            btnMarket.className = "px-3 py-1 text-[11px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
        } else {
            btnMarket.className = "px-3 py-1 text-[11px] font-bold rounded-md bg-white dark:bg-slate-800 text-orange-600 dark:text-orange-400 shadow-sm transition-all";
            btnReal.className = "px-3 py-1 text-[11px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
        }
        renderHeatmap(); 
    };
    
    let mainLastUpdatedTime = null;
    let biLastUpdatedTime = null;

    function openMechanismModal() { document.getElementById('mechanismModal').classList.remove('hidden'); }
    function closeMechanismModal() { document.getElementById('mechanismModal').classList.add('hidden'); }

    const i18n = {
        'zh-Hant': { 
            title: '全局戰情室', sub: '實時監控各大超市降價分佈與火力', back: '返回', 
            treeTitle: '全城降價戰力版圖', heatTitle: '全城戰火熱力矩陣', loading: '情報匯入中...',
            ttDrop: '真實降價件數：', ttShare: '火力佔比：', itemUnit: '件', ttAvgDrop: '平均真降幅:'
        },
        'zh-Hans': { 
            title: '全局战情室', sub: '实时监控各大超市降价分布与火力', back: '返回', 
            treeTitle: '全城降价战力版图', heatTitle: '全城战火热力矩阵', loading: '情报汇入中...',
            ttDrop: '真实降价件数：', ttShare: '火力占比：', itemUnit: '件', ttAvgDrop: '平均真降幅:'
        },
        'en': { 
            title: 'Command Center', sub: 'Real-time monitoring of discount distribution', back: 'Back', 
            treeTitle: 'Discount Treemap', heatTitle: 'Warfare Heatmap', loading: 'Loading Data...',
            ttDrop: 'Real Drop Items:', ttShare: 'Market Share:', itemUnit: 'items', ttAvgDrop: 'Avg. True Drop:'
        }
    };

    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function updateLocalLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);
        const t = i18n[lang] || i18n['zh-Hant'];

        const appName = lang === 'en' ? 'SmartDeal' : (lang === 'zh-Hans' ? '悭真D' : '慳真D');
        document.title = `${t.title} | ${appName}🔎`;

        const setTxt = (id, txt) => { const el = document.getElementById(id); if (el) el.innerText = txt; };
        const setElHtml = (id, html) => { const el = document.getElementById(id); if (el && html) el.innerHTML = html; };
        
        setTxt('pageTitleText', t.title);
        setTxt('subTitleText', t.sub);
        setTxt('backBtn', t.back);
        setTxt('titleTreemap', t.treeTitle);
        setTxt('titleHeatmap', t.heatTitle);

        const appTitleEl = document.getElementById('appTitle');
        if (appTitleEl) appTitleEl.innerText = appName;

        const statusLabel = document.getElementById('todayStatusLabel');
        if (statusLabel) {
            if (mainLastUpdatedTime && !isNaN(mainLastUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Updated: ' : (lang === 'zh-Hans' ? '更新于: ' : '更新於: ');
                statusLabel.innerText = prefix + formatDateTime(mainLastUpdatedTime);
            } else {
                statusLabel.innerText = lang === 'en' ? 'Loading...' : (lang === 'zh-Hans' ? '载入中...' : '載入中...');
            }
        }

        const biBadge = document.getElementById('biUpdateBadge');
        if (biBadge) {
            if (biLastUpdatedTime && !isNaN(biLastUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Data Updated: ' : (lang === 'zh-Hans' ? '战情更新于: ' : '戰情更新於: ');
                biBadge.innerText = prefix + formatDateTime(biLastUpdatedTime);
            } else {
                biBadge.innerText = lang === 'en' ? 'Loading...' : (lang === 'zh-Hans' ? '载入中...' : '載入中...');
            }
        }

        const mechText = {
            'zh-Hant': {
                title: '📊 全局戰情室運算與視覺化聲明',
                desc: '本戰情室實時匯總全港超市的「真・劈價」數據，並轉化為高階視覺化圖表，助您一秒洞悉全城戰況：',
                r1t: '📉 甚麼是「真・降價」？', r1d: '系統每日將即時價格與 <b>2025年12月31日以來</b> 的最新歷史紀錄進行比對。只有當「今日折實價」嚴格 <b>低於</b>「上次紀錄之折實價」時，方被系統認證為真降價，剔除所有假促銷。',
                r2t: '🔲 降價戰力版圖 (Treemap)', r2d: '圖表中的方塊面積越大，代表該超市符合「真降價」標準的貨品數量越多（總火力佔比越高）。',
                r3t: '🔥 戰火熱力矩陣 (Heatmap)', r3d: '展示各超市在不同貨品分類的減價力度。顏色越深（偏紅），代表「平均真降幅」越大；顏色越淺（偏黃）代表微減。',
                r4t: '⚖️ 重要免責聲明 (Legal Compliance)', r4d: '<p><b>1. 按原樣提供 (As-Is)</b>：本面板數據基於第三方公開資料實時抓取及電腦運算，本程式不保證數據絕對無延遲或零誤差。</p><p><b>2. 第三方數據免責</b>：因零售商隨時更改定價或第三方接口延遲導致之價格落差，本平台概不負責。所有資訊僅供參考，不構成任何消費建議，請以實體店最終標價為準。</p>',
                btn: '我明白及接受'
            },
            'zh-Hans': {
                title: '📊 全局战情室运算与视觉化声明',
                desc: '本战情室实时汇总全港超市的「真・劈价」数据，并转化为高阶视觉化图表，助您一秒洞悉全城战况：',
                r1t: '📉 什么是「真・降价」？', r1d: '系统每日将即时价格与 <b>2025年12月31日以来</b> 的最新历史纪录进行比对。只有当「今日折实价」严格 <b>低于</b>「上次纪录之折实价」时，方被系统认证为真降价，剔除所有假促销。',
                r2t: '🔲 降价战力版图 (Treemap)', r2d: '图表中的方块面积越大，代表该超市符合「真降价」标准的货品数量越多（总火力占比越高）。',
                r3t: '🔥 战火热力矩阵 (Heatmap)', r3d: '展示各超市在不同货品分类的减价力度。颜色越深（偏红），代表「平均真降幅」越大；颜色越浅（偏黄）代表微减。',
                r4t: '⚖️ 重要免责声明 (Legal Compliance)', r4d: '<p><b>1. 按原样提供 (As-Is)</b>：本面板数据基于第三方公开资料实时抓取及电脑运算，本程式不保证数据绝对无延迟或零误差。</p><p><b>2. 第三方数据免责</b>：因零售商随时更改定价或第三方接口延迟导致之价格落差，本平台概不负责。所有资讯仅供参考，不构成任何消费建议，请以实体店最终标价为准。</p>',
                btn: '我明白及接受'
            },
            'en': {
                title: '📊 Dashboard Visualization & Disclaimer',
                desc: 'This dashboard aggregates live "True Discount" data from supermarkets across HK into advanced visualizations:',
                r1t: '📉 What is a "True Drop"?', r1d: 'The system compares today\'s live price with the latest historical record since <b>Dec 31, 2025</b>. A "True Drop" is strictly defined as today\'s effective price being <b>lower</b> than the previous record, filtering out all fake promotions.',
                r2t: '🔲 Discount Treemap', r2d: 'The larger the area of the block, the higher the number of products meeting our "True Discount" standard (Higher Market Share).',
                r3t: '🔥 Warfare Heatmap', r3d: 'Displays the discount intensity across categories. Darker colors (red) indicate a higher "Average True Drop"; lighter colors (yellow) indicate minor drops.',
                r4t: '⚖️ Legal Disclaimer (As-Is)', r4d: '<p><b>1. As-Is Basis</b>: Data is auto-calculated from public sources. We do not guarantee absolute real-time accuracy.</p><p><b>2. Third-Party Exemption</b>: We are not liable for discrepancies caused by retailer changes or API delays. All information is for reference only and does not constitute purchasing advice. Verify at the store.</p>',
                btn: 'I Understand & Accept'
            }
        };
        const mt = mechText[lang] || mechText['zh-Hant'];
        setTxt('mechTitle', mt.title);
        setTxt('mechDesc', mt.desc);
        setTxt('mechR1T', mt.r1t); setElHtml('mechR1D', mt.r1d);
        setTxt('mechR2T', mt.r2t); setTxt('mechR2D', mt.r2d);
        setTxt('mechR3T', mt.r3t); setTxt('mechR3D', mt.r3d);
        setTxt('mechR4T', mt.r4t); setElHtml('mechR4D', mt.r4d);
        setTxt('mechCloseBtn', mt.btn);

        if (treemapData.length > 0) renderTreemap();
        if (heatmapData.length > 0) renderHeatmap();
    }

    window.addEventListener('languageChanged', (e) => { updateLocalLanguage(e.detail.lang); });
    window.changeLanguage = function(lang) {
        if (typeof globalChangeLang === 'function') globalChangeLang(lang);
        if (typeof updateLocalLanguage === 'function') updateLocalLanguage(lang); 
    };

    function renderTreemap() {
        if (!treemapChart) return;
        const t = i18n[currentLang] || i18n['zh-Hant'];

        const twColorMap = {
            'red': '#dc2626', 'blue': '#2563eb', 'teal': '#0d9488',
            'green': '#16a34a', 'emerald': '#059669', 'orange': '#f97316',
            'fuchsia': '#c026d3', 'pink': '#db2777', 'yellow': '#facc15',
            'slate': '#475569'
        };

        const storeAgg = {};
        treemapData.forEach(cat => {
            if (cat.children && cat.label?.show !== false) {
                cat.children.forEach(child => {
                    let smCode = child.name.toUpperCase().trim();
                    if (!storeAgg[smCode]) storeAgg[smCode] = 0;
                    storeAgg[smCode] += child.value; 
                });
            }
        });

        const dynamicRich = {
            name: { fontSize: 13, fontWeight: 'bold', color: '#ffffff', align: 'center', textShadowColor: 'rgba(0,0,0,0.5)', textShadowBlur: 3, lineHeight: 16 },
            count: { fontSize: 11, fontWeight: 'bold', color: '#ffffff', align: 'center', backgroundColor: 'rgba(0,0,0,0.3)', padding: [2, 4], borderRadius: 4, marginTop: 4, lineHeight: 12 }
        };

        const logoFileMap = {
            'PARKNSHOP': 'pns',
            'JASONS': 'marketplace',
            'AEON': 'aeon',
            'WELLCOME': 'wellcome',
            'MANNINGS': 'mannings',
            'WATSONS': 'watsons'
        };

        const unifiedData = Object.keys(storeAgg).map(smCode => {
            let hexColor = '#475569'; 
            if (typeof supermarketStyleDict !== 'undefined' && supermarketStyleDict[smCode] && supermarketStyleDict[smCode].battleCountBg) {
                const bgClass = supermarketStyleDict[smCode].battleCountBg;
                for (const [twColor, hex] of Object.entries(twColorMap)) {
                    if (bgClass.includes(`bg-${twColor}`)) { hexColor = hex; break; }
                }
            }
            
            const fileName = logoFileMap[smCode] || smCode.toLowerCase();

            dynamicRich[`logo_${smCode}`] = {
                backgroundColor: {
                    image: `https://raw.githubusercontent.com/msbecky5354/JSON/main/img/${fileName}.png`
                },
                height: 40,
                width: 40, 
                align: 'center'
            };

            return {
                name: smCode,
                value: storeAgg[smCode],
                itemStyle: { color: hexColor }
            };
        });

        const option = {
            tooltip: {
                formatter: function (info) {
                    const percent = ((info.value / totalItemsCount) * 100).toFixed(1);
                    return `<div class="font-bold text-slate-800 text-lg mb-1">${info.name}</div>
                            <div class="text-sm text-slate-500">${t.ttDrop}<span class="text-blue-600 font-black ml-1">${info.value} ${t.itemUnit}</span></div>
                            <div class="text-sm text-slate-500">${t.ttShare}<span class="font-black ml-1">${percent}%</span></div>`;
                },
                backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#e2e8f0', textStyle: { color: '#1e293b' }
            },
            series: [{
                type: 'treemap', width: '100%', height: '100%', roam: false, nodeClick: false, breadcrumb: { show: false },
                squareRatio: 1, 
                itemStyle: { borderColor: '#ffffff', borderWidth: 4, gapWidth: 2, borderRadius: 8 },
                data: unifiedData, 
                label: {
                    show: true, position: 'inside', align: 'center', 
                    formatter: function(params) {
                        if (params.value < 5) return ''; 
                        let smCode = params.name;
                        let cleanName = smCode;
                        
                        if (typeof supermarketDict !== 'undefined' && supermarketDict[currentLang] && supermarketDict[currentLang][smCode]) {
                            cleanName = supermarketDict[currentLang][smCode];
                        }
                        
                        if (params.value < 30) {
                            return `{name|${cleanName}}\n{count|${params.value} ${t.itemUnit}}`; 
                        } else {
                            return `{logo_${smCode}|}\n{name|${cleanName}}\n{count|${params.value} ${t.itemUnit}}`; 
                        }
                    },
                    rich: dynamicRich 
                }
            }]
        };
        treemapChart.setOption(option);

        treemapChart.off('dblclick');
        treemapChart.on('dblclick', function(params) {
            const targetUrl = `true_discount.html?sm=${encodeURIComponent(params.name)}&cat=ALL&status=ALL&other=ALL`;
            window.open(targetUrl, 'TrueDiscountView'); 
        });
    }

    function renderHeatmap() {
        if (!heatmapChart) return;
        const t = i18n[currentLang] || i18n['zh-Hant'];
        
        const twColorMap = {
            'red': '#b91c1c', 'blue': '#1d4ed8', 'teal': '#0f766e',
            'green': '#15803d', 'emerald': '#065f46', 'orange': '#f97316',
            'fuchsia': '#a21caf', 'pink': '#be185d', 'yellow': '#eab308', 'slate': '#475569'
        };

        const xDataRaw = [...new Set(heatmapData.map(item => String(item.store).toUpperCase().trim()))];
        const xData = xDataRaw.map(code => {
            if (window.supermarketDict && window.supermarketDict[currentLang] && window.supermarketDict[currentLang][code]) {
                return window.supermarketDict[currentLang][code];
            }
            return code; 
        });

        const xAxisColors = xDataRaw.map(code => {
            let hexColor = '#475569'; 
            if (window.supermarketStyleDict && window.supermarketStyleDict[code] && window.supermarketStyleDict[code].indexText) {
                const textClass = window.supermarketStyleDict[code].indexText;
                for (const [twColor, hex] of Object.entries(twColorMap)) {
                    if (textClass.includes(`text-${twColor}`)) { hexColor = hex; break; }
                }
            }
            return hexColor;
        });

        const yData = [...new Set(heatmapData.map(item => item.category))];
        const yDataRaw = [...new Set(heatmapData.map(item => item.category))];

        const seriesData = heatmapData.map(item => {
            const cleanCode = String(item.store).toUpperCase().trim();
            const xIndex = xDataRaw.indexOf(cleanCode);
            const yIndex = yData.indexOf(item.category);
            
            const realDrop = Number((parseFloat(item.avgDiscount) || 0).toFixed(1));
            const marketDrop = Number((parseFloat(item.avgMarketDrop) || 0).toFixed(1));
            
            const displayValue = currentHeatmapMode === 'real' ? realDrop : marketDrop;
            const itemCount = parseInt(item.count) || 0;

            return [xIndex, yIndex, displayValue, itemCount, realDrop, marketDrop];
        });

        const colorRange = currentHeatmapMode === 'real' 
            ? ['#fef08a', '#f97316', '#b91c1c'] 
            : ['#fef08a', '#fb923c', '#c2410c'];

        const option = {
            tooltip: {
                position: 'top',
                confine: true, 
                formatter: function (params) {
                    const smName = xData[params.value[0]];
                    const catName = yData[params.value[1]];
                    const count = params.value[3];
                    const real = params.value[4].toFixed(1);
                    const market = params.value[5].toFixed(1);
                    
                    return `<div class="min-w-[170px] w-full">
                                <div class="font-bold text-slate-800 text-[14px] mb-2 border-b border-slate-200 pb-1.5">${smName} - ${catName}</div>
                                <div class="flex justify-between items-center mb-1.5 text-[13px] text-slate-600">
                                    <span class="shrink-0">📦 降價件數:</span> <span class="font-black text-blue-600 text-right ml-4">${count} 件</span>
                                </div>
                                <div class="flex justify-between items-center mb-1.5 text-[13px] text-slate-600">
                                    <span class="shrink-0">📉 平均真降幅:</span> <span class="font-black text-red-600 text-right ml-4">▼ ${real}%</span>
                                </div>
                                <div class="flex justify-between items-center text-[13px] text-slate-600">
                                    <span class="shrink-0">⚔️ 擊穿市價幅:</span> <span class="font-black text-orange-600 text-right ml-4">▼ ${market}%</span>
                                </div>
                                <div class="mt-2 pt-1.5 border-t border-slate-200 text-[11px] text-slate-400 text-center font-medium">💡 雙擊查看詳細清單</div>
                            </div>`;
                },
                backgroundColor: 'rgba(255, 255, 255, 0.96)', borderColor: '#cbd5e1', borderWidth: 1, padding: 12, shadowColor: 'rgba(0, 0, 0, 0.1)', shadowBlur: 10
            },
            grid: { top: '5%', right: '5%', bottom: '22%', left: '2%', containLabel: true }, 
            xAxis: { 
                type: 'category', data: xData, splitArea: { show: true }, 
                axisLabel: { fontWeight: 'bold', interval: 0, rotate: 45, fontSize: 11, margin: 12, color: function (value, index) { return xAxisColors[index]; } } 
            },
            yAxis: { type: 'category', data: yData, splitArea: { show: true }, axisLabel: { fontWeight: 'bold', interval: 0, width: 160, overflow: 'break' } },
            visualMap: {
                dimension: 2,
                min: 0, max: 40, calculable: true, orient: 'horizontal', left: 'center', bottom: '0%', 
                inRange: { color: colorRange }, 
                text: currentLang === 'en' ? ['High', 'Low'] : ['激減 (高)', '微減 (低)'],
                textStyle: { color: '#64748b', fontWeight: 'bold', fontSize: 11 }
            },
            series: [{
                name: '戰況數值', type: 'heatmap', data: seriesData,
                label: { show: true, formatter: function(params) { return params.value[2].toFixed(1) + '%'; }, color: '#ffffff', fontWeight: 'black', fontSize: 13, textShadowColor: 'rgba(0,0,0,0.4)', textShadowBlur: 3 },
                itemStyle: { borderColor: '#ffffff', borderWidth: 3, borderRadius: 6 } 
            }]
        };
        heatmapChart.setOption(option);

        heatmapChart.off('dblclick');
        heatmapChart.on('dblclick', function (params) {
            const rawSmCode = xDataRaw[params.value[0]]; 
            const rawCat = yDataRaw[params.value[1]];
            
            const targetUrl = `true_discount.html?sm=${encodeURIComponent(rawSmCode)}&cat=${encodeURIComponent(rawCat)}&status=ALL&other=ALL`;
            window.open(targetUrl, 'TrueDiscountView');
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        treemapChart = echarts.init(document.getElementById('treemapChart'));
        heatmapChart = echarts.init(document.getElementById('heatmapChart'));
        
        const t = i18n[currentLang] || i18n['zh-Hant'];
        updateLocalLanguage(currentLang);
        
        treemapChart.showLoading({ text: t.loading, color: '#3b82f6', maskColor: 'rgba(255, 255, 255, 0.8)' });
        heatmapChart.showLoading({ text: t.loading, color: '#ef4444', maskColor: 'rgba(255, 255, 255, 0.8)' });

        const nocache = new Date().getTime();

        fetch(`https://raw.githubusercontent.com/msbecky5354/JSON/main/data/update_log.txt?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.ok ? res.text() : Promise.reject('Failed to load main log'))
            .then(text => {
                let safeTimeStr = text.trim().replace(/-/g, '/').replace('T', ' '); 
                mainLastUpdatedTime = new Date(safeTimeStr);
                updateLocalLanguage(currentLang);
            })
            .catch(e => console.warn("主網站時間紀錄載入失敗", e));

        fetch(`https://raw.githubusercontent.com/msbecky5354/JSON/main/data/update_log_TrueDiscount.txt?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.ok ? res.text() : Promise.reject('Failed to load BI log'))
            .then(text => {
                let safeTimeStr = text.trim().replace(/-/g, '/').replace('T', ' '); 
                biLastUpdatedTime = new Date(safeTimeStr);
                updateLocalLanguage(currentLang);
            })
            .catch(e => console.warn("戰情室時間紀錄載入失敗", e));

        const dataUrl = 'https://raw.githubusercontent.com/msbecky5354/JSON/main/data/bi_true_discount.json';
        fetch(`${dataUrl}?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.json())
            .then(payload => {
                let data = payload;
                if (!Array.isArray(data) && (data.results || data.data)) data = data.results || data.data;
                if (!Array.isArray(data)) data = [data];
                if (data.length > 0 && data[0].json && data[0].json.true_discount_json) data = data[0].json.true_discount_json;
                else if (data.length > 0 && data[0].true_discount_json) data = data[0].true_discount_json;
                else if (data.length > 0 && data[0].json) data = data.map(i => i.json);

                if (data.length === 1 && data[0].true_discount_json) data = data[0].true_discount_json;

                let treeMapAgg = {};
                let heatMapAgg = {};
                let totalItems = 0;

                data = data.filter(item => {
     if (item.rn !== undefined) return parseInt(item.rn) === 1;
     if (item.route_flag !== undefined) return !String(item.route_flag).includes('secondary');
     return true;
});

                data.forEach(item => {
                    let smCode = (item.smCode || 'Unknown').toUpperCase().trim();
                    let catRaw = typeof item.categoryRaw === 'object' ? (item.categoryRaw['zh-Hant'] || '') : String(item.categoryRaw || '');
                    if (!catRaw) catRaw = '未分類';

                    let prevE = parseFloat(item.prevEffPrice) || 0;
                    let currE = parseFloat(item.effectivePrice) || 0;
                    let realDrop = parseFloat(item.realDiscountPct) || 0;
                    if (prevE > currE && realDrop === 0) {
                        realDrop = ((prevE - currE) / prevE) * 100;
                    }

                   

                    let marketDrop = parseFloat(item.marketDropPct) || 0;
                    let hasComp = false;
                    if (item.otherPricesRaw && item.otherPricesRaw !== '[]' && item.otherPricesRaw !== 'null') {
                        try {
                            let opRaw = typeof item.otherPricesRaw === 'string' ? JSON.parse(item.otherPricesRaw) : item.otherPricesRaw;
                            if (Array.isArray(opRaw)) {
                                opRaw = opRaw.filter(op => op.smCode !== smCode);
                                if (opRaw.length > 0) hasComp = true;
                            }
                        } catch(e) {}
                    }

                    if (!treeMapAgg[catRaw]) treeMapAgg[catRaw] = {};
                    if (!treeMapAgg[catRaw][smCode]) treeMapAgg[catRaw][smCode] = 0;
                    treeMapAgg[catRaw][smCode]++;
                    totalItems++;

                    let heatKey = `${smCode}_${catRaw}`;
                    if (!heatMapAgg[heatKey]) {
                        heatMapAgg[heatKey] = { store: smCode, category: catRaw, count: 0, sumReal: 0, sumMarket: 0, marketCount: 0 };
                    }
                    heatMapAgg[heatKey].count++;
                    heatMapAgg[heatKey].sumReal += realDrop;
                    if (hasComp) {
                        heatMapAgg[heatKey].sumMarket += marketDrop;
                        heatMapAgg[heatKey].marketCount++;
                    }
                });

                totalItemsCount = totalItems;
                
                treemapData = Object.keys(treeMapAgg).map(cat => {
                    return {
                        name: cat,
                        children: Object.keys(treeMapAgg[cat]).map(sm => ({
                            name: sm,
                            value: treeMapAgg[cat][sm]
                        }))
                    };
                });

                heatmapData = Object.values(heatMapAgg).map(agg => {
                    return {
                        store: agg.store,
                        category: agg.category,
                        count: agg.count,
                        avgDiscount: agg.count > 0 ? (agg.sumReal / agg.count) : 0,
                        avgMarketDrop: agg.marketCount > 0 ? (agg.sumMarket / agg.marketCount) : 0
                    };
                });

                treemapChart.hideLoading();
                heatmapChart.hideLoading();
                renderTreemap();
                renderHeatmap();
            })
            .catch(e => {
                console.error("Dashboard Data Fetch Error:", e);
                treemapChart.hideLoading();
                heatmapChart.hideLoading();
                document.getElementById('treemapChart').innerHTML = `<div class="text-red-500 font-bold text-center mt-20">無法載入數據。</div>`;
                document.getElementById('heatmapChart').innerHTML = `<div class="text-red-500 font-bold text-center mt-20">無法載入數據。</div>`;
            });

        window.addEventListener('resize', () => { 
            if(treemapChart) treemapChart.resize(); 
            if(heatmapChart) heatmapChart.resize(); 
        });
    });
</script>
</body>
</html>
