            if (!tbody) return;
            const tLocal = localI18n[currentLang] || localI18n['zh-Hant'];
            const tiers = [
                { id: 't1', label: tLocal.lblTier1, max: 1.0, up: 0, down: 0, flat: 0 },
                { id: 't2', label: tLocal.lblTier2, max: 5.0, up: 0, down: 0, flat: 0 },
                { id: 't3', label: tLocal.lblTier3, max: 8.0, up: 0, down: 0, flat: 0 },
                { id: 't4', label: tLocal.lblTier4, max: 10.0, up: 0, down: 0, flat: 0 },
                { id: 't5', label: tLocal.lblTier5, max: 9999, up: 0, down: 0, flat: 0 }
            ];
            let totalCount = 0; 
            filteredData.forEach(item => {
                const absDiff = Math.abs(item.diff);
                totalCount++;
                for (let t of tiers) {
                    if (absDiff <= t.max) {
                        if (item.strategy === 'flat_beaten') t.flat++;
                        else if (item.strategy === 'competitive_up') t.up++;
                        else if (item.strategy === 'true_drop') t.down++;
                        break;
                    }
                }
            });
            let sumUp = 0, sumDown = 0, sumFlat = 0;
            let html = '';
            tiers.forEach(t => {
                const totalInTier = t.up + t.down + t.flat;
                const pctOfTotalMoved = totalCount > 0 ? ((totalInTier / totalCount) * 100).toFixed(1) : 0;
                sumUp += t.up; sumDown += t.down; sumFlat += t.flat;
                const beatenStr = totalInTier > 0 ? `👑 ${totalInTier}` : '-';
                const barHtml = totalInTier > 0 ? `
                    <div class="flex items-center gap-2">
                        <div class="w-12 text-right font-bold text-slate-600 dark:text-slate-300">${pctOfTotalMoved}%</div>
                        <div class="w-48 h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                            <div class="h-full bg-blue-500 rounded-full" style="width: ${pctOfTotalMoved}%"></div>
                        </div>
                    </div>
                ` : '-';
                html += `
                    <tr class="border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                        <td class="py-4 font-bold text-blue-600 dark:text-blue-400">${t.label}</td>
                        <td class="py-4 text-center font-bold text-emerald-500">${t.down > 0 ? t.down : '-'}</td>
                        <td class="py-4 text-center font-bold text-slate-400 dark:text-slate-500">${t.flat > 0 ? t.flat : '-'}</td>
                        <td class="py-4 text-center font-bold text-amber-500">${t.up > 0 ? '+' + t.up : '-'}</td>
                        <td class="py-4 text-center font-bold text-emerald-600 leading-tight">${beatenStr}</td>
                        <td class="py-4">${barHtml}</td>
                    </tr>
                `;
            });
            if (totalCount > 0) {
                html += `
                    <tr class="border-t-2 border-slate-300 dark:border-slate-600 bg-slate-50/50 dark:bg-slate-800/50">
                        <td class="py-4 font-black text-slate-700 dark:text-slate-200">${tLocal.lblTotalRow || '總計'}</td>
                        <td class="py-4 text-center font-black text-emerald-600">${sumDown}</td>
                        <td class="py-4 text-center font-black text-slate-500">${sumFlat}</td>
                        <td class="py-4 text-center font-black text-amber-600">+${sumUp}</td>
                        <td class="py-4 text-center font-black text-blue-600">👑 ${totalCount}</td>
                        <td class="py-4 font-bold text-slate-500">100.0%</td>
                    </tr>
                `;
            } else {
                html = `<tr><td colspan="6" class="p-10 text-center text-slate-400 font-bold">${tLocal.mcNoData}</td></tr>`;
            }
            tbody.innerHTML = html;
        }

        function updateCascadingDropdowns() {
            const selCat2 = document.getElementById('selCat2');
            const selCat3 = document.getElementById('selCat3');
            const tLocal = localI18n[currentLang] || localI18n['zh-Hant'];
          const allCat2Text = currentLang === 'en' ? 'All Sub Categories' : `所有${tLocal.thCat2}`;
          const allCat3Text = currentLang === 'en' ? 'All Detail Categories' : `所有${tLocal.thCat3}`;
            
            if (state.cat === 'ALL') {
                selCat2.innerHTML = `<option value="ALL">${allCat2Text}</option>`;
                selCat2.disabled = true;
                selCat3.innerHTML = `<option value="ALL">${allCat3Text}</option>`;
                selCat3.disabled = true;
                state.cat2 = 'ALL';
                state.cat3 = 'ALL';
            } else {
                const validCat2s = [...new Set(allValidItems.filter(i => i.catRaw === state.cat && i.cat2Raw && i.cat2Raw !== '-').map(i => i.cat2Raw))].sort();
                selCat2.innerHTML = `<option value="ALL">${allCat2Text}</option>`;
                validCat2s.forEach(c2 => selCat2.add(new Option(getCatName(c2, 2), c2)));
                selCat2.disabled = validCat2s.length === 0;
                selCat2.value = validCat2s.includes(state.cat2) ? state.cat2 : 'ALL';
                state.cat2 = selCat2.value;

                if (state.cat2 === 'ALL') {
                    selCat3.innerHTML = `<option value="ALL">${allCat3Text}</option>`;
                    selCat3.disabled = true;
                    state.cat3 = 'ALL';
                } else {
                    const validCat3s = [...new Set(allValidItems.filter(i => i.catRaw === state.cat && i.cat2Raw === state.cat2 && i.cat3Raw && i.cat3Raw !== '-').map(i => i.cat3Raw))].sort();
                    selCat3.innerHTML = `<option value="ALL">${allCat3Text}</option>`;
                    validCat3s.forEach(c3 => selCat3.add(new Option(getCatName(c3, 3), c3)));
                    selCat3.disabled = validCat3s.length === 0;
                    selCat3.value = validCat3s.includes(state.cat3) ? state.cat3 : 'ALL';
                    state.cat3 = selCat3.value;
                }
            }
        }

        function applyStateFilter(type, value) {
            if (type === 'sm') { state.sm = value; }
            if (type === 'strategy') { state.strategy = value; }
            if (type === 'dev') { state.dev = value; }
            if (type === 'drop') { state.drop = value; }
            if (type === 'search') { state.search = value; }
            if (type === 'priceRange') { state.priceRange = value; }
            
            if (type === 'cat') { state.cat = value; state.cat2 = 'ALL'; state.cat3 = 'ALL'; updateCascadingDropdowns(); }
            if (type === 'cat2') { state.cat2 = value; state.cat3 = 'ALL'; updateCascadingDropdowns(); }
            if (type === 'cat3') { state.cat3 = value; }
            
            // 🌟 核心升級：每次過濾強制按「價格波幅」排序
            state.sortCol = 'diff';
            // 智能判斷：若為「收窄優勢」(加價)，由最高漲幅排起 (Desc)；否則由最大跌幅排起 (Asc)
            state.sortAsc = (state.strategy === 'competitive_up') ? false : true;

            // 🌟 更新表頭 Sort Icon 的視覺狀態
            document.querySelectorAll('.sort-icon').forEach(el => {
                el.innerHTML = '↕';
                el.classList.remove('text-slate-500', 'dark:text-slate-300', 'font-black');
                el.classList.add('text-slate-300', 'dark:text-slate-500', 'font-normal');
            });
            const activeIcon = document.getElementById('sort-diff');
            if (activeIcon) {
                activeIcon.innerHTML = state.sortAsc ? '↑' : '↓';
                activeIcon.classList.remove('text-slate-300', 'dark:text-slate-500', 'font-normal');
                activeIcon.classList.add('text-slate-500', 'dark:text-slate-300', 'font-black');
            }

            state.page = 1;
            syncUI();
            applyFiltersCore();
        }

        function applyFiltersCore() {

                const matchSm = state.sm === 'ALL' ? true : item.sm === state.sm; 
                
                const matchCat = state.cat === 'ALL' ? true : item.catRaw === state.cat; 
                const matchCat2 = state.cat2 === 'ALL' ? true : item.cat2Raw === state.cat2;
                const matchCat3 = state.cat3 === 'ALL' ? true : item.cat3Raw === state.cat3;

                let matchPrice = true;
                if (state.priceRange !== 'ALL') {
                    const p = item.curr; 
                    if (state.priceRange === '0-20') matchPrice = p <= 20;
                    else if (state.priceRange === '20-50') matchPrice = p > 20 && p <= 50;
                    else if (state.priceRange === '50-100') matchPrice = p > 50 && p <= 100;
                    else if (state.priceRange === '100-300') matchPrice = p > 100 && p <= 300;
                    else if (state.priceRange === '300+') matchPrice = p > 300;
                }

                let matchDev = true;
                if (state.dev === 'below_0') matchDev = item.dev < 0;
                else if (state.dev === 'above_0') matchDev = item.dev > 0;
                
                let matchDrop = true;
                if (state.drop === 'drop_any') matchDrop = item.realDrop > 0;
                else if (state.drop === 'drop_10') matchDrop = item.realDrop > 10;
                
                return matchKw && matchSt && matchSm && matchCat && matchCat2 && matchCat3 && matchDev && matchDrop && matchPrice;
            });
            renderChartsFromFiltered();
            renderTable();
            if(currentTab === 'tiers') renderTiersTable();

                }
                return matchKw && matchSt && matchCat && matchCat2 && matchCat3 && matchDev && matchDrop && matchPrice;
            };
            
            const chartDataSm = allValidItems.filter(item => baseFilter(item));
            const chartDataCat = allValidItems.filter(item => baseFilter(item) && (state.sm === 'ALL' ? true : item.sm === state.sm));
            const baseDataForStacked = chartDataCat;

            const trackerSmStats = {};
            chartDataSm.forEach(i => {
                if (!trackerSmStats[i.sm]) trackerSmStats[i.sm] = { true_drop: 0, competitive_up: 0, flat_beaten: 0 };
                trackerSmStats[i.sm][i.strategy]++;
            });
            chartDataCat.forEach(i => {
                if (!catStats[i.catRaw]) catStats[i.catRaw] = { true_drop: 0, competitive_up: 0, flat_beaten: 0 };
                catStats[i.catRaw][i.strategy]++;
            });
            baseDataForStacked.forEach(i => {
                if (!smBehaviors[i.sm]) smBehaviors[i.sm] = { true_drop: 0, competitive_up: 0, flat_beaten: 0, total: 0 };
                smBehaviors[i.sm][i.strategy]++;
                smBehaviors[i.sm].total++;
            });

            const legendDrop = tLocal.mcPillDrop.replace('📉 ', '');
            const legendFlat = tLocal.mcPillFlat.replace('🛡️ ', '');
            const legendUp = tLocal.mcPillUp.replace('📈 ', '');

            const logoFileMap = { 'PARKNSHOP': 'pns', 'JASONS': 'marketplace', 'AEON': 'aeon', 'WELLCOME': 'wellcome', 'MANNINGS': 'mannings', 'WATSONS': 'watsons', 'SASA': 'SaSa', 'DCHFOOD': 'DCH_Food', 'LUNGFUNG': 'lungfung' };
            const logoSizeMap = { 'SASA': { width: 55, height: 20 }, 'DCHFOOD': { width: 60, height: 24 }, 'LUNGFUNG': { width: 60, height: 20 }, 'DEFAULT': { width: 32, height: 32 } };
            const dynamicRich = {
                name: { fontSize: 13, fontWeight: 'bold', color: '#ffffff', align: 'center', textShadowColor: 'rgba(0,0,0,0.5)', textShadowBlur: 3, lineHeight: 16 },
                count: { fontSize: 11, fontWeight: 'bold', color: '#ffffff', align: 'center', backgroundColor: 'rgba(0,0,0,0.3)', padding: [2, 4], borderRadius: 4, marginTop: 4, lineHeight: 12 }
            };

            const treemapData = Object.keys(smStats).map(sm => {
                const smCode = sm.toUpperCase().trim();
                const richKey = 'logo_' + smCode.replace(/[^a-zA-Z0-9]/g, '');
                const fileName = logoFileMap[smCode] || smCode.toLowerCase();
                const size = logoSizeMap[smCode] || logoSizeMap['DEFAULT'];
                
                dynamicRich[richKey] = {
                    backgroundColor: { image: `https://msbecky5354.github.io/JSON/img/${fileName}.png` },
                    width: size.width, height: size.height, align: 'center'
                };
                return { name: getSmName(smCode), value: smStats[sm], smCode: smCode, richKey: richKey };
            });

            const treemapColorMap = { 'ALL': ['#93C5FD', '#60A5FA', '#3B82F6', '#2563EB'], 'true_drop': ['#A7F3D0', '#34D399', '#10B981', '#059669'], 'competitive_up': ['#FDE68A', '#FCD34D', '#F59E0B', '#D97706'], 'flat_beaten': ['#CBD5E1', '#94A3B8', '#64748B', '#475569'] };
            const currentTreemapColor = treemapColorMap[state.strategy] || treemapColorMap['ALL'];

            const titleEl = document.getElementById('txt-mcChartTreemap');
            if (titleEl) {
                let suffix = tLocal.mcSuffixAll;
                if (state.strategy === 'true_drop') suffix = tLocal.mcSuffixDrop;
                if (state.strategy === 'competitive_up') suffix = tLocal.mcSuffixUp;
                if (state.strategy === 'flat_beaten') suffix = tLocal.mcSuffixFlat;
                titleEl.innerHTML = `${tLocal.mcChartTreemap} <span class="text-xs font-normal text-slate-500">${suffix}</span>`;
            }

            treemapChart.setOption({
                tooltip: {
                    formatter: function (info) {
                        const smCode = info.data.smCode;
                        const fileName = logoFileMap[smCode] || smCode.toLowerCase();
                        const size = logoSizeMap[smCode] || logoSizeMap['DEFAULT'];
                        const logoHtml = `<img src="https://msbecky5354.github.io/JSON/img/${fileName}.png" onerror="this.style.display='none'" style="height:${size.height}px;width:${size.width}px;vertical-align:middle;margin-right:6px;border-radius:2px;display:inline-block;">`;
                        
                        return `<div style="font-weight:bold; margin-bottom:4px; border-bottom:1px solid #e2e8f0; padding-bottom:4px; color:#1e293b; display:flex; align-items:center;">${logoHtml}${info.name}</div>
                                <span style="color:#10b981; font-weight:900; font-size:16px;">${info.value}</span> <span style="color:#1e293b;">件</span>`;
                    },
                    backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#e2e8f0', borderWidth: 1
                },
                series: [{
                    type: 'treemap', data: treemapData, roam: false, nodeClick: false, breadcrumb: { show: false },
                    label: { 
                        show: true, position: 'inside', align: 'center',
                        formatter: function(params) {
                            if (params.value < 5) return `{name|${params.name}}\n{count|${params.value} 件}`; 
                            let rKey = params.data.richKey;
                            return `{${rKey}|}\n{name|${params.name}}\n{count|${params.value} 件}`; 
                        },
                        rich: dynamicRich
                    },
                    itemStyle: { borderColor: isDarkMode ? '#1e293b' : '#F8FAFC', borderWidth: 2 },
                    colorMappingBy: 'value', levels: [{ color: currentTreemapColor, colorAlpha: [0.8, 1] }]
                }]
            }, true);

            const sortedSms = Object.keys(smBehaviors).filter(sm => smBehaviors[sm].total >= 1).sort((a, b) => smBehaviors[b].total - smBehaviors[a].total);

            const yAxisDataObj = sortedSms.map(sm => { return { value: getSmName(sm), textStyle: { color: getBrandColor(sm, isDarkMode) } }; });
            const pctDown = sortedSms.map(sm => ({ value: ((smBehaviors[sm].true_drop / smBehaviors[sm].total) * 100).toFixed(1), smCode: sm }));
            const pctFlat = sortedSms.map(sm => ({ value: ((smBehaviors[sm].flat_beaten / smBehaviors[sm].total) * 100).toFixed(1), smCode: sm }));
            const pctUp = sortedSms.map(sm => ({ value: ((smBehaviors[sm].competitive_up / smBehaviors[sm].total) * 100).toFixed(1), smCode: sm }));

            stackedBarChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: '{b}<br/>{a0}: <b>{c0}%</b><br/>{a1}: <b>{c1}%</b><br/>{a2}: <b>{c2}%</b>' },
                legend: { data: [legendDrop, legendFlat, legendUp], bottom: 0, itemWidth: 12, itemHeight: 12, textStyle: { fontWeight: 'bold', color: isDarkMode ? '#cbd5e1' : '#475569' } },
                grid: { left: '2%', right: '4%', bottom: '12%', top: '5%', containLabel: true },
                xAxis: { type: 'value', max: 100, axisLabel: { formatter: '{value}%', color: isDarkMode ? '#94a3b8' : '#64748b' }, splitLine: { lineStyle: { type: 'dashed', color: isDarkMode ? '#334155' : '#e2e8f0' } } },
                yAxis: { type: 'category', data: yAxisDataObj, axisLabel: { fontWeight: 'bold', cursor: 'pointer' }, inverse: true },
                series: [
                    { name: legendDrop, type: 'bar', stack: 'total', data: pctDown, itemStyle: { color: chartColors.true_drop, borderRadius: [2, 0, 0, 2] }, label: { show: true, position: 'inside', formatter: p => p.value > 5 ? p.value + '%' : '', color: '#fff', fontWeight: 'bold', fontSize: 11 } },
                    { name: legendFlat, type: 'bar', stack: 'total', data: pctFlat, itemStyle: { color: chartColors.flat_beaten }, label: { show: true, position: 'inside', formatter: p => p.value > 5 ? p.value + '%' : '', color: '#fff', fontWeight: 'bold', fontSize: 11 } },
                    { name: legendUp, type: 'bar', stack: 'total', data: pctUp, itemStyle: { color: chartColors.competitive_up, borderRadius: [0, 2, 2, 0] }, label: { show: true, position: 'inside', formatter: p => p.value > 5 ? p.value + '%' : '', color: '#fff', fontWeight: 'bold', fontSize: 11 } }
                ]
            });

            const finalSmCodes = Object.keys(trackerSmStats).sort((a, b) => (trackerSmStats[a]?.true_drop || 0) - (trackerSmStats[b]?.true_drop || 0)); 
            const divSmSeries = { true_drop: [], competitive_up: [] };
            finalSmCodes.forEach(sm => {
                divSmSeries.true_drop.push(-(trackerSmStats[sm]?.true_drop || 0));
                divSmSeries.competitive_up.push(trackerSmStats[sm]?.competitive_up || 0);
            });

            smDivergingChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: buildDivergingTooltip(trackerSmStats) },
                legend: { data: [legendDrop, legendUp], bottom: 0, textStyle: { color: isDarkMode ? '#cbd5e1' : '#475569' } },
                grid: { left: '2%', right: '4%', bottom: '10%', top: '5%', containLabel: true },
                xAxis: getXAxisConfig(), 
                yAxis: { type: 'category', data: finalSmCodes, axisLabel: { fontWeight: 'bold', formatter: function(value) { return getSmName(value); }, color: function(value) { return getBrandColor(value, isDarkMode); }, cursor: 'pointer' } },
                color: divergingColors,
                series: [ { name: legendDrop, type: 'bar', stack: 'total', data: divSmSeries.true_drop }, { name: legendUp, type: 'bar', stack: 'total', data: divSmSeries.competitive_up } ]
            });

            const catArray = Object.keys(catStats).map(cat => ({ name: cat, total: catStats[cat].true_drop + catStats[cat].competitive_up + catStats[cat].flat_beaten, stats: catStats[cat] }));
            catArray.sort((a, b) => b.total - a.total);
            const topCats = catArray.slice(0, 10).reverse(); 
            const catNames = topCats.map(c => ({ value: getCatName(c.name), name: c.name })); 
            const divCatSeries = { true_drop: [], competitive_up: [] };
            topCats.forEach(c => { divCatSeries.true_drop.push(-c.stats.true_drop); divCatSeries.competitive_up.push(c.stats.competitive_up); });

            catDivergingChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: buildDivergingTooltip(catStats) },
                legend: { data: [legendDrop, legendUp], bottom: 0, textStyle: { color: isDarkMode ? '#cbd5e1' : '#475569' } },
                grid: { left: '2%', right: '4%', bottom: '10%', top: '5%', containLabel: true },
                xAxis: getXAxisConfig(), 
                yAxis: { type: 'category', data: catNames, axisLabel: { fontWeight: 'bold', color: isDarkMode ? '#cbd5e1' : '#475569', cursor: 'pointer' } },
                color: divergingColors,
                series: [ { name: legendDrop, type: 'bar', stack: 'total', data: divCatSeries.true_drop }, { name: legendUp, type: 'bar', stack: 'total', data: divCatSeries.competitive_up } ]
            });
            
            document.getElementById('catDrillTitle').innerText = state.cat !== 'ALL' ? `(${tLocal.mcFilteredCat}${getCatName(state.cat)})` : "";
            document.getElementById('smDrillTitle').innerText = state.sm !== 'ALL' ? `(${tLocal.mcFilteredSm}${getSmName(state.sm)})` : "";
        }

        function handleSort(col) {
            if (state.sortCol === col) { state.sortAsc = !state.sortAsc; } 
            else { state.sortCol = col; state.sortAsc = true; }
            
            document.querySelectorAll('.sort-icon').forEach(el => {
                el.innerHTML = '↕';
                el.classList.remove('text-slate-500', 'dark:text-slate-300', 'font-black');
                el.classList.add('text-slate-300', 'dark:text-slate-500', 'font-normal');
            });
            const activeIcon = document.getElementById(`sort-${col}`);
            if (activeIcon) {
                activeIcon.innerHTML = state.sortAsc ? '↑' : '↓';
                activeIcon.classList.remove('text-slate-300', 'dark:text-slate-500', 'font-normal');
                activeIcon.classList.add('text-slate-500', 'dark:text-slate-300', 'font-black');
            }
            state.page = 1;
            renderTable();
        }

        function renderTable() {
            if (state.sortCol) {
                filteredData.sort((a, b) => {
                    let res = 0;
                    if(state.sortCol === 'cat') { 
                        res = a.catRaw.localeCompare(b.catRaw);
                        if (res === 0) res = a.cat2Raw.localeCompare(b.cat2Raw);
                        if (res === 0) res = a.cat3Raw.localeCompare(b.cat3Raw);
                    }
                    else if(state.sortCol === 'cat2') { 
                        res = a.cat2Raw.localeCompare(b.cat2Raw);
                        if (res === 0) res = a.cat3Raw.localeCompare(b.cat3Raw);
                    }
                    else if(state.sortCol === 'cat3') { res = a.cat3Raw.localeCompare(b.cat3Raw); }
                    else if(state.sortCol === 'name') { 
                        let valA = currentLang === 'en' ? a.nameEn : (currentLang === 'zh-Hans' ? a.nameSc : a.nameTc);
                        let valB = currentLang === 'en' ? b.nameEn : (currentLang === 'zh-Hans' ? b.nameSc : b.nameTc);
                        res = valA.localeCompare(valB); 
                    }
                    else if(state.sortCol === 'brand') { 
                        let valA = currentLang === 'en' ? a.brandEn : (currentLang === 'zh-Hans' ? a.brandSc : a.brandTc);
                        let valB = currentLang === 'en' ? b.brandEn : (currentLang === 'zh-Hans' ? b.brandSc : b.brandTc);
                        res = valA.localeCompare(valB); 
                    }
                    else if(state.sortCol === 'sm') { res = getSmName(a.sm).localeCompare(getSmName(b.sm)); }
                    else { res = a[state.sortCol] - b[state.sortCol]; }
                    return state.sortAsc ? res : -res;
                });
            }

            const total = filteredData.length;
            const totalPages = Math.ceil(total / rowsPerPage) || 1;
            if (state.page > totalPages) state.page = totalPages;
            
            const startIdx = (state.page - 1) * rowsPerPage;
            const endIdx = Math.min(startIdx + rowsPerPage, total);
            const currentChunk = filteredData.slice(startIdx, endIdx);

            const thDiffCol = document.getElementById('th-diff-col');
            if (thDiffCol) {
                if (state.strategy === 'flat_beaten') thDiffCol.classList.add('hidden');
                else thDiffCol.classList.remove('hidden');
            }
            const hideDiffClass = state.strategy === 'flat_beaten' ? 'hidden' : '';

            const tLocal = localI18n[currentLang] || localI18n['zh-Hant'];

            let html = '';
            currentChunk.forEach((item, index) => {
                const conf = colorConfig[item.strategy] || colorConfig['flat_beaten'];
                let lblConf = '未知';
                if(item.strategy === 'true_drop') lblConf = tLocal.mcPillDrop;
                if(item.strategy === 'competitive_up') lblConf = tLocal.mcPillUp;
                if(item.strategy === 'flat_beaten') lblConf = tLocal.mcPillFlat;
                
                const diffNum = item.diff;
                let diffTextColor = 'text-slate-400 dark:text-slate-500';
                let diffSign = '';
                
                if (diffNum <= -1.0) { diffTextColor = 'text-emerald-600 dark:text-emerald-400'; diffSign = ''; }
                else if (diffNum >= 1.0) { diffTextColor = 'text-amber-500 dark:text-amber-400'; diffSign = '+'; }

                const microBarHtml = `
                    <div class="flex items-center justify-center w-full ${hideDiffClass}">
                        <div class="w-1/2 flex justify-end pr-2">
                            <div class="h-1.5 bg-emerald-500 dark:bg-emerald-400 rounded-sm micro-bar" style="width: ${diffNum < 0 ? Math.min(Math.abs(diffNum)*1.5, 100) : 0}%;"></div>
                        </div>
                        <div class="w-16 text-center text-[11px] font-black ${diffTextColor}">${diffNum !== 0 ? diffSign + diffNum.toFixed(1) + '%' : '-'}</div>
                        <div class="w-1/2 flex justify-start pl-2">
                            <div class="h-1.5 bg-amber-500 dark:bg-amber-400 rounded-sm micro-bar" style="width: ${diffNum > 0 ? Math.min(diffNum*1.5, 100) : 0}%;"></div>
                        </div>
                    </div>
                `;

                const devColor = item.dev > 0 ? 'text-amber-600 dark:text-amber-400' : (item.dev < 0 ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-500 dark:text-slate-400');
                const devSign = item.dev > 0 ? '+' : '';
                const dropColor = item.realDrop > 0 ? 'text-emerald-700 dark:text-emerald-400' : (item.realDrop < 0 ? 'text-amber-600 dark:text-amber-400' : 'text-slate-500 dark:text-slate-400');
                const dropSign = item.realDrop > 0 ? '↓ ' : (item.realDrop < 0 ? '↑ ' : '');

                const dName = currentLang === 'en' ? item.nameEn : (currentLang === 'zh-Hans' ? item.nameSc : item.nameTc);
                const dBrand = currentLang === 'en' ? item.brandEn : (currentLang === 'zh-Hans' ? item.brandSc : item.brandTc);
                const dOffer = currentLang === 'en' ? item.offerEn : (currentLang === 'zh-Hans' ? item.offerSc : item.offerTc);
                const pOffer = currentLang === 'en' ? item.pOfferEn : (currentLang === 'zh-Hans' ? item.pOfferSc : item.pOfferTc);
                const tC1 = getCatName(item.catRaw, 1);
const tC2 = getCatName(item.cat2Raw, 2);
const tC3 = getCatName(item.cat3Raw, 3);

                html += `
                <tr class="border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                    <td class="p-3 font-bold text-center text-slate-400 dark:text-slate-500 text-[11px] align-top pt-5">${startIdx + index + 1}</td>
                    <td class="p-3 align-top pt-5 whitespace-nowrap overflow-hidden">${getSmBadge(item.sm)}</td>

                    <th class="hidden">${item.cat2Raw}</th>
                    <th class="hidden">${item.cat3Raw}</th>

                    <td class="p-3 text-[11px] text-slate-600 dark:text-slate-300 font-bold uppercase tracking-wider align-top">
                        <div class="flex items-start justify-between gap-2 mt-1">
                            <span class="truncate max-w-[130px] cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 hover:underline transition-colors" title="點擊過濾此主分類" onclick="quickFilterCat('${item.catRaw}', 'ALL', 'ALL')">${tC1}</span>
                            
                            ${(item.cat2Raw !== '-' && item.cat2Raw !== '') ? `
                            <button onclick="event.stopPropagation(); toggleSubCat('subcat-${index}', this)" class="shrink-0 text-[10px] bg-white hover:bg-slate-100 text-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-300 px-1.5 py-0.5 rounded shadow-sm border border-slate-300 dark:border-slate-600 transition-all font-bold flex items-center gap-1 -mt-0.5">
                                <span class="icon font-black">▾</span> ${currentLang === 'en' ? 'Expand' : '展開'}
                            </button>
                            ` : ''}
                        </div>
                        
                        ${(item.cat2Raw !== '-' && item.cat2Raw !== '') ? `
                        <div id="subcat-${index}" class="hidden mt-2 pt-2 border-t border-slate-200 dark:border-slate-700 border-dashed text-[10px] bg-slate-50 dark:bg-slate-900/50 p-2 rounded space-y-1 normal-case tracking-normal">
                            <div class="flex items-start gap-1 text-slate-600 dark:text-slate-300">
                                <span class="text-slate-300 dark:text-slate-600 font-black">└</span> 
                                <span class="font-black shrink-0">${tLocal.thCat2}：</span>
                                <span class="break-words flex-1 text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 cursor-pointer hover:underline transition-colors" title="點擊過濾此次分類" onclick="quickFilterCat('${item.catRaw}', '${item.cat2Raw}', 'ALL')">${tC2}</span>
                            </div>
                            ${(item.cat3Raw !== '-' && item.cat3Raw !== '') ? `
                            <div class="flex items-start gap-1 text-slate-600 dark:text-slate-300 ml-3">
                                <span class="text-slate-300 dark:text-slate-600 font-black">└</span> 
                                <span class="font-black shrink-0">${tLocal.thCat3}：</span>
                                <span class="break-words flex-1 text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 cursor-pointer hover:underline transition-colors" title="點擊過濾此細分類" onclick="quickFilterCat('${item.catRaw}', '${item.cat2Raw}', '${item.cat3Raw}')">${tC3}</span>
                            </div>
                            ` : ''}
                        </div>
                        ` : ''}
                    </td>

                    <td class="p-3 align-top pt-5 overflow-hidden">
                        <div class="font-bold text-slate-700 dark:text-slate-200 text-xs truncate w-full">${dBrand}</div>
                        ${dOffer !== '-' ? `<div class="text-[10px] text-red-600 dark:text-red-400 font-bold mt-0.5 truncate w-full" title="${dOffer}">🏷️ ${dOffer}</div>` : ''}
                    </td>
                    
                    <td class="p-3 font-bold text-slate-800 dark:text-slate-100 align-top pt-5 w-full">
                        <div class="truncate lg:whitespace-normal break-words w-full" title="${dName}">${dName}</div>
                    </td>
                    
                    <td class="p-3 text-center border-x border-slate-100 dark:border-slate-700 align-top pt-5 dblclick-cell" title="Double-click to filter" ondblclick="applyStateFilter('strategy', '${item.strategy}')">
                        <div class="flex justify-center">
                            <span class="px-2.5 py-1 border rounded font-black text-[11px] ${conf.style} pointer-events-none shadow-sm min-w-[80px]">${lblConf}</span>
                        </div>
                    </td>
                    
                    <td class="p-3 text-right align-top pt-4 overflow-hidden border-l border-slate-100 dark:border-slate-700">
                        <div class="font-black text-emerald-600 dark:text-emerald-400 text-[15px] whitespace-nowrap">${item.curr > 0 ? '$' + Number(item.curr.toFixed(2)) : '-'}</div>
                        <div class="text-[10px] text-slate-500 dark:text-slate-400 mt-1 whitespace-nowrap leading-tight flex flex-col items-end">
                            <span>${tLocal.lblPrevEff} ${item.prev > 0 ? '$' + Number(item.prev.toFixed(2)) : '-'}</span>
                            <span>${tLocal.lblPrevBase} ${item.prevBase > 0 ? '$' + Number(item.prevBase.toFixed(2)) : '-'}</span>
                        </div>
                        <div class="text-[9px] text-slate-400 mt-1 truncate w-full ml-auto text-right" title="${pOffer}">${tLocal.lblPrevOffer} ${pOffer !== '-' ? pOffer : '-'}</div>
                        
                        <div class="text-[9px] text-slate-400 mt-0.5 truncate w-full ml-auto text-right font-medium bg-slate-100 dark:bg-slate-800 inline-block px-1 rounded" title="Last Record">${tLocal.lblLastChanged} ${item.lcd !== '-' ? item.lcd : '-'}</div>
                    </td>
                    
                    <td class="p-3 align-top pt-5 overflow-hidden border-l border-slate-100 dark:border-slate-700 ${hideDiffClass}">${microBarHtml}</td>
                    
                    <td class="p-2 border-l border-slate-100 dark:border-slate-700 align-top pt-4 w-48">
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded p-1.5 shadow-sm min-w-[150px]">
                            <div class="flex justify-between items-center mb-1 text-[10px]">
                                <span class="text-slate-500 dark:text-slate-400">📊 ${tLocal.lblAvgBase}</span>
                                <span class="font-bold text-slate-700 dark:text-slate-200">${item.avgBase > 0 ? '$' + item.avgBase.toFixed(1) : '-'}</span>
                            </div>
                            <div class="flex justify-between items-center mb-1 text-[10px] border-t border-slate-100 dark:border-slate-700 border-dashed pt-1">
                                <span class="text-slate-500 dark:text-slate-400">⚖️ ${tLocal.lblDev}</span>
                                <span class="font-bold ${devColor}">${item.avgBase > 0 ? devSign + item.dev.toFixed(1) + '%' : '-'}</span>
                            </div>
                            <div class="flex justify-between items-center text-[10px]">
                                <span class="text-slate-500 dark:text-slate-400">🎯 ${tLocal.lblDrop}</span>
                                <span class="font-bold ${dropColor}">${item.avgBase > 0 ? dropSign + Math.abs(item.realDrop).toFixed(1) + '%' : '-'}</span>
                            </div>
                        </div>
                    </td>
                </tr>`;
            });

            if (total === 0) html = `<tr><td colspan="9" class="p-10 text-center text-slate-400 font-bold">${tLocal.mcNoData}</td></tr>`;

            document.getElementById('tableBody').innerHTML = html;
            document.getElementById('pageStart').innerText = total === 0 ? 0 : startIdx + 1;
            document.getElementById('pageEnd').innerText = endIdx;
            document.getElementById('totalItems').innerText = total;
            document.getElementById('pageNumbers').innerText = `${state.page} / ${totalPages}`;

            document.getElementById('prevBtn').disabled = state.page === 1 || totalPages === 0;
            document.getElementById('nextBtn').disabled = state.page === totalPages || totalPages === 0;
        }

        function openCalcInfoModal() {
            const modal = document.getElementById('calcInfoModal');
            const box = document.getElementById('calcInfoBox');
            if (modal && box) {
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
            }
        }

        function updateLangUI(activeId) {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.className = "px-3 py-1.5 text-xs font-bold rounded-md text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 lang-btn";
            });
            const activeBtn = document.getElementById(activeId);
            if (activeBtn) activeBtn.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm lang-btn";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (currentLang === 'zh-Hans') updateLangUI('btn-hans');
            else if (currentLang === 'en') updateLangUI('btn-en');
            else updateLangUI('btn-hant');
        });

        function closeCalcInfoModal() {
            const modal = document.getElementById('calcInfoModal');
            const box = document.getElementById('calcInfoBox');
            if (modal && box) {
                modal.classList.add('opacity-0');
                box.classList.remove('scale-100'); box.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => applyStateFilter('search', e.target.value));
        document.getElementById('prevBtn').addEventListener('click', () => { if(state.page > 1) { state.page--; renderTable(); } });
        document.getElementById('nextBtn').addEventListener('click', () => { if(state.page < Math.ceil(filteredData.length / rowsPerPage)) { state.page++; renderTable(); } });

        const observer = new MutationObserver(() => {
            let newDark = document.documentElement.classList.contains('dark');
            if (newDark !== isDarkMode) {
                isDarkMode = newDark;
                initCharts();
                renderChartsFromFiltered();
            }
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

        fetchAndProcessData();
    </script>
</body>
</html>
