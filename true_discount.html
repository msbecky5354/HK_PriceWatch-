   <script>
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    let fullDataList = [];
    let lastUpdatedTime = null;         
    let tdLastUpdatedTime = null;       
    let currentSort = { column: 'realDiscountPct', dir: 'desc' }; // 嚴格還原預設排序控制權
    let currentMinPct = 20;
    let fState = { cat: 'ALL', sm: 'ALL', status: 'ALL', other: 'ALL' };

    const urlParams = new URLSearchParams(window.location.search);
    const targetSm = urlParams.get('sm');
    const targetCat = urlParams.get('cat');
    const targetStatus = urlParams.get('status'); 
    const targetOther = urlParams.get('other'); // 🟢 新增：精準擷取 other 參數

    // 完美繼承 Dashboard 傳遞過來的所有戰略視角
    if (targetSm || targetCat || targetStatus || targetOther) {
        if (targetSm) fState.sm = targetSm;
        if (targetCat) fState.cat = targetCat;
        if (targetStatus) fState.status = targetStatus; 
        // 🟢 解除強制歸零！如果有傳入 other，就跟隨 other；無先至預設 ALL
        if (targetOther) fState.other = targetOther; else fState.other = 'ALL';
        currentMinPct = 0; 
    }


    
    const DB_NAME = 'PriceWatchDB';
    const STORE_TRUE_DISCOUNT = 'true_discount_store';

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 3);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_TRUE_DISCOUNT)) db.createObjectStore(STORE_TRUE_DISCOUNT);
                if (db.objectStoreNames.contains('snapshot_store')) db.deleteObjectStore('snapshot_store');
                if (db.objectStoreNames.contains('pricewatch_store')) db.deleteObjectStore('pricewatch_store');
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function getCachedData(storeName, timeKey) {
        try {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const req = tx.objectStore(storeName).get(timeKey);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        } catch (e) { return null; }
    }

    async function setCachedData(storeName, timeKey, data) {
        try {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                store.clear();
                const req = store.put(data, timeKey);
                req.onsuccess = () => resolve(true);
                req.onerror = () => reject(req.error);
            });
        } catch (e) { return false; }
    }

    function getCatName(rawCat, lang) {
        let c = (rawCat || '').toString().trim();
        if (window.categoryDict && window.categoryDict[lang] && window.categoryDict[lang][c]) {
            return window.categoryDict[lang][c];
        }
        return c; 
    }

    function getText(content, lang) {
        if (!content) return '-';
        let text = '';
        if (typeof content === 'string') text = content;
        else if (typeof content === 'object') {
            text = content[lang] || content['zh-Hant'] || Object.values(content)[0] || '-';
        } else {
            text = String(content);
        }
        return text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    const statusI18n = {
        'drop': { 'en': '📉 Real Price Drop', 'zh-Hant': '📉 真降價', 'zh-Hans': '📉 真降价', 'color': 'text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30 border-green-200 dark:border-green-800' },
        'fake': { 'en': '🟠 Invalid Promo', 'zh-Hant': '🟠 無實質降幅', 'zh-Hans': '🟠 无实质降幅', 'color': 'text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/30 border-orange-200 dark:border-orange-800' },

        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    async function loadTrueDiscountData() {
        try {
            const tbody = document.getElementById('leaderboardTableBody');
            let loadingStr = currentLang === 'en' ? '⏳ Verifying Local Cache...' : (currentLang === 'zh-Hans' ? '⏳ 正在验证本地缓存...' : '⏳ 正在驗證本地快取...');
            const loadingHTML = `<div id="loadingMessage" class="p-10 text-center font-bold text-slate-500 dark:text-slate-400 animate-pulse text-[15px] flex flex-col items-center justify-center gap-3"><div class="w-8 h-8 border-4 border-slate-200 border-t-[#345B8C] rounded-full animate-spin"></div><span>${loadingStr}</span></div>`;
            if (tbody) tbody.innerHTML = `<tr><td colspan="10">${loadingHTML}</td></tr>`;

            const updateMsg = (msg) => { const el = document.querySelector('#loadingMessage span'); if(el) el.innerText = msg; };
            const nocache = new Date().getTime();
            
            let mainLogUrl = `https://raw.githubusercontent.com/msbecky5354/JSON/main/data/update_log.txt?v=${nocache}`;
            try {
                const mainLogRes = await fetch(mainLogUrl);
                if (mainLogRes.ok) {
                    let mainTimeStr = (await mainLogRes.text()).trim();
                    let safeMainTimeStr = mainTimeStr.replace(/-/g, '/').replace('T', ' '); 
                    lastUpdatedTime = new Date(safeMainTimeStr);
                }
            } catch(e) { console.warn("Main log fetch failed", e); }

            let tdLogUrl = `https://raw.githubusercontent.com/msbecky5354/JSON/main/data/update_log_TrueDiscount.txt?v=${nocache}`;
            let serverTimeStr = '';
            try {
                const logRes = await fetch(tdLogUrl);
                if (logRes.ok) {
                    serverTimeStr = (await logRes.text()).trim();
                    let safeTimeStr = serverTimeStr.replace(/-/g, '/').replace('T', ' '); 
                    tdLastUpdatedTime = new Date(safeTimeStr);
                }
            } catch(e) { console.warn("TD Log fetch failed", e); }

            let commitSha = '';
            try {
                const apiRes = await fetch('https://api.github.com/repos/msbecky5354/JSON/commits/main', { cache: 'no-store' });
                if (apiRes.ok) {
                    const commitData = await apiRes.json();
                    commitSha = commitData.sha; 
                }
            } catch (e) { console.warn("GitHub API limit"); }

            let finalData = [];

            if (serverTimeStr) {
                const cachedData = await getCachedData(STORE_TRUE_DISCOUNT, serverTimeStr);
                
                if (cachedData && cachedData.length > 0) {
                    updateMsg(currentLang === 'en' ? '⚡ Loading from Cache...' : (currentLang === 'zh-Hans' ? '⚡ 秒速载入本地缓存中...' : '⚡ 秒速載入本地快取中...'));
                    finalData = cachedData;
                    await new Promise(r => setTimeout(r, 50)); 
                } else {
                    updateMsg(currentLang === 'en' ? '📥 Downloading Live Data...' : (currentLang === 'zh-Hans' ? '📥 获取最新榜单中...' : '📥 獲取最新榜單中...'));
                    let dataUrl = `https://raw.githubusercontent.com/msbecky5354/JSON/main/data/bi_true_discount.json?v=${nocache}`;
                    if (commitSha) {
                        dataUrl = `https://cdn.jsdelivr.net/gh/msbecky5354/JSON@${commitSha}/data/bi_true_discount.json`;
                    }

                    const res = await fetch(dataUrl);
                    let rawData = await res.json();
                    
                    if (!Array.isArray(rawData) && (rawData.results || rawData.data)) rawData = rawData.results || rawData.data;
                    if (!Array.isArray(rawData)) rawData = [rawData];
                    
                    if (rawData.length > 0) {
                        if (rawData[0].json && rawData[0].json.true_discount_json) {
                            rawData = rawData[0].json.true_discount_json;
                        } else if (rawData[0].true_discount_json) {
                            rawData = rawData[0].true_discount_json;
                        } else if (rawData[0].json) {
                            rawData = rawData.map(i => i.json);
                        }
                    }
                    
                    if (rawData.length === 1 && rawData[0].true_discount_json) {
                        rawData = rawData[0].true_discount_json;
                    }

                    finalData = rawData;
                    await setCachedData(STORE_TRUE_DISCOUNT, serverTimeStr, finalData);
                }
            } else {
                 const res = await fetch(`https://raw.githubusercontent.com/msbecky5354/JSON/main/data/bi_true_discount.json?v=${nocache}`);
                 let rawData = await res.json();
                 if (!Array.isArray(rawData) && (rawData.results || rawData.data)) rawData = rawData.results || rawData.data;
                 if (!Array.isArray(rawData)) rawData = [rawData];
                 if (rawData.length > 0) {
                     if (rawData[0].json && rawData[0].json.true_discount_json) rawData = rawData[0].json.true_discount_json;
                     else if (rawData[0].true_discount_json) rawData = rawData[0].true_discount_json;
                     else if (rawData[0].json) rawData = rawData.map(i => i.json);
                 }
                 if (rawData.length === 1 && rawData[0].true_discount_json) rawData = rawData[0].true_discount_json;
                 finalData = rawData;
            }

            if (!finalData || finalData.length === 0) throw new Error("JSON 解析為空，請檢查後端導出格式。");

            // 🟢 核心修改：剔除「次平真降價」及「次平新上架」，強制過濾保留 rn = 1
            finalData = finalData.filter(item => {
                if (item.rn !== undefined) return parseInt(item.rn) === 1;
                if (item.route_flag !== undefined) return !String(item.route_flag).includes('secondary');
                return true;
            });

           finalData = finalData.map(item => {
                let avgPrice = parseFloat(item.marketAvgPrice) || 0;
                let dropPct = parseFloat(item.marketDropPct) || 0;
                let devPct = parseFloat(item.priceDeviationPct) || 0;
                let hasMarket = false;
                let isBattleWinner = false;
                
                // ---------------------------------------------------
                // 🛠️ [新增] 修復「永久調低底價」導致的 0% 盲點
                // ---------------------------------------------------
                let prevE = parseFloat(item.prevEffPrice) || 0;
                let currE = parseFloat(item.effectivePrice) || 0;
                if (prevE > currE) {
                    let hPct = ((prevE - currE) / prevE) * 100;
                    // 如果原生促銷減幅為 0，則用歷史實質波幅覆寫，以確保排序及平均值統計正確
                    if ((parseFloat(item.realDiscountPct) || 0) === 0) {
                        item.realDiscountPct = hPct; 
                    }
                }
                // ---------------------------------------------------

                if (item.otherPricesRaw && item.otherPricesRaw !== '[]' && item.otherPricesRaw !== 'null') {

                    try {
                        let opRaw = typeof item.otherPricesRaw === 'string' ? JSON.parse(item.otherPricesRaw) : item.otherPricesRaw;
                        if (Array.isArray(opRaw)) {
                            opRaw = opRaw.filter(op => op.smCode !== item.smCode);
                            if (opRaw.length > 0) {
                                hasMarket = true;
                                let effPrice = parseFloat(item.effectivePrice) || 0;
                                let isLowestPrice = true;

                                opRaw.forEach(op => {
                                    let opPrice = parseFloat(op.price) || 0;
                                    if (opPrice > 0 && effPrice > opPrice) {
                                        isLowestPrice = false;
                                    }
                                });

                                if (isLowestPrice && dropPct > 0 && item.statusKey === 'drop') {
                                    isBattleWinner = true;
                                }
                            }
                        }
                    } catch(e) {}
                }
                item.marketAvgPrice = avgPrice;
                item.marketDropPct = dropPct;
                item.priceDeviationPct = devPct;
                item.hasCompetitors = hasMarket;
                item.isBattleWinner = isBattleWinner;
                return item;
            });

            fullDataList = finalData;
            if (typeof updateLocalLanguage === 'function') updateLocalLanguage(currentLang);
            
        } catch (e) { 
            console.error("數據載入崩潰:", e); 
            const errorStr = currentLang === 'en' ? 'Failed to load live data' : '無法取得最新即時數據';
            const errorHTML = `
                <div class="p-10 text-center flex flex-col items-center justify-center gap-3">
                    <span class="text-red-500 dark:text-red-400 font-black text-[16px]">${errorStr}</span>
                    <span class="text-[12px] font-mono text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 max-w-md break-words">${e.message}</span>
                </div>`;
            const tbody = document.getElementById('leaderboardTableBody');
            const mbody = document.getElementById('leaderboardMobile');
            if(tbody) tbody.innerHTML = `<tr><td colspan="10">${errorHTML}</td></tr>`;
            if(mbody) mbody.innerHTML = errorHTML;
        }
    }

    function handleDropdownSort() {
        const val = document.getElementById('sortFilter').value;
        if (val === 'custom') return;
        const [col, dir] = val.split('_');
        currentSort = { column: col, dir: dir };
        applyFilters();
    }

    function handleSort(col) {
        if (col === 'displayRank') { currentSort = { column: 'realDiscountPct', dir: 'desc' }; } 
        else if (currentSort.column === col) { currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc'; } 
        else { currentSort.column = col; currentSort.dir = (col === 'effectivePrice' || col === 'originalPrice' || col === 'priceDeviationPct') ? 'asc' : 'desc'; }
        const sortFilter = document.getElementById('sortFilter');
        if (sortFilter) sortFilter.value = 'custom';
        applyFilters();
    }

    function updateSortUI() {
        document.querySelectorAll('.sort-icon').forEach(el => el.innerText = '');
        const thMapping = { 'displayRank': 'thRank', 'categoryRaw': 'thCat', 'smCode': 'thSm', 'name': 'thName', 'statusKey': 'thStatus', 'originalPrice': 'thOrig', 'effectivePrice': 'thEff', 'realDiscountPct': 'thDiff', 'marketDropPct': 'thOther' };
        const thId = thMapping[currentSort.column];
        if (thId) {
            const th = document.getElementById(thId);
            if (th) { const icon = th.querySelector('.sort-icon'); if (icon) icon.innerText = currentSort.dir === 'asc' ? '▲' : '▼'; }
        }
        
        const sortFilter = document.getElementById('sortFilter');
        if (sortFilter) {
            const optVal = currentSort.column + '_' + currentSort.dir;
            const optionExists = Array.from(sortFilter.options).some(opt => opt.value === optVal);
            sortFilter.value = optionExists ? optVal : 'custom';
        }
    }

    function applyFilters() {
        const kwInput = document.getElementById('filterInput');
        const kw = kwInput ? kwInput.value.toLowerCase().trim() : '';
        const clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) clearBtn.classList.toggle('hidden', kw.length === 0);

        let filtered = fullDataList.filter(i => {
            const name = getText(i.name, currentLang).toLowerCase();
            const smNameText = getSmName(i.smCode, currentLang).toLowerCase(); 
            const rawCatValue = typeof i.categoryRaw === 'object' ? (i.categoryRaw['zh-Hant'] || '') : String(i.categoryRaw || '');
            const translatedCatText = getCatName(rawCatValue, currentLang).toLowerCase(); 
            
            const matchesKw = name.includes(kw) || smNameText.includes(kw) || translatedCatText.includes(kw);
            const matchesSm = (fState.sm === 'ALL' || i.smCode === fState.sm);
            const matchesCat = (fState.cat === 'ALL' || rawCatValue === fState.cat);
            const matchesStatus = (fState.status === 'ALL' || i.statusKey === fState.status);
            
            const matchesOther = (fState.other === 'ALL' || 
                                 (fState.other === 'HAS_OTHER' && i.hasCompetitors) ||
                                 (fState.other === 'BATTLE_WINNER' && i.isBattleWinner));
                                 
            const matchesPct = currentMinPct > 0 ? (parseFloat(i.realDiscountPct) >= currentMinPct) : true;
            
            return matchesKw && matchesSm && matchesCat && matchesStatus && matchesOther && matchesPct;
        });

        filtered.sort((a, b) => {
            let valA = a[currentSort.column], valB = b[currentSort.column];
            
            if (currentSort.column === 'realDiscountPct' || currentSort.column === 'marketDropPct') {
                valA = parseFloat(valA) || 0;
                valB = parseFloat(valB) || 0;
                if (valA === valB) {
                    let tieA = currentSort.column === 'realDiscountPct' ? parseFloat(a.marketDropPct) || 0 : parseFloat(a.realDiscountPct) || 0;
                    let tieB = currentSort.column === 'realDiscountPct' ? parseFloat(b.marketDropPct) || 0 : parseFloat(b.realDiscountPct) || 0;
                    if (tieA === tieB) {
                        let smA = String(a.smCode || '').toUpperCase();
                        let smB = String(b.smCode || '').toUpperCase();
                        return smA.localeCompare(smB); 
                    }
                    return currentSort.dir === 'asc' ? tieA - tieB : tieB - tieA;
                }
                return currentSort.dir === 'asc' ? valA - valB : valB - valA;
            }

            if (currentSort.column === 'effectivePrice' || currentSort.column === 'originalPrice' || currentSort.column === 'priceDeviationPct') {
                 valA = parseFloat(valA) || 0;
                 valB = parseFloat(valB) || 0;
            } else if (currentSort.column === 'categoryRaw' || currentSort.column === 'name') {
                 valA = getText(a[currentSort.column], currentLang); valB = getText(b[currentSort.column], currentLang);
                 return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            } else {
                valA = String(valA || ''); valB = String(valB || '');
                return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            return currentSort.dir === 'asc' ? valA - valB : valB - valA;
        });

        let totalItems = filtered.length;
        let sumDiff = 0;
        let marketDropItems = 0;
        let sumMarketDrop = 0;

        filtered.forEach(item => {
            sumDiff += (parseFloat(item.realDiscountPct) || 0);
            if (item.hasCompetitors) {
                marketDropItems++;
                sumMarketDrop += (parseFloat(item.marketDropPct) || 0);
            }
        });

        const avgDiff = totalItems > 0 ? (sumDiff / totalItems).toFixed(1) : '0.0';
        const avgMarket = marketDropItems > 0 ? (sumMarketDrop / marketDropItems).toFixed(1) : '0.0';

        document.getElementById('sumCountVal').innerText = totalItems;
        document.getElementById('sumDiffVal').innerText = `▼ ${avgDiff}%`;
        document.getElementById('sumMarketVal').innerText = `▼ ${avgMarket}%`;
        
        const summaryBar = document.getElementById('dynamicSummaryBar');
        if (summaryBar) {
            if (totalItems === 0) {
                summaryBar.classList.add('hidden');
            } else {
                summaryBar.classList.remove('hidden');
            }
        }

        updateSortUI();
        renderLeaderboard(filtered);
    }

        const safeCat = (fullDataList.length === 0) ? fState.cat : (rawCategories.includes(fState.cat) ? fState.cat : 'ALL');
        const safeStatus = (fullDataList.length === 0) ? fState.status : (statuses.includes(fState.status) ? fState.status : 'ALL');
        const safeOther = (fullDataList.length === 0) ? fState.other : fState.other; 

        syncFilters('sm', safeSm);

    function updateLocalLanguage(lang) {

        const appTitle = document.getElementById('appTitle');
        if (appTitle) appTitle.innerText = lang === 'en' ? 'SmartDeal' : '慳真D';

            } else {

   const calcInfoTexts = {
