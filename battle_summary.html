    // 🟢 核心對接功能：精準提取 flat_raw_data 產生的多語系欄位
    function getLocalizedText(item, baseKey, lang) {
        if (!item) return '-';
        
        let objVal = item[baseKey];
        if (objVal && typeof objVal === 'object') {
            if (lang === 'en' && objVal['en']) return objVal['en'];
            if (lang === 'zh-Hans' && objVal['zh-Hans']) return objVal['zh-Hans'];
            return objVal['zh-Hant'] || Object.values(objVal)[0] || '-';
        }
        
        if (lang === 'en') {
            return item[baseKey + 'En'] || item[baseKey + '_en'] || item[baseKey] || '-';
        } else if (lang === 'zh-Hans') {
            return item[baseKey + 'Hans'] || item[baseKey + '_zh_hans'] || item[baseKey] || '-';
        } else {
            return item[baseKey + 'Hant'] || item[baseKey + '_zh_hant'] || item[baseKey] || '-';
        }
    }

    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function getSmName(code, lang) {
        let c = (code || '').toUpperCase();
        if (typeof window.supermarketDict !== 'undefined' && window.supermarketDict[lang] && window.supermarketDict[lang][c]) return window.supermarketDict[lang][c];
        if (typeof window.supermarketDict !== 'undefined' && window.supermarketDict['zh-Hant'] && window.supermarketDict['zh-Hant'][c]) return window.supermarketDict['zh-Hant'][c];
        return c;
    }

    function getCatName(rawCat, lang) {
        let c = (rawCat || '').toString().trim();
        if (typeof rawCat === 'object') {
            if (lang === 'en' && rawCat['en']) return rawCat['en'];
            if (lang === 'zh-Hans' && rawCat['zh-Hans']) return rawCat['zh-Hans'];
            return rawCat['zh-Hant'] || Object.values(rawCat)[0] || '未分類';
        }
        if (window.categoryDict && window.categoryDict[lang] && window.categoryDict[lang][c]) {
            return window.categoryDict[lang][c];
        }
        return c; 
    }

    function goToProductSearch(productName) {
        window.location.href = 'index.html?lang=' + currentLang + '&q=' + encodeURIComponent(productName);
    }

    function openMechanismModal() { document.getElementById('mechanismModal').classList.remove('hidden'); }
    function closeMechanismModal() { document.getElementById('mechanismModal').classList.add('hidden'); }

    function unwrapData(d) {
        if (!d) return [];
        let rawData = d;
        if (!Array.isArray(rawData) && (rawData.results || rawData.data)) rawData = rawData.results || rawData.data;
        if (!Array.isArray(rawData)) rawData = [rawData];
        if (rawData.length > 0) {
            if (rawData[0] && rawData[0].json && rawData[0].json.snapshot_data) return rawData[0].json.snapshot_data;
            if (rawData[0] && rawData[0].snapshot_data) return rawData[0].snapshot_data;
            if (rawData[0] && rawData[0].json) return rawData.map(i => i.json);
        }
        if (rawData.length === 1 && rawData[0] && rawData[0].snapshot_data) return rawData[0].snapshot_data;
        return rawData;
    }

    async function loadBattleSummaryData() {
        if (isFetchingData) return;
        isFetchingData = true;

        try {
            const container = document.getElementById('battleSummaryContainer');
            let loadingStr = pageI18n[currentLang].loadingBi;
            if (container) container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500 dark:text-slate-400 animate-pulse text-[15px]">${loadingStr}</div>`;

            const nocache = new Date().getTime();
            const dataUrl = `https://msbecky5354.github.io/JSON/data/bi_true_discount.json?v=${nocache}`;

            const dataRes = await fetch(dataUrl, { cache: 'no-store' });
            if (!dataRes.ok) throw new Error("無法取得最新戰情數據");
            
            let rawData = await dataRes.json();
            const trueDiscountData = unwrapData(rawData);

            let leaderboard = [];

            trueDiscountData.forEach(item => {
                if (item.statusKey !== 'drop') return;

                let effPrice = parseFloat(item.effectivePrice);
                if (isNaN(effPrice) || effPrice <= 0) return;

                let prevEffPrice = parseFloat(item.prevEffPrice);
                if (isNaN(prevEffPrice)) return;

               let otherPrices = [];
                try {
                    if (typeof item.otherPricesRaw === 'string') {
                        otherPrices = JSON.parse(item.otherPricesRaw);
                    } else if (Array.isArray(item.otherPricesRaw)) {
                        otherPrices = item.otherPricesRaw;
                    }
                } catch(e) {}

               // 1️⃣ 排除獨市生意 
                otherPrices = otherPrices.filter(op => op.smCode !== item.smCode);
                if (!otherPrices || otherPrices.length === 0) return;
                
                // 2️⃣ 嚴格遵從 SQL 底層的「全城唯一最低價」排名
                if (parseInt(item.rn) !== 1) return;
                
                let marketDropPct = parseFloat(item.marketDropPct) || 0;
                let realDiscountPct = parseFloat(item.realDiscountPct) || 0;

                // 🟢 將完整物件存入 leaderboard，不破壞多語系屬性
                leaderboard.push({
                    rawItem: item,
                    smCode: (item.smCode || '').toUpperCase(),
                    effectivePrice: effPrice,
                    marketDropPct: marketDropPct,
                    realDiscountPct: realDiscountPct
                });
            });

            globalLeaderboardData = leaderboard; 
            renderBattleSummary();

        } catch (e) {
            console.error("載入失敗:", e);
            const container = document.getElementById('battleSummaryContainer');
            if (container) container.innerHTML = `<div class="col-span-full p-10 text-center text-red-500 font-bold">資料載入失敗: ${e.message}</div>`;
        } finally {
            isFetchingData = false;
        }
    }

    function renderBattleSummary() {
        const container = document.getElementById('battleSummaryContainer');
        const t = pageI18n[currentLang];
        
        if (!container || !globalLeaderboardData || globalLeaderboardData.length === 0) {
            if (container) container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500">${t.noData}</div>`;
            return;
        }

        const smGroups = {};
        globalLeaderboardData.forEach(item => {
            if (!smGroups[item.smCode]) smGroups[item.smCode] = [];
            smGroups[item.smCode].push(item);
        });

        container.innerHTML = '';
        
        const smOrder = ['PARKNSHOP', 'WELLCOME', 'MARKETPLACE', 'WATSONS', 'MANNINGS', 'AEON'];
        const availableSms = Object.keys(smGroups).sort((a, b) => {
            let idxA = smOrder.indexOf(a); let idxB = smOrder.indexOf(b);
            if (idxA === -1) idxA = 999; if (idxB === -1) idxB = 999;
            return idxA - idxB;
        });

        if (availableSms.length === 0) {
            container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500">${t.noData}</div>`;
            return;
        }

        availableSms.forEach(smCode => {
            const items = smGroups[smCode];
            
            items.sort((a, b) => 
                b.realDiscountPct - a.realDiscountPct || 
                b.marketDropPct - a.marketDropPct || 
                String(a.rawItem.name || '').localeCompare(String(b.rawItem.name || ''))
            ); 
            
            const top3 = items.slice(0, 3); 

            let style = (typeof window.supermarketStyleDict !== 'undefined' && window.supermarketStyleDict[smCode]) ? window.supermarketStyleDict[smCode] : (typeof window.supermarketStyleDict !== 'undefined' ? window.supermarketStyleDict['DEFAULT'] : { badgeBg: '', badgeText: '', badgeBorder: ''});
            
            let itemsHTML = top3.map((item, index) => {
                let rankMedal = index === 0 ? '🥇' : index === 1 ? '🥈' : '🥉';
                let rawItem = item.rawItem;
                
                // 🟢 動態渲染中英文字眼
                let displayName = getLocalizedText(rawItem, 'name', currentLang);
                let safeName = String(displayName).replace(/'/g, "\\'");
                let displayBrand = getLocalizedText(rawItem, 'brand', currentLang);
                let catObj = rawItem.categoryRaw || rawItem.cat1_zh_hant || '未分類';
                let displayCat = getCatName(catObj, currentLang);

                return `
                    <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm mb-2 hover:bg-blue-50 dark:hover:bg-slate-700/50 transition-colors">
                        <div class="flex items-start gap-2.5 overflow-hidden pr-2 w-full">
                            <span class="text-lg leading-none pt-0.5">${rankMedal}</span>
                            <div class="flex flex-col min-w-0 w-full">
                                <span class="text-[10px] text-slate-500 font-bold uppercase truncate">${displayBrand} | ${displayCat}</span>
                                <a href="javascript:void(0)" onclick="goToProductSearch(this.getAttribute('data-query'))" data-query="${safeName} ${item.smCode}" class="text-[14px] font-bold text-slate-800 dark:text-slate-100 truncate hover:text-[#345B8C] dark:hover:text-blue-400 transition-colors block w-full mb-1.5">${displayName}</a>
                                
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-[10px] font-bold text-red-600 bg-red-50 dark:bg-red-900/30 px-1.5 py-0.5 rounded border border-red-100 dark:border-red-800">📉 ${t.lblTrueDrop}: ▼ ${item.realDiscountPct.toFixed(1)}%</span>
                                    <span class="text-[10px] font-bold text-orange-600 bg-orange-50 dark:bg-orange-900/30 px-1.5 py-0.5 rounded border border-orange-100 dark:border-orange-800">⚔️ ${t.lblBeatMarket}: ▼ ${item.marketDropPct.toFixed(1)}%</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end shrink-0 pl-2">
                            <span class="text-[17px] font-black text-blue-600 dark:text-blue-400">$${item.effectivePrice.toFixed(1)}</span>
                        </div>
                    </div>
                `;
            }).join('');

            const cardHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col">
                    <div class="p-4 ${style.badgeBg} ${style.badgeText} border-b ${style.badgeBorder} flex justify-between items-center">
                        <h3 class="font-black text-[16px] tracking-wide">${getSmName(smCode, currentLang)}</h3>
                        <span class="bg-white/80 dark:bg-slate-800/80 px-2 py-0.5 rounded text-[11px] font-bold">${t.totalItems}: ${items.length}${t.countUnit}</span>
                    </div>
                    <div class="p-3 md:p-4 bg-slate-50/50 dark:bg-slate-900/50 flex-1">
                        ${itemsHTML}
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function updateLocalLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);
        
        const t = pageI18n[lang] || pageI18n['zh-Hant'];

        const appTitle = document.getElementById('appTitle');
        if (appTitle) appTitle.innerText = t.appTitle;

        document.title = t.pageTitle;
        
        const setTxt = (id, txt) => { const el = document.getElementById(id); if (el) el.innerText = txt; };
        const setElHtml = (id, html) => { const el = document.getElementById(id); if (el && html) el.innerHTML = html; };
        
        setTxt('pageTitleText', t.title);
        setTxt('subTitleText', t.sub);
        setTxt('backBtn', t.back);
        setTxt('listTitle', t.listTitle);

        const statusLabel = document.getElementById('todayStatusLabel');
        if (statusLabel) {
            if (mainUpdatedTime && !isNaN(mainUpdatedTime.getTime())) {
                statusLabel.innerText = t.datePrefixM + formatDateTime(mainUpdatedTime);
            } else {
                statusLabel.innerText = t.loadingDate;
            }
        }

        const battleLabel = document.getElementById('battleStatusLabel');
        if (battleLabel) {
            if (battleUpdatedTime && !isNaN(battleUpdatedTime.getTime())) {
                battleLabel.innerText = t.datePrefixB + formatDateTime(battleUpdatedTime);
            } else {
                battleLabel.innerText = t.loadingDate;
            }
        }

        // 🟢 對接 window.uiText 字典以供 footer.js 使用
        const uiDict = (typeof window.uiText !== 'undefined' && window.uiText[lang]) ? window.uiText[lang] : (typeof window.uiText !== 'undefined' ? window.uiText['zh-Hant'] : null);

        if (uiDict) {
            setTxt('miniFooterLinks', uiDict.miniFooterLinks || '關於我們、條款及免責聲明');
            setTxt('miniFooterCopy', uiDict.miniFooterCopy || '© 2026 慳真D');
            setTxt('disclaimerTitle', uiDict.disclaimerTitle || '免責聲明及服務條款');
            setElHtml('disclaimerBody', uiDict.disclaimerText || '請參閱首頁免責聲明內容。');
            setTxt('modalCloseBtn', uiDict.modalBtn || '我明白及接受');
        }

        const devTeam = document.getElementById('footerDevTeam');
        if (devTeam) devTeam.innerText = t.devTeam;

        const devName = document.getElementById('footerDevName');
        if (devName) devName.innerText = t.devName;

        // 🟢 動態渲染 Modal 聲明並隱藏多餘區塊
        setTxt('mechTitle', t.mechTitle);
        setElHtml('mechDesc', t.mechDesc);
        setTxt('mechR1T', t.r1t); setElHtml('mechR1D', t.r1d);
        setTxt('mechR2T', t.r2t); setElHtml('mechR2D', t.r2d);
        setTxt('mechR3T', t.r3t); setElHtml('mechR3D', t.r3d);
        setTxt('mechR4T', t.r4t); setElHtml('mechR4D', t.r4d);
        
        const r5tEl = document.getElementById('mechR5T');
        if (r5tEl && t.r5t) {
            document.getElementById('mechR5Block').style.display = 'block';
            setTxt('mechR5T', t.r5t); 
            setElHtml('mechR5D', t.r5d);
        } else if (r5tEl) {
            document.getElementById('mechR5Block').style.display = 'none';
        }

        setTxt('mechR6T', t.r6t); setElHtml('mechR6D', t.r6d);
        setTxt('mechCloseBtn', t.btn);
    }

    // 🟢 徹底改善渲染流程：語言切換時「直接重繪」，無需嘥 Token 重新抓 Data
    window.addEventListener('languageChanged', (e) => {
        updateLocalLanguage(e.detail.lang);
        if (globalLeaderboardData && globalLeaderboardData.length > 0) {
            renderBattleSummary(); 
        } else {
            const t = pageI18n[e.detail.lang] || pageI18n['zh-Hant'];
            const container = document.getElementById('battleSummaryContainer');
            if (container) {
                container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500 animate-pulse">${t.langChanging}</div>`;
                setTimeout(() => { loadBattleSummaryData(); }, 300);
            }
        }
    });

    window.changeLanguage = function(lang) {
        if (typeof globalChangeLang === 'function') globalChangeLang(lang);
        updateLocalLanguage(lang); 
        
        if (globalLeaderboardData && globalLeaderboardData.length > 0) {
            renderBattleSummary(); 
        } else {
            const t = pageI18n[lang] || pageI18n['zh-Hant'];
            const container = document.getElementById('battleSummaryContainer');
            if (container) {
                container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500 animate-pulse">${t.langChanging}</div>`;
                setTimeout(() => { loadBattleSummaryData(); }, 300);
            }
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof window.currentLang !== 'undefined') {
            updateLocalLanguage(window.currentLang);
        } else {
            updateLocalLanguage(currentLang);
        }
        
        const nocache = new Date().getTime();

        fetch(`https://msbecky5354.github.io/JSON/data/update_log.txt?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.ok ? res.text() : Promise.reject('Failed to load main date'))
            .then(text => {
                let safeTimeStr = text.trim();
                mainUpdatedTime = new Date(safeTimeStr);
                if (isNaN(mainUpdatedTime.getTime())) {
                    safeTimeStr = safeTimeStr.replace(/-/g, '/').replace('T', ' '); 
                    mainUpdatedTime = new Date(safeTimeStr);
                }
                updateLocalLanguage(currentLang); 
            })
            .catch(e => console.warn("主時間紀錄載入失敗", e));

        fetch(`https://msbecky5354.github.io/JSON/data/update_log_TrueDiscount.txt?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.ok ? res.text() : Promise.reject('Failed to load battle date'))
            .then(text => {
                let safeTimeStr = text.trim();
                battleUpdatedTime = new Date(safeTimeStr);
                if (isNaN(battleUpdatedTime.getTime())) {
                    safeTimeStr = safeTimeStr.replace(/-/g, '/').replace('T', ' '); 
                    battleUpdatedTime = new Date(safeTimeStr);
                }
                const badge = document.getElementById('battleStatusLabel');
                if(badge) badge.classList.remove('hidden');
                updateLocalLanguage(currentLang); 
            })
            .catch(e => console.warn("戰情時間紀錄載入失敗", e));

        loadBattleSummaryData();
    });
</script>
</body>
</html>
