   <script>
    // --- 1. 全域變數 ---
    let currentLang = localStorage.getItem('appLang') || 'zh-Hant';
    let fullDataList = [];
    let lastUpdatedTime = null;
    let currentSort = { column: 'realDiscountPct', dir: 'desc' };
    let isOnly50Pct = false;

    // --- 2. 核心工具函數 ---
    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function getText(content, lang) {
        if (!content) return '-';
        if (typeof content === 'string') return content;
        if (typeof content === 'object') {
            return content[lang] || content['zh-Hant'] || Object.values(content)[0] || '-';
        }
        return String(content);
    }

    function getSmName(code, lang) {
        let c = (code || '').toUpperCase();
        if (typeof supermarketDict !== 'undefined' && supermarketDict[lang] && supermarketDict[lang][c]) {
            return supermarketDict[lang][c];
        }
        return c;
    }

    // --- 3. UI 輔助與互動功能 ---
    function getSmBadge(smCode, lang) {
        let code = (smCode || '').toUpperCase();
        let name = getSmName(code, lang);
        
        let bgCls = 'bg-slate-100 dark:bg-slate-700'; 
        let textCls = 'text-slate-600 dark:text-slate-300';
        let borderCls = 'border-slate-200 dark:border-slate-600';

        if (code === 'WELLCOME' || code === 'LUNGFUNG') { bgCls = 'bg-red-50 dark:bg-red-900/20'; textCls = 'text-red-600 dark:text-red-400'; borderCls = 'border-red-200 dark:border-red-800'; }
        else if (code === 'PARKNSHOP') { bgCls = 'bg-blue-50 dark:bg-blue-900/20'; textCls = 'text-blue-600 dark:text-blue-400'; borderCls = 'border-blue-200 dark:border-blue-800'; }
        else if (code === 'WATSONS') { bgCls = 'bg-teal-50 dark:bg-teal-900/20'; textCls = 'text-teal-600 dark:text-teal-400'; borderCls = 'border-teal-200 dark:border-teal-800'; }
        else if (code === 'HKTVMALL') { bgCls = 'bg-green-50 dark:bg-green-900/20'; textCls = 'text-green-600 dark:text-green-400'; borderCls = 'border-green-200 dark:border-green-800'; }
        else if (code === 'JASONS' || code === 'MARKETPLACE') { bgCls = 'bg-emerald-50 dark:bg-emerald-900/20'; textCls = 'text-emerald-700 dark:text-emerald-400'; borderCls = 'border-emerald-200 dark:border-emerald-800'; }
        else if (code === 'MANNINGS') { bgCls = 'bg-orange-50 dark:bg-orange-900/20'; textCls = 'text-orange-600 dark:text-orange-400'; borderCls = 'border-orange-200 dark:border-orange-800'; }
        else if (code === 'AEON') { bgCls = 'bg-fuchsia-50 dark:bg-fuchsia-900/20'; textCls = 'text-fuchsia-600 dark:text-fuchsia-400'; borderCls = 'border-fuchsia-200 dark:border-fuchsia-800'; }

        return `<span onclick="setQuickSearch('${name}'); window.scrollTo({ top: 0, behavior: 'smooth' });" title="加入搜尋框" class="px-2.5 py-1 text-[11px] font-black rounded-md border ${bgCls} ${textCls} ${borderCls} whitespace-nowrap shadow-sm cursor-pointer hover:opacity-75 hover:scale-105 active:scale-95 transition-all inline-block">${name}</span>`;
    }

    function goToProductSearch(productName) {
        window.location.href = 'index.html?lang=' + currentLang + '&q=' + encodeURIComponent(productName);
    }

   // --- 4. 數據讀取與處理引擎 (極速階層運算版，防崩潰、防假死) ---
    async function loadTrueDiscountData() {
        try {
            const [timeRes, dataRes] = await Promise.all([
                fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/update_log.txt"),
                fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/pricewatch.json")
            ]);
            
            if (timeRes.ok) lastUpdatedTime = new Date(await timeRes.text());
            const items = await dataRes.json();
            
            let processedData = [];
            
            // 💡 改良版高效能運算：直接利用 JSON 既有的貨品階層結構，取代 O(N²) 的全域搜尋，秒速載入！
            items.forEach((item) => {
                if (!item.prices || item.prices.length === 0) return;
                
                let validPricesForThisItem = [];
                
                // 步驟 1: 收集「這個貨品」在各超市的今日有效價格 (包含 promoEngine 計算)
                item.prices.forEach(p => {
                    const smCode = (p.supermarketCode || p.supermarket || '').toUpperCase();
                    if (smCode === 'ZTORE' || !smCode) return; // WHERE f.supermarket_code != 'ZTORE'
                    
                    const basePrice = parseFloat(p.price);
                    if (isNaN(basePrice)) return;
                    
                    let effectivePrice = basePrice;
                    let promoCalcText = "";
                    
                    // 提取促銷公式
                    const promoKeys = ['offers', 'promotions', 'promotion', 'offer', 'promotionDesc'];
                    for (let key of promoKeys) {
                        if (p[key]) {
                            promoCalcText = (typeof p[key] === 'object') ? (p[key]['en'] || p[key]['zh-Hant'] || '') : p[key];
                            break;
                        } else if (Array.isArray(item[key])) {
                            let matchOffer = item[key].find(o => (o.supermarketCode || o.supermarket || '').toUpperCase() === smCode);
                            if (matchOffer) {
                                promoCalcText = matchOffer.en || matchOffer['zh-Hant'] || '';
                                break;
                            }
                        }
                    }

                    // 呼叫 promoEngine 計算折實價 (COALESCE 包底)
                    if (typeof calculateAvgPrice === 'function' && promoCalcText) {
                        let avgPrice = calculateAvgPrice(promoCalcText, basePrice);
                        if (avgPrice && avgPrice > 0 && avgPrice < basePrice) {
                            effectivePrice = avgPrice;
                        }
                    }
                    
                    const offerStr = getText(p.offer || p.promotion || item.offer || '-', 'zh-Hant');
                    
                    validPricesForThisItem.push({
                        smCode: smCode,
                        basePrice: basePrice,
                        effectivePrice: effectivePrice,
                        offerStr: offerStr
                    });
                });
                
                if (validPricesForThisItem.length === 0) return;
                
                // 步驟 2: 計算「這個貨品」的市場平均基準價 (完美模擬 SQL 的 GROUP BY AVG)
                let sum = 0;
                validPricesForThisItem.forEach(vp => sum += vp.effectivePrice);
                let marketAvgPrice = sum / validPricesForThisItem.length;
                
                if (marketAvgPrice <= 0) return;
                
                // 步驟 3: 計算該貨品在每一間超市的「真實減幅」，並過濾出真正的平貨
                validPricesForThisItem.forEach(vp => {
                    // 公式：(市場平均價 - 折實價) / 市場平均價
                    const realDiscountPct = ((marketAvgPrice - vp.effectivePrice) / marketAvgPrice) * 100;
                    
                    // WHERE real_discount_pct > 0 (踢走假劈價或貴過市場平均的超市)
                    if (realDiscountPct <= 0) return; 
                    
                    // 正則表達式分類優惠類型
                    const isPromo = /(買|送|件|第二件|半價|優惠)/.test(vp.offerStr); 
                    const offerTypeRaw = isPromo ? 'promo' : 'discount';
                    
                    // 💡 修正：儲存原始陣列，讓渲染表格時可以根據當前語言動態翻譯超市名稱
                    const otherPricesArr = validPricesForThisItem
                        .filter(other => other.smCode !== vp.smCode)
                        .map(other => ({ smCode: other.smCode, price: other.effectivePrice }));
                        
                    processedData.push({
                        smCode: vp.smCode,
                        name: item.name,
                        categoryRaw: item.cat1Name || {'zh-Hant': '其他'},
                        offerTypeRaw: offerTypeRaw,
                        originalPrice: vp.basePrice,
                        effectivePrice: vp.effectivePrice,
                        realDiscountPct: realDiscountPct,
                        otherPricesRaw: otherPricesArr, // 傳遞原始數據
                        offerStr: vp.offerStr
                    });
                });
            });
            
            // ORDER BY t.real_discount_pct DESC
            fullDataList = processedData.sort((a, b) => b.realDiscountPct - a.realDiscountPct);
            
            // 通知 UI 刷新
            changeLanguage(currentLang);
            
        } catch (e) { 
            console.error("數據載入或運算錯誤:", e); 
            const tbody = document.getElementById('leaderboardTableBody');
            if (tbody) tbody.innerHTML = `<tr><td colspan="9" class="p-5 text-center text-red-500 font-bold">載入錯誤: ${e.message}</td></tr>`;
        }
    }

    // --- 5. 過濾與搜尋功能 ---
    function setQuickSearch(kw) {
        const input = document.getElementById('filterInput');
        if (input) input.value = kw;
        applyFilters();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const filterInput = document.getElementById('filterInput');
        if (filterInput) filterInput.addEventListener('input', applyFilters);
    });

    function toggle50PctFilter() {
        isOnly50Pct = !isOnly50Pct;
        const btn = document.getElementById('btn50Pct');
        if (btn) {
            if (isOnly50Pct) {
                btn.className = "px-2.5 py-1 bg-red-600 dark:bg-red-500 border border-red-700 dark:border-red-600 rounded-lg text-white font-bold flex items-center gap-1 shadow-md scale-105 transition-all";
            } else {
                btn.className = "px-2.5 py-1 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg text-red-600 dark:text-red-400 hover:bg-red-100 transition-all shadow-sm font-bold flex items-center gap-1";
            }
        }
        applyFilters();
    }

    function handleDropdownSort() {
        const val = document.getElementById('sortFilter').value;
        if (val === 'custom') return;
        const [col, dir] = val.split('_');
        currentSort = { column: col, dir: dir };
        applyFilters();
    }

    function handleSort(col) {
        if (col === 'displayRank') {
            currentSort = { column: 'realDiscountPct', dir: 'desc' };
        } else if (currentSort.column === col) {
            currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc';
        } else {
            currentSort.column = col;
            currentSort.dir = (col === 'effectivePrice' || col === 'originalPrice') ? 'asc' : 'desc'; 
        }
        const sortFilter = document.getElementById('sortFilter');
        if (sortFilter) sortFilter.value = 'custom';
        applyFilters();
    }

    function updateSortUI() {
        document.querySelectorAll('.sort-icon').forEach(el => el.innerText = '');
        const thMapping = {
            'displayRank': 'thRank', 'categoryRaw': 'thCat', 'smCode': 'thSm',
            'name': 'thName', 'offerTypeRaw': 'thType', 'originalPrice': 'thOrig',
            'effectivePrice': 'thEff', 'realDiscountPct': 'thDiff'
        };
        const thId = thMapping[currentSort.column];
        if (thId) {
            const th = document.getElementById(thId);
            if (th) {
                const icon = th.querySelector('.sort-icon');
                if (icon) icon.innerText = currentSort.dir === 'asc' ? '▲' : '▼';
            }
        }
    }

    function applyFilters() {
        const kwInput = document.getElementById('filterInput');
        const kw = kwInput ? kwInput.value.toLowerCase().trim() : '';
        const sm = document.getElementById('smFilter').value;
        const cat = document.getElementById('catFilter').value;

        const clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) clearBtn.classList.toggle('hidden', kw.length === 0);

        let filtered = fullDataList.filter(i => {
            const name = getText(i.name, currentLang).toLowerCase();
            const smNameText = getSmName(i.smCode, currentLang).toLowerCase(); 
            const categoryText = getText(i.categoryRaw, currentLang); 
            
            const matchesKw = name.includes(kw) || smNameText.includes(kw);
            const matchesSm = (sm === 'ALL' || i.smCode === sm);
            const matchesCat = (cat === 'ALL' || categoryText === cat);
            const matchesPct = isOnly50Pct ? (i.realDiscountPct >= 50) : true; 
            
            return matchesKw && matchesSm && matchesCat && matchesPct;
        });

        filtered.sort((a, b) => {
            let valA = a[currentSort.column];
            let valB = b[currentSort.column];
            
            if (currentSort.column === 'categoryRaw' || currentSort.column === 'name') {
                 valA = getText(a[currentSort.column], currentLang);
                 valB = getText(b[currentSort.column], currentLang);
                 return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            if (currentSort.column === 'smCode' || currentSort.column === 'offerTypeRaw') {
                valA = String(valA || '');
                valB = String(valB || '');
                return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            return currentSort.dir === 'asc' ? valA - valB : valB - valA;
        });

        updateSortUI();
        renderLeaderboard(filtered);
    }

    // --- 6. 多語言與選單初始化 (完美融合 Header 版) ---
    function populateDropdowns() {
        const sm = document.getElementById('smFilter');
        const cat = document.getElementById('catFilter');
        if (!sm || !cat) return;

        const d = (typeof uiText !== 'undefined' && uiText[currentLang]) ? uiText[currentLang] : uiText['zh-Hant'];

        const smCodes = [...new Set(fullDataList.map(i => i.smCode))];
        sm.innerHTML = `<option value="ALL">${d.optSmAll || '推薦超市 (全部)'}</option>` + 
                       smCodes.map(c => `<option value="${c}">${getSmName(c, currentLang)}</option>`).join('');

        const categories = [...new Set(fullDataList.map(i => getText(i.categoryRaw, currentLang)))];
        cat.innerHTML = `<option value="ALL">${d.optCatAll || '所有分類'}</option>` + 
                        categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

            'txt-thCat': 'thCat', 'txt-thSm': 'thSm', 'txt-thName': 'thName', 'txt-thType': 'thType',
            'txt-thOrig': 'thOrig', 'txt-thEff': 'thEff', 'txt-thDiff': 'thDiff', 'txt-thOther': 'thOther',
            'qsLabel': 'qsLabel', 'qs1': 'qs1', 'qs2': 'qs2', 'qs3': 'qs3', 'qs4': 'qs4',
            'listTitle': 'listTitle', 'dailyUpdateBadge': 'dailyUpdateBadge', 'backBtn': 'backBtn',
            'optCatAll': 'optCatAll', 'optSmAll': 'optSmAll', 'optSortDiff': 'optSortDiff',
            'optSortMinP': 'optSortMinP', 'optSortCustom': 'optSortCustom'
        };

        Object.keys(uiElements).forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerText = d[uiElements[id]] || '';
        });
        
        // 動態翻譯 50% 按鈕
        const txtBtn50Pct = document.getElementById('txtBtn50Pct');
        if (txtBtn50Pct) {
            if (lang === 'en') txtBtn50Pct.innerText = '>50% Off';
            else if (lang === 'zh-Hans') txtBtn50Pct.innerText = '半价以上 (>50%)';
            else txtBtn50Pct.innerText = '半價以上 (>50%)';
        }

        const filterInput = document.getElementById('filterInput');
        if (filterInput) filterInput.placeholder = d.filterPlace || '';

        const statusLabel = document.getElementById('todayStatusLabel');
        if (lastUpdatedTime && statusLabel) {
            statusLabel.innerText = (d.lastUpdated || '') + formatDateTime(lastUpdatedTime);
        }
        
        populateDropdowns();
        applyFilters();
    }

    const globalChangeLang = window.changeLanguage; 
    window.changeLanguage = function(lang) {
        if (typeof globalChangeLang === 'function') {
            globalChangeLang(lang); // 1. 先執行 lang.js 裡面的 Header/Logo/分頁翻譯
        }
        if (typeof updateLocalLanguage === 'function') {
            updateLocalLanguage(lang);  // 2. 再執行本頁智選真抵榜的表格與按鈕翻譯
