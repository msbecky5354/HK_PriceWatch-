   <script>
    // --- 1. 全域變數 ---
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    let fullDataList = [];
    let lastUpdatedTime = null;
    let currentSort = { column: 'realDiscountPct', dir: 'desc' };
    let currentMinPct = 0; 

    // 💡 狀態標籤多語言對照表
    const statusI18n = {
        'new': { 'en': '🆕 Newly Added', 'zh-Hant': '🆕 首次上架', 'zh-Hans': '🆕 首次上架', 'color': 'text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/30 border-purple-200 dark:border-purple-800' },
        'drop': { 'en': '📉 Real Price Drop', 'zh-Hant': '📉 真降價', 'zh-Hans': '📉 真降价', 'color': 'text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30 border-green-200 dark:border-green-800' },
        'fake': { 'en': '⚠️ Fake Promo', 'zh-Hant': '⚠️ 假促銷(無平到)', 'zh-Hans': '⚠️ 假促销(无降价)', 'color': 'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 border-amber-200 dark:border-amber-800' },
        'increase': { 'en': '📈 Hidden Increase', 'zh-Hant': '📈 價格暗升', 'zh-Hans': '📈 价格暗升', 'color': 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-800' },
        'promo_changed': { 'en': '🏷️ Promo Changed', 'zh-Hant': '🏷️ 換新優惠', 'zh-Hans': '🏷️ 换新优惠', 'color': 'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 border-blue-200 dark:border-blue-800' },
        'maintained': { 'en': '⏸️ Maintained', 'zh-Hant': '⏸️ 價格維持', 'zh-Hans': '⏸️ 价格维持', 'color': 'text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700' }
    };

    // --- 2. 核心工具函數 ---
    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function getText(content, lang) {
        if (!content) return '-';
        if (typeof content === 'string') return content;
        if (typeof content === 'object') {
            return content[lang] || content['zh-Hant'] || Object.values(content)[0] || '-';
        }
        return String(content);
    }

    function getSmName(code, lang) {
        let c = (code || '').toUpperCase();
        if (typeof supermarketDict !== 'undefined' && supermarketDict[lang] && supermarketDict[lang][c]) {
            return supermarketDict[lang][c];
        }
        return c;
    }

    function getSmBadge(smCode, lang) {
        let code = (smCode || '').toUpperCase();
        let name = getSmName(code, lang);
        let bgCls = 'bg-slate-100 dark:bg-slate-700', textCls = 'text-slate-600 dark:text-slate-300', borderCls = 'border-slate-200 dark:border-slate-600';
        if (code === 'WELLCOME' || code === 'LUNGFUNG') { bgCls = 'bg-red-50 dark:bg-red-900/20'; textCls = 'text-red-600 dark:text-red-400'; borderCls = 'border-red-200 dark:border-red-800'; }
        else if (code === 'PARKNSHOP') { bgCls = 'bg-blue-50 dark:bg-blue-900/20'; textCls = 'text-blue-600 dark:text-blue-400'; borderCls = 'border-blue-200 dark:border-blue-800'; }
        else if (code === 'WATSONS') { bgCls = 'bg-teal-50 dark:bg-teal-900/20'; textCls = 'text-teal-600 dark:text-teal-400'; borderCls = 'border-teal-200 dark:border-teal-800'; }
        else if (code === 'HKTVMALL') { bgCls = 'bg-green-50 dark:bg-green-900/20'; textCls = 'text-green-600 dark:text-green-400'; borderCls = 'border-green-200 dark:border-green-800'; }
        else if (code === 'JASONS' || code === 'MARKETPLACE') { bgCls = 'bg-emerald-50 dark:bg-emerald-900/20'; textCls = 'text-emerald-700 dark:text-emerald-400'; borderCls = 'border-emerald-200 dark:border-emerald-800'; }
        else if (code === 'MANNINGS') { bgCls = 'bg-orange-50 dark:bg-orange-900/20'; textCls = 'text-orange-600 dark:text-orange-400'; borderCls = 'border-orange-200 dark:border-orange-800'; }
        else if (code === 'AEON') { bgCls = 'bg-fuchsia-50 dark:bg-fuchsia-900/20'; textCls = 'text-fuchsia-600 dark:text-fuchsia-400'; borderCls = 'border-fuchsia-200 dark:border-fuchsia-800'; }
        return `<span onclick="setQuickSearch('${name}'); window.scrollTo({ top: 0, behavior: 'smooth' });" class="px-2.5 py-1 text-[11px] font-black rounded-md border ${bgCls} ${textCls} ${borderCls} whitespace-nowrap shadow-sm cursor-pointer hover:opacity-75 transition-all inline-block">${name}</span>`;
    }

    function goToProductSearch(productName) {
        window.location.href = 'index.html?lang=' + currentLang + '&q=' + encodeURIComponent(productName);
    }

   // --- 4. 🚀 數據讀取與 Browser-Side JOIN 引擎 ---
    async function loadTrueDiscountData() {
        try {
            const tbody = document.getElementById('leaderboardTableBody');
            const mbody = document.getElementById('leaderboardMobile');
            
            let loadingStr = currentLang === 'en' ? '⏳ Compiling Real-Time Prices & History...' : (currentLang === 'zh-Hans' ? '⏳ 正在组装实时价格与历史快照...' : '⏳ 正在組裝實時價格與歷史快照...');
            const loadingHTML = `<div class="p-10 text-center font-bold text-slate-500 dark:text-slate-400 animate-pulse text-[15px]">${loadingStr}</div>`;
            if (tbody) tbody.innerHTML = `<tr><td colspan="10">${loadingHTML}</td></tr>`;
            if (mbody) mbody.innerHTML = loadingHTML;

            // 🚀 同時下載 3 份檔案 (包含 snapshot.json 歷史記憶)
            const [timeRes, dataRes, snapRes] = await Promise.all([
                fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/update_log.txt").catch(() => null),
                fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/pricewatch.json").catch(() => null),
                fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/snapshot.json").catch(() => null)
            ]);
            
            if (timeRes && timeRes.ok) lastUpdatedTime = new Date(await timeRes.text());
            const items = dataRes && dataRes.ok ? await dataRes.json() : [];
            
            // 🧠 建立 O(1) 的大腦快照字典
            const snapshotMap = new Map();
            if (snapRes && snapRes.ok) {
                try {
                    const snapJson = await snapRes.json();
                    const snapArray = snapJson.results || snapJson; 
                    if (Array.isArray(snapArray)) {
                        snapArray.forEach(row => {
                            const pCode = row.product_code || row.productCode;
                            const sCode = (row.supermarket_code || row.supermarketCode || '').toUpperCase();
                            if (pCode && sCode) snapshotMap.set(`${pCode}_${sCode}`, row);
                        });
                    }
                } catch(e) { console.warn("快照字典建立失敗", e); }
            }

            let processedData = [];
            
            items.forEach((item) => {
                if (!item.prices || item.prices.length === 0) return;
                let validPricesForThisItem = [];
                
                item.prices.forEach(p => {
                    const smCode = (p.supermarketCode || p.supermarket || '').toUpperCase();
                    if (smCode === 'ZTORE' || !smCode) return; 
                    
                    const basePrice = parseFloat(p.price);
                    if (isNaN(basePrice)) return;
                    
                    let effectivePrice = basePrice;
                    let promoCalcText = "", offerStr_display = "-", offerStr_en = "";
                    
                    const promoKeys = ['offers', 'promotions', 'promotion', 'offer', 'promotionDesc'];
                    for (let key of promoKeys) {
                        if (p[key]) {
                            promoCalcText = (typeof p[key] === 'object') ? (p[key]['en'] || p[key]['zh-Hant'] || '') : String(p[key]);
                            offerStr_display = (typeof p[key] === 'object') ? (p[key]['zh-Hant'] || p[key]['zh-Hans'] || p[key]['en'] || '') : String(p[key]);
                            offerStr_en = (typeof p[key] === 'object') ? (p[key]['en'] || '') : String(p[key]);
                            break;
                        } else if (Array.isArray(item[key])) {
                            let matchOffer = item[key].find(o => (o.supermarketCode || o.supermarket || '').toUpperCase() === smCode);
                            if (matchOffer) {
                                promoCalcText = matchOffer.en || matchOffer['zh-Hant'] || '';
                                offerStr_display = matchOffer['zh-Hant'] || matchOffer['zh-Hans'] || matchOffer.en || '';
                                offerStr_en = matchOffer.en || '';
                                break;
                            }
                        }
                    }

                    if (typeof calculateAvgPrice === 'function' && promoCalcText) {
                        let avgPrice = calculateAvgPrice(promoCalcText, basePrice);
                        if (avgPrice && avgPrice > 0 && avgPrice < basePrice) effectivePrice = avgPrice;
                    }
                    
                    validPricesForThisItem.push({ smCode, basePrice, effectivePrice, offerStr_display, offerStr_en });
                });
                
                if (validPricesForThisItem.length === 0) return;
                
                let sum = 0;
                validPricesForThisItem.forEach(vp => sum += vp.effectivePrice);
                let marketAvgPrice = sum / validPricesForThisItem.length;
                if (marketAvgPrice <= 0) return;
                
                // 🚀 前端 Browser-Side JOIN 邏輯
                validPricesForThisItem.forEach(vp => {
                    const realDiscountPct = ((marketAvgPrice - vp.effectivePrice) / marketAvgPrice) * 100;
                    if (realDiscountPct <= 0) return; 
                    
                    const history = snapshotMap.get(`${item.code}_${vp.smCode}`);
                    let statusKey = 'maintained';
                    let prevBasePrice = null, prevEffPrice = null, lastChangeDate = '-', prevOfferText = '-';

                    if (history) {
                        prevBasePrice = parseFloat(history.previous_base_price || history.price);
                        prevEffPrice = parseFloat(history.previous_effective_price || history.effective_price || history.price);
                        lastChangeDate = history.last_changed_date ? history.last_changed_date.split('T')[0] : '-';
                        prevOfferText = history.previous_offer_zh_hant || history.offer_zh_hant || history.previous_offer_en || '-';

                        const dbStatus = history.change_status || '';
                        const prevOfferEn = history.previous_offer_en || history.offer_en || '';

                        if (dbStatus === 'NEW_ADDED' || isNaN(prevEffPrice)) statusKey = 'new';
                        else if (vp.effectivePrice < prevEffPrice) statusKey = 'drop';
                        else if (vp.offerStr_en && vp.effectivePrice >= prevEffPrice) statusKey = 'fake';
                        else if (vp.effectivePrice > prevEffPrice) statusKey = 'increase';
                        else if (vp.offerStr_en && vp.offerStr_en !== prevOfferEn) statusKey = 'promo_changed';
                        else statusKey = 'maintained';
                    } else {
                        statusKey = 'new';
                    }

                    const otherPricesArr = validPricesForThisItem.filter(other => other.smCode !== vp.smCode).map(other => ({ smCode: other.smCode, price: other.effectivePrice }));
                        
                    processedData.push({
                        smCode: vp.smCode, name: item.name, categoryRaw: item.cat1Name || {'zh-Hant': '其他'},
                        originalPrice: vp.basePrice, effectivePrice: vp.effectivePrice, realDiscountPct: realDiscountPct,
                        otherPricesRaw: otherPricesArr, brand: item.brand, currentOffer: vp.offerStr_display,
                        statusKey: statusKey, prevBasePrice: prevBasePrice, prevEffPrice: prevEffPrice, 
                        prevOffer: prevOfferText, lastChangeDate: lastChangeDate
                    });
                });
            });
            
            fullDataList = processedData.sort((a, b) => b.realDiscountPct - a.realDiscountPct);
            changeLanguage(currentLang); 
            
        } catch (e) { 
            console.error("數據載入錯誤:", e); 
        }
    }

        applyFilters();

    function handleSort(col) {
        if (col === 'displayRank') { currentSort = { column: 'realDiscountPct', dir: 'desc' }; } 
        else if (currentSort.column === col) { currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc'; } 
        else { currentSort.column = col; currentSort.dir = (col === 'effectivePrice' || col === 'originalPrice') ? 'asc' : 'desc'; }
        const sortFilter = document.getElementById('sortFilter');
        if (sortFilter) sortFilter.value = 'custom';
        applyFilters();
    }

    function updateSortUI() {
        document.querySelectorAll('.sort-icon').forEach(el => el.innerText = '');
        const thMapping = { 'displayRank': 'thRank', 'categoryRaw': 'thCat', 'smCode': 'thSm', 'name': 'thName', 'originalPrice': 'thOrig', 'effectivePrice': 'thEff', 'realDiscountPct': 'thDiff' };
        const thId = thMapping[currentSort.column];
        if (thId) {
            const th = document.getElementById(thId);
            if (th) { const icon = th.querySelector('.sort-icon'); if (icon) icon.innerText = currentSort.dir === 'asc' ? '▲' : '▼'; }
        }
    }

    function applyFilters() {
        const kwInput = document.getElementById('filterInput');
        const kw = kwInput ? kwInput.value.toLowerCase().trim() : '';
        const sm = document.getElementById('smFilter').value;
        const cat = document.getElementById('catFilter').value;
        const clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) clearBtn.classList.toggle('hidden', kw.length === 0);

        let filtered = fullDataList.filter(i => {
            const name = getText(i.name, currentLang).toLowerCase();
            const smNameText = getSmName(i.smCode, currentLang).toLowerCase(); 
            const categoryText = getText(i.categoryRaw, currentLang); 
            const matchesKw = name.includes(kw) || smNameText.includes(kw);
            const matchesSm = (sm === 'ALL' || i.smCode === sm);
            const matchesCat = (cat === 'ALL' || categoryText === cat);
            const matchesPct = currentMinPct > 0 ? (i.realDiscountPct >= currentMinPct) : true;
            return matchesKw && matchesSm && matchesCat && matchesPct;
        });

        filtered.sort((a, b) => {
            let valA = a[currentSort.column], valB = b[currentSort.column];
            if (currentSort.column === 'categoryRaw' || currentSort.column === 'name') {
                 valA = getText(a[currentSort.column], currentLang); valB = getText(b[currentSort.column], currentLang);
                 return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            if (currentSort.column === 'smCode' || currentSort.column === 'statusKey') {
                valA = String(valA || ''); valB = String(valB || '');
                return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            return currentSort.dir === 'asc' ? valA - valB : valB - valA;

    function openCalcInfoModal() {
        const modal = document.getElementById('calcInfoModal');
        const box = document.getElementById('calcInfoBox');
        
        // 載入對應語言的內容
        const langData = calcInfoTexts[currentLang] || calcInfoTexts['zh-Hant'];
        document.getElementById('calcModalTitle').innerHTML = langData.title;
        document.getElementById('calcModalContent').innerHTML = langData.content;
        document.getElementById('calcModalCloseBtn').innerText = langData.close;

        if (modal && box) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }
    }

    function closeCalcInfoModal() {
        const modal = document.getElementById('calcInfoModal');
        const box = document.getElementById('calcInfoBox');
        if (modal && box) {
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }
    }

    // --- 啟動初始化 ---
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof window.currentLang !== 'undefined') {
            updateLocalLanguage(window.currentLang);
        } else {
            updateLocalLanguage(currentLang);
        }
    });

    // --- 啟動 ---
    loadTrueDiscountData();
