<script>
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    
    let treemapChart = null;
    let heatmapChart = null;

    let currentHeatmapModeHc = 'real'; 
    
    let mainLastUpdatedTime = null;

    window.switchHeatmapMode = function(mode, isHc) {
        if (!isHc) {
            currentHeatmapMode = mode;
            const btnReal = document.getElementById('btnHeatModeReal');
            const btnMarket = document.getElementById('btnHeatModeMarket');
            if (mode === 'real') {
                btnReal.className = "px-3 py-1 text-[11px] font-bold rounded-md bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 shadow-sm transition-all";
                btnMarket.className = "px-3 py-1 text-[11px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
            } else {
                btnMarket.className = "px-3 py-1 text-[11px] font-bold rounded-md bg-white dark:bg-slate-800 text-orange-600 dark:text-orange-400 shadow-sm transition-all";
                btnReal.className = "px-3 py-1 text-[11px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
            }
            updateOriginalCharts();
        } else {
            currentHeatmapModeHc = mode;
            const btnReal = document.getElementById('btnHeatModeRealHc');
            const btnMarket = document.getElementById('btnHeatModeMarketHc');
            if (mode === 'real') {
                btnReal.className = "px-3 py-1 text-[11px] font-bold rounded-md bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 shadow-sm transition-all";
                btnMarket.className = "px-3 py-1 text-[11px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
            } else {
                btnMarket.className = "px-3 py-1 text-[11px] font-bold rounded-md bg-white dark:bg-slate-800 text-orange-600 dark:text-orange-400 shadow-sm transition-all";
                btnReal.className = "px-3 py-1 text-[11px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
            }
            updateHardcoreCharts();
        }
    };

    function openMechanismModal() { document.getElementById('mechanismModal').classList.remove('hidden'); }
    function closeMechanismModal() { document.getElementById('mechanismModal').classList.add('hidden'); }

  function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    const i18n = {
        'zh-Hant': { 
            title: '全局戰情室', sub: '實時監控各大超市降價分佈與火力', back: '返回', 
            treeTitle: '全城降價戰力版圖 (常規視角)', heatTitle: '全城戰火熱力矩陣 (常規視角)', 
            treeTitleHc: '實質降價戰力版圖 (門檻過濾)', heatTitleHc: '實質戰火熱力矩陣 (門檻過濾)',
            btnReal: '📉 自身真降幅', btnMarket: '⚔️ 擊穿市價幅',
            hcSecTitle: '動態深度折讓分析', hcSecDesc: '自訂實質降幅門檻，透視各大財團深層定價策略',
            opt5: '≥ 5% (常規折讓門檻)', opt10: '≥ 10% (深度折讓門檻)', opt15: '≥ 15% (戰略折讓門檻)', opt20: '≥ 20% (極限折讓門檻)',
            loading: '情報匯入中...', ttDrop: '真實降價件數：', ttShare: '火力佔比：', itemUnit: '件'
        },

            treeTitle: '全城降价战力版图 (常规视角)', heatTitle: '全城战火热力矩阵 (常规视角)', 
            treeTitleHc: '实质降价战力版图 (门槛过滤)', heatTitleHc: '实质战火热力矩阵 (门槛过滤)',
            btnReal: '📉 自身真降幅', btnMarket: '⚔️ 击穿市价幅',
            hcSecTitle: '动态深度折让分析', hcSecDesc: '自订实质降幅门槛，透视各大财团深层定价策略',
            opt5: '≥ 5% (常规折让门槛)', opt10: '≥ 10% (深度折让门槛)', opt15: '≥ 15% (战略折让门槛)', opt20: '≥ 20% (极限折让门槛)',
            loading: '情报汇入中...', ttDrop: '真实降价件数：', ttShare: '火力占比：', itemUnit: '件'
        },
        'en': { 
            title: 'Command Center', sub: 'Real-time monitoring of discount distribution', back: 'Back', 
            treeTitle: 'Discount Treemap (Base)', heatTitle: 'Warfare Heatmap (Base)', 
            treeTitleHc: 'Discount Treemap (Filtered)', heatTitleHc: 'Warfare Heatmap (Filtered)',
            btnReal: '📉 True Drop', btnMarket: '⚔️ Market Drop',
            hcSecTitle: 'Dynamic Depth Analysis', hcSecDesc: 'Custom drop thresholds to reveal pricing strategies',
            opt5: '≥ 5% (Base Drop)', opt10: '≥ 10% (Deep Drop)', opt15: '≥ 15% (Strategic Drop)', opt20: '≥ 20% (Extreme Drop)',
            loading: 'Loading Data...', ttDrop: 'Drop Items:', ttShare: 'Market Share:', itemUnit: 'items'
        }
    };

   function updateLocalLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);
        const t = i18n[lang] || i18n['zh-Hant'];

        const appName = lang === 'en' ? 'SmartDeal' : (lang === 'zh-Hans' ? '悭真D' : '慳真D');
        document.title = `${t.title} | ${appName}🔎`;

        const setTxt = (id, txt) => { const el = document.getElementById(id); if (el) el.innerText = txt; };
        const setElHtml = (id, html) => { const el = document.getElementById(id); if (el && html) el.innerHTML = html; };
        
        setTxt('pageTitleText', t.title);
        setTxt('subTitleText', t.sub);
        setTxt('backBtn', t.back);

        setTxt('titleTreemap', t.treeTitle);
        setTxt('titleHeatmap', t.heatTitle);
        setTxt('btnHeatModeReal', t.btnReal);
        setTxt('btnHeatModeMarket', t.btnMarket);
        setTxt('btnHeatModeRealHc', t.btnReal);
        setTxt('btnHeatModeMarketHc', t.btnMarket);

        try { document.getElementById('treemapChartHc').parentElement.previousElementSibling.querySelectorAll('span')[1].innerText = t.treeTitleHc; } catch(e){}
        try { document.getElementById('heatmapChartHc').parentElement.previousElementSibling.querySelector('div > span:last-child').innerText = t.heatTitleHc; } catch(e){}
        try { document.querySelector('select#hcThreshold').previousElementSibling.querySelector('h2').innerHTML = `<span class="text-2xl">📊</span> ${t.hcSecTitle}`; } catch(e){}
        try { document.querySelector('select#hcThreshold').previousElementSibling.querySelector('p').innerText = t.hcSecDesc; } catch(e){}

        const hcSelect = document.getElementById('hcThreshold');
        if (hcSelect && hcSelect.options.length >= 4) {
            hcSelect.options[0].text = t.opt5;
            hcSelect.options[1].text = t.opt10;
            hcSelect.options[2].text = t.opt15;
            hcSelect.options[3].text = t.opt20;
        }

        const lblHcMatchedTxt = lang === 'en' ? 'Matched:' : (lang === 'zh-Hans' ? '符合条件:' : '符合條件:');
        const lblHcReducedTxt = lang === 'en' ? 'Filtered:' : (lang === 'zh-Hans' ? '对比全量减少:' : '對比全量減少:');
        const lblHcUnitTxt = lang === 'en' ? 'items' : '件';

        setTxt('lblHcMatched', lblHcMatchedTxt);
        setTxt('lblHcReduced', lblHcReducedTxt);
        setTxt('lblHcUnit1', lblHcUnitTxt);
        setTxt('lblHcUnit2', lblHcUnitTxt);

        const appTitleEl = document.getElementById('appTitle');
        if (appTitleEl) appTitleEl.innerText = appName;

        const statusLabel = document.getElementById('todayStatusLabel');
        if (statusLabel) {
            if (mainLastUpdatedTime && !isNaN(mainLastUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Updated: ' : (lang === 'zh-Hans' ? '更新于: ' : '更新於: ');
                statusLabel.innerText = prefix + formatDateTime(mainLastUpdatedTime);
            } else {
                statusLabel.innerText = lang === 'en' ? 'Loading...' : (lang === 'zh-Hans' ? '载入中...' : '載入中...');
            }
        }

        const biBadge = document.getElementById('biUpdateBadge');
        if (biBadge) {
            if (biLastUpdatedTime && !isNaN(biLastUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Data Updated: ' : (lang === 'zh-Hans' ? '战情更新于: ' : '戰情更新於: ');

    function processDataForCharts(rawData, threshold) {
        let treeMapAgg = {};
        let heatMapAgg = {};
        let totalItems = 0;

        rawData.forEach(item => {
            let catRaw = item._catRaw;
            let smCode = item._smCode;

            if (!treeMapAgg[catRaw]) treeMapAgg[catRaw] = {};
            if (!treeMapAgg[catRaw][smCode]) treeMapAgg[catRaw][smCode] = { base: 0, filtered: 0 };
            
            let heatKey = `${smCode}_${catRaw}`;
            if (!heatMapAgg[heatKey]) {
                heatMapAgg[heatKey] = { store: smCode, category: catRaw, baseCount: 0, count: 0, sumReal: 0, sumMarket: 0, marketCount: 0 };
            }

            treeMapAgg[catRaw][smCode].base++;
            heatMapAgg[heatKey].baseCount++;

            if (item._normalizedRealDrop >= threshold) {
                treeMapAgg[catRaw][smCode].filtered++;
                heatMapAgg[heatKey].count++;
                heatMapAgg[heatKey].sumReal += item._normalizedRealDrop;
                
                if (item._hasComp) {
                    heatMapAgg[heatKey].sumMarket += item._normalizedMarketDrop;
                    heatMapAgg[heatKey].marketCount++;
                }
                totalItems++;
            }
        });

        let treemapData = Object.keys(treeMapAgg).map(cat => ({
            name: cat,
            children: Object.keys(treeMapAgg[cat]).map(sm => ({
                name: sm,
                value: treeMapAgg[cat][sm].filtered,
                baseValue: treeMapAgg[cat][sm].base 
            }))
        }));

        let heatmapData = Object.values(heatMapAgg).map(agg => ({
            store: agg.store,
            category: agg.category,
            count: agg.count,
            baseCount: agg.baseCount, 
            avgDiscount: agg.count > 0 ? (agg.sumReal / agg.count) : 0,
            avgMarketDrop: agg.marketCount > 0 ? (agg.sumMarket / agg.marketCount) : 0
        }));

        return { treemapData, heatmapData, totalItems };
    }

        renderHeatmap(heatmapChartHc, processed.heatmapData, currentHeatmapModeHc, threshold);

        const baseCount = globalNormalizedData.length;
        const currentCount = processed.totalItems;
        const dropCount = baseCount - currentCount;
        const dropPct = baseCount > 0 ? ((dropCount / baseCount) * 100).toFixed(1) : 0;

        const countEl = document.getElementById('hcSumCount');

                inRange: { color: colorRange }, 
                text: currentLang === 'en' ? ['High', 'Low'] : ['激減 (高)', '微減 (低)'],
                textStyle: { color: '#64748b', fontWeight: 'bold', fontSize: 11 }
            },
            series: [{
                name: '戰況數值', type: 'heatmap', data: seriesData,
                label: { 
                    show: true, 
                    formatter: function(params) { return params.value[2].toFixed(1) + '%'; }, 
                    color: '#ffffff', fontWeight: 'black', fontSize: 13, textShadowColor: 'rgba(0,0,0,0.4)', textShadowBlur: 3 
                },
                itemStyle: { borderColor: '#ffffff', borderWidth: 3, borderRadius: 6 } 
            }]
        };
        chartInstance.setOption(option);

        chartInstance.off('dblclick');
        chartInstance.on('dblclick', function (params) {
            const rawSmCode = xDataRaw[params.value[0]]; 
            const rawCat = yDataRaw[params.value[1]];
            const targetUrl = `true_discount.html?sm=${encodeURIComponent(rawSmCode)}&cat=${encodeURIComponent(rawCat)}&status=ALL&other=ALL&minDrop=${minDrop}`;
            window.open(targetUrl, 'TrueDiscountView');
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        treemapChart = echarts.init(document.getElementById('treemapChart'));
        heatmapChart = echarts.init(document.getElementById('heatmapChart'));
        treemapChartHc = echarts.init(document.getElementById('treemapChartHc'));
        heatmapChartHc = echarts.init(document.getElementById('heatmapChartHc'));
        
        const t = i18n[currentLang] || i18n['zh-Hant'];
        updateLocalLanguage(currentLang);
        
        treemapChart.showLoading({ text: t.loading, color: '#3b82f6', maskColor: 'rgba(255, 255, 255, 0.8)' });
        heatmapChart.showLoading({ text: t.loading, color: '#ef4444', maskColor: 'rgba(255, 255, 255, 0.8)' });
        treemapChartHc.showLoading({ text: t.loading, color: '#3b82f6', maskColor: 'rgba(255, 255, 255, 0.8)' });
        heatmapChartHc.showLoading({ text: t.loading, color: '#ef4444', maskColor: 'rgba(255, 255, 255, 0.8)' });

        const nocache = new Date().getTime();

        // 加入 Auto-Retry 邏輯
        async function fetchWithRetry(url, options = {}, retries = 3, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return await res.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    console.warn(`Fetch 失敗，${delay * Math.pow(2, i)}ms 後進行第 ${i + 1} 次重試...`);
                    await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, i)));
                }
            }
        }

        fetch(`https://raw.githubusercontent.com/msbecky5354/JSON/main/data/update_log.txt?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.ok ? res.text() : Promise.reject('Failed to load main log'))
            .then(text => {
                let safeTimeStr = text.trim().replace(/-/g, '/').replace('T', ' '); 
                mainLastUpdatedTime = new Date(safeTimeStr);
                updateLocalLanguage(currentLang);
            })
            .catch(e => console.warn("主網站時間紀錄載入失敗", e));

        fetch(`https://raw.githubusercontent.com/msbecky5354/JSON/main/data/update_log_TrueDiscount.txt?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.ok ? res.text() : Promise.reject('Failed to load BI log'))
            .then(text => {
                let safeTimeStr = text.trim().replace(/-/g, '/').replace('T', ' '); 
                biLastUpdatedTime = new Date(safeTimeStr);
                updateLocalLanguage(currentLang);
            })
            .catch(e => console.warn("戰情室時間紀錄載入失敗", e));

        const dataUrl = 'https://raw.githubusercontent.com/msbecky5354/JSON/main/data/bi_true_discount.json';
        
        // 改用 fetchWithRetry 提取數據
        fetchWithRetry(`${dataUrl}?v=${nocache}`, { cache: 'no-store' })
            .then(payload => {
                let data = payload;
                if (!Array.isArray(data) && (data.results || data.data)) data = data.results || data.data;
                if (!Array.isArray(data)) data = [data];
                if (data.length > 0 && data[0].json && data[0].json.true_discount_json) data = data[0].json.true_discount_json;
                else if (data.length > 0 && data[0].true_discount_json) data = data[0].true_discount_json;
                else if (data.length > 0 && data[0].json) data = data.map(i => i.json);
                if (data.length === 1 && data[0].true_discount_json) data = data[0].true_discount_json;

                // 核心數據標準化 (Normalization)
                globalNormalizedData = data.filter(item => {
                    if (item.rn !== undefined && parseInt(item.rn) !== 1) return false;
                    if (item.route_flag !== undefined && String(item.route_flag).includes('secondary')) return false;
                    return true;
                }).map(item => {
                    let smCode = (item.smCode || 'Unknown').toUpperCase().trim();
                    let catRaw = typeof item.categoryRaw === 'object' ? (item.categoryRaw['zh-Hant'] || '') : String(item.categoryRaw || '');
                    if (!catRaw) catRaw = '未分類';

                    let prevE = parseFloat(item.prevEffPrice) || 0;
                    let currE = parseFloat(item.effectivePrice) || 0;
                    let realDrop = parseFloat(item.realDiscountPct) || 0;
                    if (prevE > currE && realDrop === 0) {
                        realDrop = ((prevE - currE) / prevE) * 100;
                    }

                    let marketDrop = parseFloat(item.marketDropPct) || 0;
                    let hasComp = false;
                    if (item.otherPricesRaw && item.otherPricesRaw !== '[]' && item.otherPricesRaw !== 'null') {
                        try {
                            let opRaw = typeof item.otherPricesRaw === 'string' ? JSON.parse(item.otherPricesRaw) : item.otherPricesRaw;
                            if (Array.isArray(opRaw)) {
                                opRaw = opRaw.filter(op => op.smCode !== smCode);
                                if (opRaw.length > 0) hasComp = true;
                            }
                        } catch(e) {}
                    }

                    item._normalizedRealDrop = realDrop;
                    item._normalizedMarketDrop = marketDrop;
                    item._smCode = smCode;
                    item._catRaw = catRaw;
                    item._hasComp = hasComp;
                    return item;
                });

                treemapChart.hideLoading();
                heatmapChart.hideLoading();
                treemapChartHc.hideLoading();
                heatmapChartHc.hideLoading();
                
                // 執行渲染
                updateOriginalCharts();
                updateHardcoreCharts();
            })
            .catch(e => {
                console.error("Dashboard Data Fetch Error after retries:", e);
                treemapChart.hideLoading(); heatmapChart.hideLoading(); treemapChartHc.hideLoading(); heatmapChartHc.hideLoading();
                const errorHtml = `<div class="flex flex-col items-center justify-center mt-20 gap-3">
                                     <span class="text-red-500 font-bold">⚠️ 網絡連線稍慢，無法載入數據。</span>
                                     <button onclick="location.reload()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-sm text-slate-700 dark:text-slate-300 font-bold transition shadow-sm active:scale-95">🔄 重新載入</button>
                                   </div>`;
                document.getElementById('treemapChart').innerHTML = errorHtml;
                document.getElementById('heatmapChart').innerHTML = errorHtml;
                document.getElementById('treemapChartHc').innerHTML = errorHtml;
                document.getElementById('heatmapChartHc').innerHTML = errorHtml;
            });

        window.addEventListener('resize', () => { 
            if(treemapChart) treemapChart.resize(); 
            if(heatmapChart) heatmapChart.resize(); 
            if(treemapChartHc) treemapChartHc.resize(); 
            if(heatmapChartHc) heatmapChartHc.resize(); 
        });
    });
</script>
</body>
</html>
