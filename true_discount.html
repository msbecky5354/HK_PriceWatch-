   <script>
    // --- 1. 全域變數 ---
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    let fullDataList = [];
    let lastUpdatedTime = null;
    let currentSort = { column: 'realDiscountPct', dir: 'desc' };
    let currentMinPct = 30; // 💡 預設篩選 >30% 的降價貨品

    // 🌟 分類名稱智慧翻譯大腦
    const catTranslations = {
        "個人護理": { "en": "Personal Care", "zh-Hans": "个人护理" },
        "糖果 / 餅乾 / 小食": { "en": "Snacks / Candies", "zh-Hans": "糖果 / 饼干 / 小食" },
        "粉麵 / 煮食用料 / 冷凍加工食品": { "en": "Noodles / Frozen Food", "zh-Hans": "粉面 / 冷冻食品" },
        "飲品": { "en": "Beverages", "zh-Hans": "饮品" },
        "酒類": { "en": "Alcohol", "zh-Hans": "酒类" },
        "奶粉 / 嬰兒用品": { "en": "Baby Products", "zh-Hans": "奶粉 / 婴儿用品" },
        "奶類及乳製品 / 大豆製品 / 蛋類": { "en": "Dairy / Soy / Eggs", "zh-Hans": "奶类 / 豆制品 / 蛋类" },
        "米 / 食油 / 罐頭 / 蔬果 / 肉類": { "en": "Rice / Oil / Canned / Fresh", "zh-Hans": "米 / 食油 / 罐头 / 生鲜" },
        "家居用品 / 寵物食品及用品": { "en": "Household / Pet", "zh-Hans": "家居用品 / 宠物" },
        "麵包蛋糕 / 穀類早餐 / 麵包醬": { "en": "Bakery / Cereal / Spreads", "zh-Hans": "面包 / 谷类 / 酱料" }
    };

    function getCatName(rawCat, lang) {
        if (typeof rawCat === 'object' && rawCat[lang]) return rawCat[lang];
        let baseCat = (typeof rawCat === 'object') ? (rawCat['zh-Hant'] || rawCat['en'] || '') : String(rawCat || '');
        if (lang === 'zh-Hant') return baseCat;
        if (catTranslations[baseCat] && catTranslations[baseCat][lang]) {
            return catTranslations[baseCat][lang];
        }
        return baseCat;
    }

    const statusI18n = {
        'new': { 'en': '🆕 Newly Added', 'zh-Hant': '🆕 首次上架', 'zh-Hans': '🆕 首次上架', 'color': 'text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/30 border-purple-200 dark:border-purple-800' },
        'drop': { 'en': '📉 Real Price Drop', 'zh-Hant': '📉 真降價', 'zh-Hans': '📉 真降价', 'color': 'text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30 border-green-200 dark:border-green-800' },
        'fake': { 'en': '⚠️ Fake Promo', 'zh-Hant': '⚠️ 假促銷(無平到)', 'zh-Hans': '⚠️ 假促销(无降价)', 'color': 'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 border-amber-200 dark:border-amber-800' },
        'increase': { 'en': '📈 Hidden Increase', 'zh-Hant': '📈 價格暗升', 'zh-Hans': '📈 价格暗升', 'color': 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-800' },
        'promo_changed': { 'en': '🏷️ Promo Changed', 'zh-Hant': '🏷️ 換新優惠', 'zh-Hans': '🏷️ 换新优惠', 'color': 'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 border-blue-200 dark:border-blue-800' },
        'PRICE_CHANGED': { 'en': '📉 Real Price Drop', 'zh-Hant': '📉 真降價', 'zh-Hans': '📉 真降价', 'color': 'text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30 border-green-200 dark:border-green-800' },
        'OFFER_CHANGED': { 'en': '🏷️ Promo Changed', 'zh-Hant': '🏷️ 換新優惠', 'zh-Hans': '🏷️ 换新优惠', 'color': 'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 border-blue-200 dark:border-blue-800' },
        'PRICE_AND_OFFER_CHANGED': { 'en': '📉+🏷️ Price & Promo Drop', 'zh-Hant': '📉+🏷️ 真降價+換優惠', 'zh-Hans': '📉+🏷️ 真降价+换优惠', 'color': 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-800' },
        'maintained': { 'en': '⏸️ Maintained', 'zh-Hant': '⏸️ 價格維持', 'zh-Hans': '⏸️ 价格维持', 'color': 'text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700' }
    };

    // --- 2. 核心工具函數 ---
    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function getText(content, lang) {
        if (!content) return '-';
        if (typeof content === 'string') return content;
        if (typeof content === 'object') {
            return content[lang] || content['zh-Hant'] || Object.values(content)[0] || '-';
        }
        return String(content);
    }

    function getSmName(code, lang) {
        let c = (code || '').toUpperCase();
        if (typeof supermarketDict !== 'undefined' && supermarketDict[lang] && supermarketDict[lang][c]) {
            return supermarketDict[lang][c];
        }
        if (typeof supermarketDict !== 'undefined' && supermarketDict['zh-Hant'] && supermarketDict['zh-Hant'][c]) {
            return supermarketDict['zh-Hant'][c];
        }
        return c;
    }

    function getSmBadge(smCode, lang) {
        let code = (smCode || '').toUpperCase();
        let name = getSmName(code, lang);
        
        let style = (typeof supermarketStyleDict !== 'undefined' && supermarketStyleDict[code]) 
            ? supermarketStyleDict[code] 
            : (typeof supermarketStyleDict !== 'undefined' && supermarketStyleDict['DEFAULT'] ? supermarketStyleDict['DEFAULT'] : { badgeBg: 'bg-slate-100 dark:bg-slate-700', badgeText: 'text-slate-600 dark:text-slate-300', badgeBorder: 'border-slate-200 dark:border-slate-600' });
            
        return `<span onclick="setQuickSearch('${name}'); window.scrollTo({ top: 0, behavior: 'smooth' });" class="px-2.5 py-1 text-[11px] font-black rounded-md border ${style.badgeBg} ${style.badgeText} ${style.badgeBorder} whitespace-nowrap shadow-sm cursor-pointer hover:opacity-75 transition-all inline-block">${name}</span>`;
    }

    function goToProductSearch(productName) {
        window.location.href = 'index.html?lang=' + currentLang + '&q=' + encodeURIComponent(productName);
    }

   // --- 4. 🚀 秒速載入 n8n 伺服器端資料 (附多重備援與深度除錯) ---
    async function loadTrueDiscountData() {
        try {
            const tbody = document.getElementById('leaderboardTableBody');
            const mbody = document.getElementById('leaderboardMobile');
            
            let loadingStr = currentLang === 'en' ? '⏳ Fetching Pre-calculated Data...' : (currentLang === 'zh-Hans' ? '⏳ 正在拉取云端运算数据...' : '⏳ 正在拉取雲端運算數據...');
            const loadingHTML = `<div class="p-10 text-center font-bold text-slate-500 dark:text-slate-400 animate-pulse text-[15px]">${loadingStr}</div>`;
            if (tbody) tbody.innerHTML = `<tr><td colspan="10">${loadingHTML}</td></tr>`;
            if (mbody) mbody.innerHTML = loadingHTML;

            const nocache = new Date().getTime() + Math.random().toString(36).substring(7);
            const urlsToTry = [
                `https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/true_discount.json?v=${nocache}`,
                `https://cdn.jsdelivr.net/gh/msbecky5354/HK_PriceWatch-@main/data/true_discount.json?v=${nocache}`
            ];

            let rawJson = null;
            let lastError = null;

            for (const url of urlsToTry) {
                try {
                    console.log("正在嘗試抓取:", url);
                    const res = await fetch(url, { cache: 'no-store' });
                    
                    if (!res.ok) {
                        throw new Error(`HTTP 狀態碼: ${res.status}`);
                    }
                    
                    const contentType = res.headers.get("content-type");
                    if (contentType && contentType.includes("text/plain")) {
                         const textData = await res.text();
                         rawJson = JSON.parse(textData);
                    } else {
                         rawJson = await res.json();
                    }
                    
                    if (rawJson && (rawJson.results || Array.isArray(rawJson))) {
                        console.log("✅ 成功從此節點取得 JSON！");
                        break; 
                    } else {
                        throw new Error("JSON 格式不符合預期");
                    }
                } catch (e) {
                    console.warn(`嘗試抓取 ${url} 失敗:`, e);
                    lastError = e;
                }
            }

            if (!rawJson) {
                throw new Error(`所有的資料節點均無回應。最後錯誤: ${lastError.message} (請確認 GitHub 上是否有最新推送的 true_discount.json)`);
            }

            // 💡 終極防呆：確保我們拿到的是乾淨的 Array，並且只由 n8n 負責資料過濾
            fullDataList = Array.isArray(rawJson.results) ? rawJson.results : (Array.isArray(rawJson) ? rawJson : []);
            
            if (rawJson.generated_at) {
                lastUpdatedTime = new Date(rawJson.generated_at);
            }

            if (typeof updateLocalLanguage === 'function') {
                updateLocalLanguage(currentLang);
            }
            
        } catch (e) { 
            console.error("數據載入崩潰:", e); 
            const errorStr = currentLang === 'en' ? 'Failed to load data' : '無法取得最新數據';
            const errorHTML = `
                <div class="p-10 text-center flex flex-col items-center justify-center gap-3">
                    <span class="text-red-500 dark:text-red-400 font-black text-[16px]">${errorStr}</span>
                    <span class="text-[12px] font-mono text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 max-w-md break-words">${e.message}</span>
                </div>`;
            const tbody = document.getElementById('leaderboardTableBody');
            const mbody = document.getElementById('leaderboardMobile');
            if(tbody) tbody.innerHTML = `<tr><td colspan="10">${errorHTML}</td></tr>`;
            if(mbody) mbody.innerHTML = errorHTML;
        }
    }

    function handleDropdownSort() {
        const val = document.getElementById('sortFilter').value;
        if (val === 'custom') return;

        currentSort = { column: col, dir: dir };
        applyFilters();

    function handleSort(col) {
        if (col === 'displayRank') { currentSort = { column: 'realDiscountPct', dir: 'desc' }; } 
        else if (currentSort.column === col) { currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc'; } 
        else { currentSort.column = col; currentSort.dir = (col === 'effectivePrice' || col === 'originalPrice') ? 'asc' : 'desc'; }
        const sortFilter = document.getElementById('sortFilter');
        if (sortFilter) sortFilter.value = 'custom';
        applyFilters();
    }

    function updateSortUI() {
        document.querySelectorAll('.sort-icon').forEach(el => el.innerText = '');
        const thMapping = { 'displayRank': 'thRank', 'categoryRaw': 'thCat', 'smCode': 'thSm', 'name': 'thName', 'originalPrice': 'thOrig', 'effectivePrice': 'thEff', 'realDiscountPct': 'thDiff' };
        const thId = thMapping[currentSort.column];
        if (thId) {
            const th = document.getElementById(thId);
            if (th) { const icon = th.querySelector('.sort-icon'); if (icon) icon.innerText = currentSort.dir === 'asc' ? '▲' : '▼'; }
        }
    }

    function applyFilters() {
        const kwInput = document.getElementById('filterInput');
        const kw = kwInput ? kwInput.value.toLowerCase().trim() : '';
        const sm = document.getElementById('smFilter').value;
        const cat = document.getElementById('catFilter').value;
        const clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) clearBtn.classList.toggle('hidden', kw.length === 0);

        // 💡 終極手術：前端只負責呈現和篩選，絕不自己算減幅或判定狀態！
        let filtered = fullDataList.filter(i => {
            const name = getText(i.name, currentLang).toLowerCase();
            const smNameText = getSmName(i.smCode, currentLang).toLowerCase(); 
            const rawCatValue = typeof i.categoryRaw === 'object' ? (i.categoryRaw['zh-Hant'] || '') : String(i.categoryRaw || '');
            const translatedCatText = getCatName(i.categoryRaw, currentLang).toLowerCase();
            
            const matchesKw = name.includes(kw) || smNameText.includes(kw) || translatedCatText.includes(kw);
            const matchesSm = (sm === 'ALL' || i.smCode === sm);
            const matchesCat = (cat === 'ALL' || rawCatValue === cat);
            const matchesPct = currentMinPct > 0 ? (parseFloat(i.realDiscountPct) >= currentMinPct) : true;
            
            return matchesKw && matchesSm && matchesCat && matchesPct;
        });

        filtered.sort((a, b) => {
            let valA = a[currentSort.column], valB = b[currentSort.column];
            
            if (currentSort.column === 'realDiscountPct' || currentSort.column === 'effectivePrice' || currentSort.column === 'originalPrice') {
                 valA = parseFloat(valA) || 0;
                 valB = parseFloat(valB) || 0;
            } else if (currentSort.column === 'categoryRaw' || currentSort.column === 'name') {
                 valA = getText(a[currentSort.column], currentLang); valB = getText(b[currentSort.column], currentLang);
                 return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            } else {
                valA = String(valA || ''); valB = String(valB || '');
                return currentSort.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            return currentSort.dir === 'asc' ? valA - valB : valB - valA;
        });

        updateSortUI();
        renderLeaderboard(filtered);
    }

        if (mobileContainer) {
            mobileContainer.innerHTML = list.map((item, i) => {
                let rankMedal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
                let displayName = getText(item.name, currentLang);
                let safeName = displayName.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                let otherPricesHTML = '-';
                let opRaw = typeof item.otherPricesRaw === 'string' ? JSON.parse(item.otherPricesRaw) : item.otherPricesRaw;
                if (opRaw && Array.isArray(opRaw)) {
                    opRaw = opRaw.filter(op => op.smCode !== item.smCode);
                }
                if (opRaw && opRaw.length > 0) {
                    otherPricesHTML = opRaw.map(op => `${getSmName(op.smCode, currentLang)}: $${parseFloat(op.price).toFixed(1)}`).join(' | ');
                }

                // 💡 絕對信賴 n8n 傳來的 statusKey
                const stDict = statusI18n[item.statusKey] || statusI18n['maintained'];
                const statusText = stDict[currentLang] || stDict['zh-Hant'];
                
                let prevEffText = item.prevEffPrice && parseFloat(item.prevEffPrice) > 0 ? `$${parseFloat(item.prevEffPrice).toFixed(1)}` : '-';
                let prevBaseText = item.prevBasePrice && parseFloat(item.prevBasePrice) > 0 ? `$${parseFloat(item.prevBasePrice).toFixed(1)}` : '-';
                
                let lastDateText = '-';
                if (item.lastChangeDate && item.lastChangeDate !== 'null' && item.lastChangeDate !== '') {
                    let dStr = String(item.lastChangeDate).trim();
                    if (/^\d{4}-\d{2}-\d{2}/.test(dStr)) {
                        lastDateText = dStr.substring(0, 10);
                    } else {
                        let d = new Date(dStr);
                        if (!isNaN(d.getTime())) {
                            lastDateText = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        } else {
                            lastDateText = dStr.split('T')[0]; 
                        }
                    }
                }
                
                let currentOfferText = currentLang === 'en' && item.currentOfferEn && item.currentOfferEn !== '-' ? item.currentOfferEn : item.currentOfferZh;
                if (!currentOfferText || currentOfferText === '-' || currentOfferText === 'null') currentOfferText = '';

                let prevOfferText = currentLang === 'en' && item.prevOfferEn && item.prevOfferEn !== '-' ? item.prevOfferEn : item.prevOfferZh;
                if (!prevOfferText || prevOfferText === '-' || prevOfferText === 'null') prevOfferText = currentLang === 'en' ? 'None' : '無';

                const mobBoxId = `mob-hist-${i}`;
                const mobIconId = `mob-icon-${i}`;

                const statusBadgeHTML = `
                    <div class="inline-flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition-opacity active:scale-95" onclick="toggleHistoryBox('${mobBoxId}', '${mobIconId}')">
                        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-bold rounded border ${stDict.color} shadow-sm w-max">
                            <span class="${item.statusKey === 'increase' || item.statusKey === 'fake' ? 'text-red-500 dark:text-red-400' : 'opacity-70'}">${prevEffText} &rarr;</span> ${statusText}
                        </span>
                        <div class="bg-slate-100 dark:bg-slate-700 rounded-full p-0.5 shadow-sm border border-slate-200 dark:border-slate-600">
                            <svg id="${mobIconId}" class="w-3 h-3 text-slate-500 dark:text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                `;

                const microHistoryBox = `
                    <div id="${mobBoxId}" class="hidden mt-1.5 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-100 dark:border-slate-700/50 text-[11px] text-slate-500 dark:text-slate-400 space-y-1 w-max min-w-[150px]">
                        <div class="flex justify-between gap-4"><span>${lblDate}</span> <span class="font-medium text-slate-700 dark:text-slate-300">${lastDateText}</span></div>
                        <div class="flex justify-between gap-4"><span>${lblBase}</span> <span class="font-medium text-slate-700 dark:text-slate-300">${prevBaseText}</span></div>
                        <div class="flex justify-between gap-4"><span>${lblEff}</span> <span class="font-bold text-slate-700 dark:text-slate-300">${prevEffText}</span></div>
                        <div class="flex justify-between gap-4 items-start">
                            <span class="shrink-0">${lblOffer}</span> 
                            <span class="font-medium text-slate-700 dark:text-slate-300 truncate max-w-[100px] text-right" title="${prevOfferText}">${prevOfferText}</span>
                        </div>
                    </div>
                `;
                
                const displayCategory = getCatName(item.categoryRaw, currentLang);

                return `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col gap-1 relative overflow-hidden transition-colors">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2.5">
                            <span class="text-xl font-black text-amber-500 drop-shadow-sm">${rankMedal}</span>
                            ${getSmBadge(item.smCode, currentLang)}
                        </div>
                        <span class="bg-red-50 dark:bg-red-900/30 text-red-500 dark:text-red-400 font-black px-2 py-1 rounded-full border border-red-200 dark:border-red-800 text-[12px] shadow-sm">▼ ${(parseFloat(item.realDiscountPct) || 0).toFixed(1)}%</span>
                    </div>
                    <div>
                        <span class="text-[12px] font-normal text-slate-500 dark:text-slate-400 block mb-0.5">${getText(item.brand, currentLang)}</span>
                        <h3 class="font-bold text-[15px] leading-snug mb-1">
                            <a href="javascript:void(0)" onclick="goToProductSearch('${safeName}')" class="text-slate-800 dark:text-slate-100 hover:text-blue-600 dark:hover:text-blue-400 hover:underline transition-colors cursor-pointer block">${displayName}</a>
                        </h3>
                        ${currentOfferText ? `<div class="text-[12px] text-red-500 mt-1">${currentOfferText}</div>` : ''}
                    </div>
                    <div class="flex justify-between items-end mt-2">
                        <div class="flex flex-col items-start gap-1 w-3/5">
                            <span class="text-[12px] text-slate-500 dark:text-slate-400">${displayCategory}</span>
                            ${statusBadgeHTML}
                            ${microHistoryBox}
                        </div>
                        <div class="flex flex-col items-end justify-end shrink-0 pb-1">
                            <span class="text-[14px] text-slate-400 dark:text-slate-500 line-through mb-0.5">$${(parseFloat(item.originalPrice) || 0).toFixed(1)}</span>
                            <span class="text-[26px] font-black text-blue-600 dark:text-blue-400 leading-none tracking-tight">$${(parseFloat(item.effectivePrice) || 0).toFixed(1)}</span>
                        </div>
                    </div>
                    ${item.otherPricesRaw && item.otherPricesRaw.length > 0 && item.otherPricesRaw !== '[]' ? `<div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700/50 text-[11px] text-slate-400 dark:text-slate-500 break-words leading-tight">${otherStrText}: ${otherPricesHTML}</div>` : ''}
                </div>
                `;
            }).join('');
        }
    }

    // --- ℹ️ 運算機制與聲明 Modal ---
    const calcInfoTexts = {
        'zh-Hant': {
            title: "ℹ️ 運算機制與聲明",
            close: "我明白",
            content: `
                <h4 class="font-bold text-[14px] text-slate-800 dark:text-slate-100 mb-1">🔢 數據運算機制大解密</h4>
                <p class="mb-2">本榜單採用純數學公式進行客觀對比，絕無人工干預：</p>
                <ul class="list-disc pl-5 space-y-1 mb-3">
                    <li><b>1. 鎖定數據：</b>每日同步政府「網上價格一覽通」數據。</li>
                    <li><b>2. 還原折實價：</b>AI 引擎自動拆解「買X件$Y」等綑綁促銷，計算單件真實折合價。</li>
                    <li><b>3. 確立基準線：</b>將同款貨品在全港超市的折實價加總求平均，得出最公允的「全城市場平均價」，拒絕超市自稱的虛高原價。</li>
                    <li><b>4. 計算真減幅：</b>公式為 <code>((市場平均價 - 該超市折實價) / 市場平均價) x 100%</code>。只有減幅 > 0% 的貨品才會上榜。</li>
                </ul>
                <h4 class="font-bold text-[14px] text-slate-800 dark:text-slate-100 mt-4 mb-1">⚖️ 重要免責聲明</h4>
                <p class="mb-2"><b>1. 資訊僅供參考：</b>所有價格均由電腦基於公開數據自動運算得出。數據可能因同步延遲或分店差異而有別，絕不構成購買建議。結帳前請自行核實實體店標價。</p>
                <p class="mb-2"><b>2. 數據中立性：</b>本程式不隸屬任何超市，絕不人工干預價格數據，排名純依數學差異客觀排列。</p>
                <p><b>3. 責任限制：</b>本程式以「現況」提供。對於因數據落差引致之任何損失，本程式及開發團隊概不承擔法律責任。</p>
            `
        },
        'zh-Hans': {
            title: "ℹ️ 运算机制与声明",
            close: "我明白",
            content: `
                <h4 class="font-bold text-[14px] text-slate-800 dark:text-slate-100 mb-1">🔢 数据运算机制大解密</h4>
                <p class="mb-2">本榜单采用纯数学公式进行客观对比，绝无人工干预：</p>
                <ul class="list-disc pl-5 space-y-1 mb-3">
                    <li><b>1. 锁定数据：</b>每日同步政府「网上价格一览通」数据。</li>
                    <li><b>2. 还原折实价：</b>AI 引擎自动拆解「买X件$Y」等捆绑促销，计算单件真实折合价。</li>
                    <li><b>3. 确立基准线：</b>将同款商品在全港超市的折实价加总求平均，得出最公允的「全城市场平均价」，拒绝超市自称的虚高原价。</li>
                    <li><b>4. 计算真减幅：</b>公式为 <code>((市场平均价 - 该超市折实价) / 市场平均价) x 100%</code>。只有减幅 > 0% 的商品才会上榜。</li>
                </ul>
                <h4 class="font-bold text-[14px] text-slate-800 dark:text-slate-100 mt-4 mb-1">⚖️ 重要免责声明</h4>
                <p class="mb-2"><b>1. 资讯仅供参考：</b>所有价格均由电脑基于公开数据自动运算得出。数据可能因同步延迟或分店差异而有别，绝不构成购买建议。结帐前请自行核实实体店标价。</p>
                <p class="mb-2"><b>2. 数据中立性：</b>本程式不隶属任何超市，绝不人工干预价格数据，排名纯依数学差异客观排列。</p>
                <p><b>3. 责任限制：</b>本程式以「现况」提供。对于因数据落差引致之任何损失，本程式及开发团队概不承担法律责任。</p>
            `
        },
        'en': {
            title: "ℹ️ Algorithm & Disclaimer",
            close: "I Understand",
            content: `
                <h4 class="font-bold text-[14px] text-slate-800 dark:text-slate-100 mb-1">🔢 How is it calculated?</h4>
                <p class="mb-2">Our board uses pure math for objective comparisons, with no manual intervention:</p>
                <ul class="list-disc pl-5 space-y-1 mb-3">
                    <li><b>1. Official Data:</b> Synced daily with the government's "Online Price Watch".</li>
                    <li><b>2. True Effective Price:</b> Our AI breaks down promos (e.g., "Buy 2 for $Y") to calculate the true price per item.</li>
                    <li><b>3. Market Benchmark:</b> We average the effective prices across all supermarkets to find the fair "Market Average Price", ignoring inflated "original prices".</li>
                    <li><b>4. True Discount:</b> Formula: <code>((Average - Effective Price) / Average) x 100%</code>. Only products with > 0% savings are listed.</li>
                </ul>
                <h4 class="font-bold text-[14px] text-slate-800 dark:text-slate-100 mt-4 mb-1">⚖️ Legal Disclaimer</h4>
                <p class="mb-2"><b>1. For Reference Only:</b> Prices are auto-calculated from public data. Discrepancies may occur due to delays or branch variations. Always verify at the physical store before purchasing.</p>
                <p class="mb-2"><b>2. Neutrality:</b> We are not affiliated with any supermarkets. Rankings are strictly based on math.</p>
                <p><b>3. Liability:</b> Provided "AS IS". The developers accept no liability for any losses caused by data discrepancies.</p>
            `
        }
    };

    function openCalcInfoModal() {
        const modal = document.getElementById('calcInfoModal');
        const box = document.getElementById('calcInfoBox');
        
        const langData = calcInfoTexts[currentLang] || calcInfoTexts['zh-Hant'];
        document.getElementById('calcModalTitle').innerHTML = langData.title;
        document.getElementById('calcModalContent').innerHTML = langData.content;
        document.getElementById('calcModalCloseBtn').innerText = langData.close;

        if (modal && box) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }
    }

    function closeCalcInfoModal() {
        const modal = document.getElementById('calcInfoModal');
        const box = document.getElementById('calcInfoBox');
        if (modal && box) {
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }
    }

    // --- 啟動初始化 ---
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof window.currentLang !== 'undefined') {
            updateLocalLanguage(window.currentLang);
        } else {
            updateLocalLanguage(currentLang);
        }
    });

    loadTrueDiscountData();
</script>
</body>
</html>
