                modal.classList.remove('hidden');

            }
        }

        let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
        const MIN_ITEMS_THRESHOLD = 3;
        
        let globalRawData = []; 
        let globalCleanedData = [];
        let currentLevel = 1; 
        let selectedCat1 = '';
        let selectedCat2 = '';
        let myChart = null;

        // ============================================================================
        // [2] 跨語系生命週期綁定 (Cross-domain i18n Lifecycle Binding)
        // ============================================================================
        
        function updateLocalLanguage(lang) {
            currentLang = lang;
            
            // --- 2.1 本地 BI 矩陣靜態術語替換 ---
            const dict = localI18nDict[lang] || localI18nDict['zh-Hant'];
            document.title = (lang === 'en' ? "Pricing Insights | SmartDeal" : (lang === 'zh-Hans' ? "悭真D | 市场定价透视" : "慳真D | 市場定價透視"));
            
            const keys = Object.keys(dict);
            keys.forEach(key => {
                const el = document.getElementById(key);
                if (el && !key.startsWith('bc') && !key.startsWith('chart') && !key.startsWith('noData')) {
                    el.innerHTML = dict[key]; 
                }
            });

            // --- 2.2 更新 Modal 字典 ---
            const modalData = calcInfoTexts[lang] || calcInfoTexts['zh-Hant'];
            const modalTitleEl = document.getElementById('calcModalTitle');
            const modalContentEl = document.getElementById('calcModalContent');
            const modalBtnEl = document.getElementById('calcModalCloseBtn');
            
            if (modalTitleEl) modalTitleEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg> ${modalData.title}`;
            if (modalContentEl) modalContentEl.innerHTML = modalData.content;
            if (modalBtnEl) modalBtnEl.innerText = modalData.close;
            
            // --- 2.3 強制觸發數據重組與圖表重繪 (修復 Data Grid 繁體殘留) ---
            if (globalRawData && globalRawData.length > 0) {
                processData(globalRawData); 
                updateView();               
            }
        }

        window.changeLanguage = function(lang) {
            if (typeof updateLocalLanguage === 'function') updateLocalLanguage(lang); 
        };

        window.addEventListener('languageChanged', (e) => {
            updateLocalLanguage(e.detail.lang || localStorage.getItem('appLang') || 'zh-Hant');
        });

        document.addEventListener('DOMContentLoaded', () => { 
            const chartDom = document.getElementById('scatterChart');
            myChart = echarts.init(chartDom);
            window.addEventListener('resize', () => myChart.resize());
            
            updateLocalLanguage(currentLang);
            initDashboard(); 
        });

        // ============================================================================
        // [3] BI 核心數據處理與動態重繪 (BI Core Logic & Redraw)
        // ============================================================================
        async function initDashboard() {
            try {
                const githubRawUrl = 'https://msbecky5354.github.io/JSON/data/bi_illusion.json';
                const response = await fetch(githubRawUrl + '?v=' + new Date().getTime());
                if (!response.ok) throw new Error('Data fetch failed');
                
                window.globalLastUpdatedTime = new Date();
                if (typeof renderHeaderLang === 'function') renderHeaderLang();

                globalRawData = await response.json(); 
                processData(globalRawData); 
                updateView(); 
            } catch (error) {
                console.error("Dashboard Failed:", error);
                document.getElementById('scatterChart').innerHTML = `<div class="flex items-center justify-center h-full text-corporateAlert font-bold">Data Connection Failed. Please try again.</div>`;
            }
        }

        // 🎯 核心修復：加入與 price_illusion.html 相同的全域分類字典翻譯引擎
        function getCatName(rawCat, lang) {
            if (!rawCat) return lang === 'en' ? 'Others' : '其他';
            
            // 情況 A：處理如果 API 傳回的是多語系 Object 的情況 (防禦性編程)
            if (typeof rawCat === 'object') {
                if (lang === 'en' && rawCat['en']) return rawCat['en'];
                if (lang === 'zh-Hans' && rawCat['zh-Hans']) return rawCat['zh-Hans'];
                return rawCat['zh-Hant'] || Object.values(rawCat)[0] || '其他';
            }
            
            // 情況 B：處理 API 傳回純繁體字串的情況 (透過 lang.js 內的 categoryDict 進行物理映射)
            let c = String(rawCat).trim();
            if (window.categoryDict && window.categoryDict[lang] && window.categoryDict[lang][c]) {
                return window.categoryDict[lang][c];
            }
            return c; 
        }

        function processData(rawData) {
            if (!Array.isArray(rawData)) return;
            globalCleanedData = rawData.map(item => {
                const prev = parseFloat(item.prevBasePrice);
                const curr = parseFloat(item.originalPrice);
                const isIncreased = (!isNaN(prev) && !isNaN(curr) && prev > 0 && curr > prev);
                const increasePct = isIncreased ? ((curr - prev) / prev) * 100 : 0;

                // 🚀 升級版多語系解析器：全面套用 getCatName 進行物理映射，徹底消滅殘留繁體
                let c1 = getCatName(item.categoryRaw || item.cat1, currentLang);
                let c2 = getCatName(item.cat2, currentLang);
                let c3 = getCatName(item.cat3, currentLang);
                
                // 動態處理 "其他" 的副分類命名
                const otherStr = currentLang === 'en' ? 'Others' : (currentLang === 'zh-Hans' ? '其他' : '其他');
                if (c2 === '其他' || c2 === 'Others' || c2 === otherStr) c2 = `${c1} (Sub)`;
                if (c3 === '其他' || c3 === 'Others' || c3 === otherStr) c3 = c2;

                return { cat1: c1, cat2: c2, cat3: c3, isIncreased: isIncreased, increasePct: increasePct };
            });
        }

        function updateView() {
            renderBreadcrumb();
            const aggregatedData = aggregateDataForCurrentLevel();
            renderECharts(aggregatedData);
            renderDataTable(aggregatedData); 
        }

        function renderBreadcrumb() {
            const dict = localI18nDict[currentLang] || localI18nDict['zh-Hant'];
            const bc = document.getElementById('breadcrumb');
            let html = `<span class="cursor-pointer hover:text-blue-500 transition underline decoration-dashed underline-offset-4" onclick="jumpToLevel(1)">${dict.bcLevel1}</span>`;
            if (currentLevel >= 2) {
                html += ` <span class="mx-2 text-slate-400">❯</span> <span class="cursor-pointer hover:text-blue-500 transition underline decoration-dashed underline-offset-4" onclick="jumpToLevel(2)">${dict.bcLevel2}${selectedCat1}</span>`;
            }
            if (currentLevel === 3) {
                html += ` <span class="mx-2 text-slate-400">❯</span> <span class="text-slate-800 dark:text-slate-100 font-bold">${dict.bcLevel3}${selectedCat2}</span>`;
            }
            bc.innerHTML = html;
        }

        window.jumpToLevel = function(level) {
            currentLevel = level;
            if (level === 1) { selectedCat1 = ''; selectedCat2 = ''; }
            if (level === 2) { selectedCat2 = ''; }
            updateView();
        }

        function aggregateDataForCurrentLevel() {
            const stats = {};
            globalCleanedData.forEach(item => {
                if (currentLevel === 2 && item.cat1 !== selectedCat1) return;
                if (currentLevel === 3 && item.cat2 !== selectedCat2) return;

                let targetCat = currentLevel === 1 ? item.cat1 : (currentLevel === 2 ? item.cat2 : item.cat3);
                if (!stats[targetCat]) stats[targetCat] = { name: targetCat, total: 0, inc: 0, sumPct: 0 };
                
                stats[targetCat].total += 1;
                if (item.isIncreased) { stats[targetCat].inc += 1; stats[targetCat].sumPct += item.increasePct; }
            });

            const result = [];
            for (const key in stats) {
                const s = stats[key];
                if (s.total >= MIN_ITEMS_THRESHOLD && s.inc > 0) {
                    result.push({ name: s.name, value: [((s.inc / s.total) * 100).toFixed(1), (s.sumPct / s.inc).toFixed(2), s.total, s.inc] });
                }
            }
            return result;
        }

        function renderECharts(scatterData) {
            const dict = localI18nDict[currentLang] || localI18nDict['zh-Hant'];
            const isDark = document.documentElement.classList.contains('dark');
            const axisTextColor = isDark ? '#94A3B8' : '#64748B'; 
            const splitLineColor = isDark ? '#334155' : '#E2E8F0'; 
            
            let maxX = -Infinity, minX = Infinity, maxY = -Infinity, minY = Infinity;
            scatterData.forEach(d => {
                const x = parseFloat(d.value[0]), y = parseFloat(d.value[1]);
                if (x > maxX) maxX = x; if (x < minX) minX = x;
                if (y > maxY) maxY = y; if (y < minY) minY = y;
            });

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: isDark ? 'rgba(30, 41, 59, 0.95)' : 'rgba(255, 255, 255, 0.95)',
                    borderColor: isDark ? '#475569' : '#CBD5E1',
                    textStyle: { color: isDark ? '#F1F5F9' : '#334155' },
                    formatter: function (p) {
                        const d = p.data;
                        const drillDownHint = currentLevel < 3 ? `<br/><span class="text-blue-500 font-bold text-[11px] mt-2 inline-block">👆 ${dict.chartClickHint}</span>` : '';
                        return `<div class="font-sans p-1">
                                  <strong class="text-[15px] text-[#0072B2]">${d.name}</strong><br/><br/>
                                  ${dict.chartXAxis.replace(' (%)','')} : <span class="font-black">${d.value[0]}%</span><br/>
                                  ${dict.chartYAxis.replace(' (%)','')} : <span class="text-[#D55E00] font-black">+${d.value[1]}%</span><br/>
                                  <hr class="my-2 border-slate-300 dark:border-slate-600"/>
                                  <span class="text-[11px] text-slate-500 dark:text-slate-400">${dict.chartBase}: ${d.value[2]} ${dict.chartItems}, ${d.value[3]} ${dict.chartImpacted}.</span>
                                  ${drillDownHint}
                                </div>`;
                    }
                },
                xAxis: { 
                    type: 'value', name: dict.chartXAxis, nameLocation: 'middle', nameGap: 30, min: 0, max: 100, 
                    nameTextStyle: { color: axisTextColor, fontWeight: 'bold' },
                    splitLine: { lineStyle: { color: splitLineColor, type:'dashed' } },
                    axisLabel: { formatter: '{value}%', color: axisTextColor }
                },
                yAxis: { 
                    type: 'value', name: dict.chartYAxis, 
                    nameTextStyle: { color: axisTextColor, fontWeight: 'bold' },
                    splitLine: { lineStyle: { color: splitLineColor, type:'dashed' } }, 
                    axisLabel: { formatter: '{value}%', color: axisTextColor } 
                },
                series: [{
                    type: 'scatter',
                    symbolSize: data => Math.min(Math.max(data[2] * (currentLevel === 1 ? 0.3 : 1), 20), 100), 
                    itemStyle: { 
                        color: p => (parseFloat(p.data.value[0]) > 30 && parseFloat(p.data.value[1]) > 5) ? '#D55E00' : '#0072B2',
                        opacity: 0.85, borderColor: isDark ? '#0F172A' : '#FFFFFF', borderWidth: 1.5
                    },
                    label: { 
                        show: true, position: 'top', color: axisTextColor, fontSize: 11, hideOverlap: true,
                        formatter: p => {
                            const x = parseFloat(p.data.value[0]), y = parseFloat(p.data.value[1]);
                            return (x === maxX || x === minX || y === maxY || y === minY) ? p.name : ''; 
                        }
                    },
                    emphasis: {
                        focus: 'series',
                        label: { show: true, formatter: '{b}', color: isDark ? '#FFFFFF' : '#0F172A', backgroundColor: isDark ? 'rgba(15,23,42,0.8)' : 'rgba(241,245,249,0.9)', padding: [4, 8], borderRadius: 4 }
                    },
                    data: scatterData
                }]
            };

            myChart.setOption(option, true); 
            myChart.off('click');
            myChart.on('click', function (params) {
                if (currentLevel === 1) { selectedCat1 = params.data.name; currentLevel = 2; updateView(); } 
                else if (currentLevel === 2) { selectedCat2 = params.data.name; currentLevel = 3; updateView(); }
            });
        }

        function renderDataTable(data) {
            const dict = localI18nDict[currentLang] || localI18nDict['zh-Hant'];
            const tbody = document.getElementById('dataTableBody');
            const sortedData = [...data].sort((a, b) => parseFloat(b.value[0]) !== parseFloat(a.value[0]) ? parseFloat(b.value[0]) - parseFloat(a.value[0]) : parseFloat(b.value[1]) - parseFloat(a.value[1]));

            let rowsHtml = '';
            sortedData.forEach(d => {
                const isAlert = parseFloat(d.value[0]) > 30 && parseFloat(d.value[1]) > 5;
                const rowStyleClass = isAlert ? 'bg-[#D55E00]/5 hover:bg-[#D55E00]/10 text-slate-800 dark:text-slate-100' : 'hover:bg-slate-100 dark:hover:bg-slate-700/50';
                const alertTextClass = isAlert ? 'text-[#D55E00] font-bold' : '';

                rowsHtml += `
                    <tr class="transition-colors ${rowStyleClass}">
                        <td class="px-5 py-3 font-bold whitespace-nowrap">${d.name}</td>
                        <td class="px-5 py-3 text-right">${d.value[2]}</td>
                        <td class="px-5 py-3 text-right">${d.value[3]}</td>
                        <td class="px-5 py-3 text-right ${alertTextClass}">${parseFloat(d.value[0]).toFixed(1)}%</td>
                        <td class="px-5 py-3 text-right ${alertTextClass}">+${parseFloat(d.value[1]).toFixed(2)}%</td>
                    </tr>
                `;
            });
            tbody.innerHTML = rowsHtml || `<tr><td colspan="5" class="px-5 py-8 text-center text-slate-500">${dict.noDataText}</td></tr>`;
        }
    </script>
</body>
</html>
