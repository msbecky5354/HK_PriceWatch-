                const res = await fetch(logUrl, { cache: 'no-store' });

                    let text = await res.text();
                    lastUpdatedTime = new Date(text.trim());
                } else {
                    lastUpdatedTime = new Date();

                sec1Content: `
                    <li><strong>Conversational Search:</strong> Type any "brand" or "product name" on the homepage for instant pricing and promotional details.</li>
                    <li><strong>One-Click Deals:</strong> Use the "Latest Deals" or "Deals" quick button to filter and show only discounted items.</li>
                    <li><strong>🔥 Extreme Price Gaps:</strong> Click <b class="text-red-500 dark:text-red-400">"Big Gap"</b> to find items with over 10% price differences between supermarkets.</li>
                    <li><strong>Unit Price Calculation:</strong> System automatically calculates "buy 2" or "half-price" deals for you, highlighted with an <b class="text-[#FFB74D]">orange "Avg" badge</b>.</li>
                    <li><strong>Quick Navigation:</strong> Want to go home? Just type <b>"Back to menu"</b> or <b>"Home"</b> in the chat box to navigate back instantly.</li>
                `,
                secDashTitle: "📊 Five Real-time Dashboards",
                secDashContent: `
                    <li><strong>👑 Lowest Price Tracker:</strong> Tracks winner-take-all products with the absolute lowest prices, categorizing their strategic pricing dimensions.</li>
                    <li><strong>SmartDeal Board:</strong> Strictly compares historical prices to identify genuine "True Price Drops" and filter out fake promotions.</li>
                    <li><strong>Discount Analytics Dashboard:</strong> Cross-sectional comparison of today's prices to find the absolute lowest prices after a multi-tier elimination.</li>
                    <li><strong>Price Analytics Report:</strong> God's-eye view! Uses Treemaps and Heatmaps to instantly visualize price drop distributions.</li>
                    <li><strong>Price Stability Monitor:</strong> Specifically tracks "price moat" products that maintain stable prices despite market fluctuations.</li>
                `,
                sec2Title: "📸 AI Visual Search",
                sec2Desc: `Snap a photo of the product, and our AI will identify it and fill in the search box for you. Input your Gemini API Key for higher accuracy!<br><br><span class="inline-block mt-2 px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-600 dark:text-slate-400">🛡️ <b>Security Protocol:</b> All API Keys are exclusively encrypted and stored in your local browser's <code>LocalStorage</code>, completely isolated from any external servers.</span>`,
                sec2Note: "Note: Without an API Key, the system defaults to a lightweight offline recognition mode.",
                sec3Title: "🔔 Price Alert & Share Features",
                sec3Desc: `Waiting for a sale? Tap the ${iconBell} on the top right of any product card, set your target price, and track it. When the price drops below your target, the bell in the top navigation bar will glow red!<br><br>Additionally, tap the ${iconShare} next to it to easily share intel.<br><br><span class="inline-block mt-2 px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-600 dark:text-slate-400">🔗 <b>Sharing Engine:</b> System prioritizes the Native Web Share API. If unsupported, it gracefully degrades to a clipboard copy and WhatsApp quick link.</span>`,
                sec4Title: "🛡️ Disclaimer & Privacy Policy",
                sec4Content: `
                    <p><strong>1. Privacy:</strong> This App has no user accounts. All "Price Alerts" and "Search History" are <b>stored locally in your device's browser only</b>. We do not track, monitor, or sell your personal data.</p>
                    <p><strong>2. Data Source & Historical Snapshot:</strong> Price data is sourced from the "Price Watch" dataset by Data.gov.hk. All extreme price gaps and rankings are calculated objectively via our "Historical Data Snapshot" algorithm. They serve purely as market trend references and do not constitute any subjective evaluations.</p>
                    <p><strong>3. Disclaimer:</strong> This is a free open-source tool. Actual prices, terms, and inventory may vary; please verify with store tags or official announcements. The development team is not liable for any transaction losses caused by data latency, omissions, or extreme market price fluctuations.</p>
                `,
                sec5Title: "📱 Add to Home Screen",
                sec5Content: `<strong>Android:</strong> Open in Chrome ➔ Tap "⋮" ➔ Select "Add to Home Screen".<br><strong class="mt-1 inline-block">iOS:</strong> Open in Safari ➔ Tap the "Share" icon at the bottom ➔ Select "Add to Home Screen".`
            }
        };

        function updateLocalLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('appLang', lang);
            document.documentElement.lang = lang === 'en' ? 'en' : (lang === 'zh-Hans' ? 'zh-Hans' : 'zh-HK');
            
            const setElTxt = (id, text) => { const el = document.getElementById(id); if (el && text) el.innerText = text; };
            const setElHtml = (id, html) => { const el = document.getElementById(id); if (el && html) el.innerHTML = html; };

            const uiDict = (typeof uiText !== 'undefined' && uiText[lang]) ? uiText[lang] : (typeof uiText !== 'undefined' ? uiText['zh-Hant'] : null);
            if (uiDict) {
                setElTxt('appTitle', uiDict.title || '慳真D');
                
                const statusLabel = document.getElementById('todayStatusLabel');
                if (statusLabel) {
                    if (lastUpdatedTime && !isNaN(lastUpdatedTime.getTime())) {
                        const prefix = (uiDict.lastUpdated || (lang === 'en' ? 'Updated: ' : '更新於: '));
                        statusLabel.innerText = prefix + formatDateTime(lastUpdatedTime);
                    } else {
                        statusLabel.innerText = uiDict.subLabel || (lang === 'en' ? 'Loading...' : '載入中...');
                    }
                }
                
                setElTxt('miniFooterLinks', uiDict.miniFooterLinks || '關於我們、條款及免責聲明');
                setElTxt('miniFooterCopy', uiDict.miniFooterCopy || '© 2026 慳真D');
                setElTxt('disclaimerTitle', uiDict.disclaimerTitle || '免責聲明及服務條款');
                setElHtml('disclaimerBody', uiDict.disclaimerText || '請參閱首頁免責聲明內容。');
                setElTxt('modalCloseBtn', uiDict.modalBtn || '我明白及接受');
            }

            const dict = manualDict[lang] || manualDict['zh-Hant'];
            document.title = dict.docTitle;
            setElHtml('txt-pageTitle', dict.pageTitle);
            setElHtml('txt-backBtn', dict.backBtn);
            setElHtml('txt-intro', dict.intro);
            setElHtml('txt-sec1Title', dict.sec1Title);
            setElHtml('txt-sec1Content', dict.sec1Content);
            
            setElHtml('txt-secDashTitle', dict.secDashTitle);
            setElHtml('txt-secDashContent', dict.secDashContent);
            
            setElHtml('txt-sec2Title', dict.sec2Title);
            setElHtml('txt-sec2Desc', dict.sec2Desc);
            setElHtml('txt-sec2Note', dict.sec2Note);
            setElHtml('txt-sec3Title', dict.sec3Title);
            setElHtml('txt-sec3Desc', dict.sec3Desc);
            setElHtml('txt-sec4Title', dict.sec4Title);
            setElHtml('txt-sec4Content', dict.sec4Content);
            setElHtml('txt-sec5Title', dict.sec5Title);
            setElHtml('txt-sec5Content', dict.sec5Content);

            const devTeam = document.getElementById('footerDevTeam');
            if (devTeam) devTeam.innerText = lang === 'en' ? 'Developed by: ' : (lang === 'zh-Hans' ? '开发团队: ' : '開發團隊: ');

            const devName = document.getElementById('footerDevName');
            if (devName) devName.innerText = lang === 'en' ? 'Lazy Tools Station' : (lang === 'zh-Hans' ? '懒人工具站' : '懶人工具駅');

            let langSel = document.getElementById('langSelector');
            if (langSel) langSel.value = lang;
            
            if (typeof updateAlertBadge === 'function') updateAlertBadge();
        }

        window.addEventListener('languageChanged', (e) => { updateLocalLanguage(e.detail.lang); });
        window.changeLanguage = function(lang) { 
            if (typeof globalChangeLang === 'function') globalChangeLang(lang); 
            if (typeof updateLocalLanguage === 'function') updateLocalLanguage(lang); 
        };

        document.addEventListener('DOMContentLoaded', () => {
            updateLocalLanguage(currentLang);
            fetchUpdateLog();
        });
    </script>
</body>
</html>
