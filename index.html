        // =====================================================================
        // 🔎 5. 搜尋與指令處理
        // =====================================================================
        window.normalizeStr = window.normalizeStr || function(str) { return str ? str.toLowerCase().replace(/[^\w\s\u4e00-\u9fa5]/gi, '') : ''; };

        window.cleanUserInput = window.cleanUserInput || function(str) {
            if (!str) return '';
            return str.replace(/[<>"'&]/g, "").trim(); 
        };

        window.triggerHomeQuickAction = function(mode, label, kw = '') {
            const chatSec = document.getElementById('chatSection');
            const lvl1Sec = document.getElementById('level1Section');
            const chatTitle = document.getElementById('chatTitle');
            const chatMessages = document.getElementById('chatMessages');

            if (chatSec) chatSec.classList.remove('hidden'); 
            if (lvl1Sec) lvl1Sec.classList.add('hidden');
            
            let titleStr = window.currentLang === 'en' ? 'Global Search' : '全局搜尋';
            if (chatTitle) chatTitle.innerHTML = `<span class="mr-1.5 text-[#345B8C]"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span> ${titleStr}`;
            if (chatMessages) chatMessages.innerHTML = '';
            
            window.isBigGapMode = (mode === 'bigGap');
            window.isDiscountMode = (mode === 'discount');
            
            if (mode === 'category') {
                window.selectedCat1 = kw; 
                window.currentKeyword = '';
            } else {
                window.selectedCat1 = 'GLOBAL'; 
                window.currentKeyword = kw;
            }
            
            window.addUserMessage(label);
            window.addBotMessage(window.currentLang === 'en' ? `Activating mode: ${label}...` : `啟動「${label}」模式，正在為您查找...`);
            setTimeout(() => { window.executeProductSearch(); }, 300);
        };

        window.toggleCategories = function() {
            const container = document.getElementById('collapsibleCatContainer');
            const icon = document.getElementById('catToggleIcon');
            if (container && icon) {
                container.classList.toggle('hidden');
                icon.style.transform = container.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
            }
        };

        window.triggerGlobalSearch = function() {
            const inputEl = document.getElementById('globalSearchInput');
            const chatSec = document.getElementById('chatSection');
            const lvl1Sec = document.getElementById('level1Section');
            const chatTitle = document.getElementById('chatTitle');
            const chatMessages = document.getElementById('chatMessages');

            const originalQ = inputEl ? inputEl.value.trim() : '';
            if (!originalQ) return;
            if(inputEl) { inputEl.value = ''; inputEl.blur(); }
            
            if(chatSec) chatSec.classList.remove('hidden'); 
            if(lvl1Sec) lvl1Sec.classList.add('hidden');
            if(chatTitle) chatTitle.innerHTML = window.currentLang === 'en' ? 'Global Search' : (window.currentLang === 'zh-Hans' ? '全局搜寻' : '全局搜尋'); 
            if(chatMessages) chatMessages.innerHTML = '';
            window.isBigGapMode = false; window.isDiscountMode = false;
            
            window.addUserMessage(originalQ);
            
            setTimeout(() => {
                const talk = (typeof window.checkSmallTalk === 'function') ? window.checkSmallTalk(originalQ) : null;
                if (talk) { 
                    window.currentKeyword = ""; 
                    window.selectedCat1 = 'GLOBAL';
                    window.addBotMessage(talk); 
                    return; 
                } 
                
                window.selectedCat1 = 'GLOBAL'; 
                const cleanQ = cleanUserInput(originalQ);
                window.currentKeyword = window.normalizeStr(cleanQ).trim();
                if (typeof window.executeProductSearch === 'function') window.executeProductSearch(false); 
            }, 300);
        };

        window.submitChat = function() {
            const chatInput = document.getElementById('chatInput');
            const originalQ = chatInput ? chatInput.value.trim() : '';
            if (!originalQ) return;

            const cleanText = cleanUserInput(originalQ);
            if (['主目錄', '主頁', '首頁', '返回', 'home', 'back'].some(kw => cleanText.includes(kw))) {
                if(chatInput) chatInput.value = ''; 
                window.showLevel1(); return;
            }

            window.addUserMessage(originalQ); 
            if(chatInput) { chatInput.value = ''; chatInput.blur(); }
            
           setTimeout(() => {
                const talk = (typeof window.checkSmallTalk === 'function') ? window.checkSmallTalk(originalQ) : null;
                if (talk) { 
                    window.currentKeyword = "";      
                    window.selectedCat1 = 'GLOBAL';  
                    window.addBotMessage(talk); 
                    
                    const chips = document.getElementById('quickActionChips');
                    if (chips) chips.innerHTML = '';
                    
                    return; 
                } 

                window.isBigGapMode = false; window.isDiscountMode = false;
                window.currentKeyword = window.normalizeStr(cleanText).trim();
                if (typeof window.executeProductSearch === 'function') window.executeProductSearch(); 
            }, 300);
        };

        window.executeProductSearch = function(suppressEmpty = false) {
            if (typeof window.renderQuickActions === 'function') window.renderQuickActions();
            if (typeof window.getFilteredProductsHTML !== 'function') return;
            
            window.isCodesIssue = false; 
            const searchResults = window.getFilteredProductsHTML(window.currentKeyword);

            if (window.isCodesIssue) {
                window.addBotMessage("Codes issue. Please call support. 🛠️");
                return;
            }

            if (searchResults && searchResults.exactCount > 0) {
                let botTip = "";
                let catName = (window.selectedCat1 && window.selectedCat1 !== 'GLOBAL') ? window.selectedCat1 : '所有目錄';
                
                if (window.isBigGapMode) {
                    botTip = window.currentLang === 'en' ? `Items with extreme gaps in "${catName}":` : (window.currentLang === 'zh-Hans' ? `「${catName}」下差价超过 10% 的货品：` : `「${catName}」下差價超過 10% 的貨品：`);
                } else if (window.isDiscountMode) {
                    botTip = window.currentLang === 'en' ? `Discounted items in "${catName}":` : (window.currentLang === 'zh-Hans' ? `「${catName}」下的优惠货品：` : `「${catName}」下的優惠貨品：`);
                } else if (!window.currentKeyword) {
                    botTip = window.currentLang === 'en' ? `Displaying items in "${catName}":` : (window.currentLang === 'zh-Hans' ? `正在展示「${catName}」下的所有货品：` : `正在展示「${catName}」下的所有貨品：`);
                } else {
                    botTip = window.currentLang === 'en' ? `Found results for "${window.currentKeyword}":` : (window.currentLang === 'zh-Hans' ? `为您找到「${window.currentKeyword}」的匹配结果：` : `為您找到「${window.currentKeyword}」的匹配結果：`);
                }

                let finalHtml = searchResults.exactHtml;
                if (!window.isBigGapMode) {
                    let sortText = window.currentLang === 'en' ? 'Sort by Gap' : (window.currentLang === 'zh-Hans' ? '按差价排序' : '按差价排序');
                    finalHtml = `<div class="flex justify-end w-full mb-3"><button onclick="window.handleQuickAction('filterBigGap', '${sortText}')" class="flex items-center gap-1.5 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg text-[12px] font-medium hover:bg-[#F8F8F8] dark:hover:bg-slate-700 active:scale-95 transition-transform shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#345B8C] dark:text-[#608BC1]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>${sortText}</button></div>` + finalHtml;
                }
                window.addBotMessage(botTip, finalHtml);

            } else if (searchResults && searchResults.fuzzyCount > 0) {
                let fuzzyMsg = window.currentLang === 'en' ? 'Displaying most relevant data:' : (window.currentLang === 'zh-Hans' ? '为您展示最相关的数据：' : '為您展示最相關的數據：');
                window.addBotMessage(fuzzyMsg, searchResults.fuzzyHtml);

            } else {
                if (!suppressEmpty) {
                    let noResMsg = window.currentLang === 'en' ? 'Cannot search such product.' : (window.currentLang === 'zh-Hans' ? '查无相关纪录，请尝试其他关键字。' : '查無相關紀錄，請嘗試其他關鍵字。');
                    window.addBotMessage(noResMsg);
                }
            }
        };

        // =====================================================================
        // 🚀 快捷指令按鈕 (Quick Action Chips) 渲染與點擊處理
        // =====================================================================
        window.renderQuickActions = function() {
            const container = document.getElementById('quickActionChips');
            if (!container) return;

            const dict = {
                'zh-Hant': { all: '睇晒全部', discount: '淨係睇有優惠', gap: '極端差價', home: '返主目錄' },
                'zh-Hans': { all: '查看全部', discount: '只看有优惠', gap: '极端差价', home: '回主目录' },
                'en': { all: 'Show All', discount: 'Discount Only', gap: 'Extreme Gap', home: 'Home' }
            };
            const text = dict[window.currentLang] || dict['zh-Hant'];

            container.innerHTML = `
                <button onclick="window.handleQuickAction('all', '${text.all}')" class="shrink-0 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-[13px] font-bold rounded-xl active:scale-95 transition shadow-sm">${text.all}</button>
                <button onclick="window.handleQuickAction('discount', '${text.discount}')" class="shrink-0 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-[13px] font-bold rounded-xl active:scale-95 transition shadow-sm">${text.discount}</button>
                <button onclick="window.handleQuickAction('gap', '${text.gap}')" class="shrink-0 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-[13px] font-bold rounded-xl active:scale-95 transition shadow-sm">${text.gap}</button>
                <button onclick="window.showLevel1()" class="shrink-0 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-[13px] font-bold rounded-xl active:scale-95 transition shadow-sm">${text.home}</button>
            `;
        };

        window.handleQuickAction = function(action, label) {
            window.addUserMessage(label);
            setTimeout(() => {
                if (action === 'viewAll' || action === 'all') {
                    window.isBigGapMode = false;
                    window.isDiscountMode = false;
                } else if (action === 'filterDiscount' || action === 'discount') {
                    window.isBigGapMode = false;
                    window.isDiscountMode = true;
                } else if (action === 'filterBigGap' || action === 'gap') {
                    window.isBigGapMode = true;
                    window.isDiscountMode = false;
                } else if (action === 'backHome' || action === 'home') {
                    window.showLevel1();
                    return;
                }

                if ((window.selectedCat1 === 'GLOBAL' || !window.selectedCat1) && !window.currentKeyword) {
                    let alertMsg = window.currentLang === 'en' ? 'Please enter a product keyword first.' : (window.currentLang === 'zh-Hans' ? '请先输入要搜寻的货品关键字。' : '請先輸入要搜尋的貨品關鍵字。');
                    window.addBotMessage(alertMsg);
                    return; 
                }

                window.executeProductSearch();
            }, 300);
        };

       // =====================================================================
        // 🎨 企業級分類圖標註冊表 (支援三語動態攔截與明暗主題變色)
        // =====================================================================
        window.getCatStyle = function(catName) {
            const name = (catName || '').toLowerCase();
            const svgClass = "w-7 h-7 text-[#345B8C] dark:text-[#608BC1] mb-1.5 transition-colors drop-shadow-sm";
            let svgIcon = '';

            // 1. 飲品類
            if (name.includes('drink') || name.includes('beverage') || name.includes('飲') || name.includes('饮')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><path d="M15.2 22H8.8a2 2 0 0 1-2-1.79L5 3h14l-1.81 17.21A2 2 0 0 1 15.2 22Z"/><path d="M6 12h12"/></svg>`;
            }
            // 2. 糧食雜貨
            else if (name.includes('rice') || name.includes('meat') || name.includes('米') || name.includes('肉') || name.includes('罐')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><path d="m5 11 4-7"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8c.9 0 1.8-.7 2-1.6l1.7-7.4"/></svg>`;
            }
            // 3. 零食餅乾
            else if (name.includes('snack') || name.includes('cand') || name.includes('零') || name.includes('糖') || name.includes('餅')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><rect width="16" height="16" x="4" y="4" rx="2" ry="2"/><rect width="6" height="6" x="9" y="9" rx="1" ry="1"/></svg>`;
            }
            // 4. 家居寵物
            else if (name.includes('house') || name.includes('pet') || name.includes('家居') || name.includes('寵') || name.includes('宠')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`;
            }
            // 5. 麵食烹調 (🚀 修正：收緊匹配，避免誤判麵包)
            else if (name.includes('noodle') || name.includes('cook') || name.includes('粉麵') || name.includes('粉面') || name.includes('煮') || name.includes('烹')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`;
            }
            // 6. 乳製品蛋類
            else if (name.includes('dairy') || name.includes('egg') || name.includes('乳') || name.includes('蛋')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>`;
            }
            // 7. 烘焙麥片 (🚀 修正：加入麵包、蛋糕、穀類精確匹配)
            else if (name.includes('baker') || name.includes('cereal') || name.includes('烘') || name.includes('麥') || name.includes('麦') || name.includes('麵包') || name.includes('面包') || name.includes('蛋糕') || name.includes('穀')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><path d="M2 22 22 2"/><path d="M16 2a4 4 0 0 0-4 4 4 4 0 0 0 4 4 4 4 0 0 0 4-4 4 4 0 0 0-4-4z"/><path d="M8 8a4 4 0 0 0-4 4 4 4 0 0 0 4 4 4 4 0 0 0 4-4 4 4 0 0 0-4-4z"/><path d="M16 10a4 4 0 0 0-4 4 4 4 0 0 0 4 4 4 4 0 0 0 4-4 4 4 0 0 0-4-4z"/><path d="M8 16a4 4 0 0 0-4 4 4 4 0 0 0 4 4 4 4 0 0 0 4-4 4 4 0 0 0-4-4z"/></svg>`;
            }
            // 8. 酒類
            else if (name.includes('beer') || name.includes('wine') || name.includes('酒')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><path d="M8 22h8"/><path d="M7 10h10"/><path d="M12 15v7"/><path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z"/></svg>`;
            }
            // 9. 個人護理
            else if (name.includes('personal') || name.includes('care') || name.includes('個人') || name.includes('护') || name.includes('護')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6-8 10-8 10z"/><path d="M12 8v4"/><path d="M10 10h4"/></svg>`;
            }
            // 10. 嬰兒用品
            else if (name.includes('baby') || name.includes('milk') || name.includes('嬰') || name.includes('婴') || name.includes('奶')) {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`;
            }
            // 預設
            else {
                svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${svgClass}"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>`;
            }

            return { icon: svgIcon };
        };

        window.renderLevel1 = function() {
            const level1Container = document.getElementById('level1Container');
            if(!level1Container) return;
            level1Container.innerHTML = '';
            
            if (!window.structuredData) return;
            
            Object.keys(window.structuredData).forEach(cat1 => {
                const style = (typeof window.getCatStyle === 'function') ? window.getCatStyle(cat1) : { icon: '' };
                const card = document.createElement('div');
                card.className = `clickable-card bg-white border p-3 rounded-2xl shadow-sm text-center h-[90px] flex flex-col items-center justify-center cursor-pointer dark:bg-slate-800 dark:border-slate-700 hover:bg-slate-50 transition-colors`;
                card.innerHTML = `<div>${style.icon}</div><span class="font-bold text-[12px] mt-1 text-slate-700 dark:text-slate-300">${cat1}</span>`;
                card.onclick = () => { 
                    window.selectedCat1 = cat1; 
                    const chatSec = document.getElementById('chatSection');
                    const lvl1Sec = document.getElementById('level1Section');
                    if(chatSec) chatSec.classList.remove('hidden'); 
                    if(lvl1Sec) lvl1Sec.classList.add('hidden'); 
                    window.executeProductSearch(); 
                };
                level1Container.appendChild(card);
            });
        };

        window.addBotMessage = function(text, cardsHTML = null) {
            const chatMessages = document.getElementById('chatMessages');
            if(!chatMessages) return;
            const wrapper = document.createElement('div'); wrapper.className = 'flex flex-col items-start w-full';
            wrapper.innerHTML = `<div class="flex items-end gap-2 max-w-[90%]"><div class="bg-[#F8F8F8] dark:bg-slate-800 border dark:border-slate-700 text-slate-700 dark:text-slate-200 px-4 py-3.5 rounded-2xl rounded-bl-sm text-[14px]">${text}</div></div>${cardsHTML ? `<div class="w-full mt-4 space-y-4">${cardsHTML}</div>` : ''}`;
            chatMessages.appendChild(wrapper);
            setTimeout(() => wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
        };

        window.addUserMessage = function(text) {
            const chatMessages = document.getElementById('chatMessages');
            if(!chatMessages) return;
            const wrapper = document.createElement('div'); wrapper.className = 'flex flex-col items-end w-full';
            wrapper.innerHTML = `<div class="bg-[#345B8C] text-white px-4 py-3.5 rounded-2xl rounded-br-sm text-[14px] font-medium">${text}</div>`;
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
        };

        // =====================================================================
        // 🚀 6. 系統初始化與安全解包
        // =====================================================================
        window.unwrapData = function(d) {
            if (!d) return [];
            let rawData = Array.isArray(d) ? d : (d.results || d.data || [d]);
            if (rawData.length > 0) {
                if (rawData[0]?.json?.snapshot_data) return rawData[0].json.snapshot_data;
                if (rawData[0]?.snapshot_data) return rawData[0].snapshot_data;
            }
            return rawData;
        };

        window.init = async function() {
            try {
                window.updateLoadingStatus('check');
                const cb = Date.now();
                
                const logUrl = `https://msbecky5354.github.io/JSON/data/update_log.txt?v=${cb}`;
                const snapshotUrl = `https://msbecky5354.github.io/JSON/data/snapshot_${window.currentLang}.json?v=${cb}`;

                try {
                    const timeRes = await fetch(logUrl);
                    if (timeRes.ok) {
                        window.lastUpdatedTime = new Date((await timeRes.text()).trim());
                        
                        // 🌟 新增：將時間交畀全域，並叫 Header 自己做嘢！
                        window.globalLastUpdatedTime = window.lastUpdatedTime;
                        if (typeof window.renderHeaderLang === 'function') window.renderHeaderLang();
                    }
                } catch(e) { console.warn("時間紀錄載入失敗", e); }

                window.updateLoadingStatus('down');
                // ... (下方的 fetch snapshotUrl 保持不變) ...
                
                const snapRes = await fetch(snapshotUrl).catch(() => null);

                if (snapRes?.ok) {
                    window.snapshotData = window.unwrapData(await snapRes.json());
                }

            } catch (e) {
                console.error("系統初始化嚴重錯誤:", e);
                window.updateLoadingStatus('err');
            } finally {
                try {
                    if (typeof window.buildStructuredData === 'function') window.buildStructuredData();
                    if (typeof window.changeLanguage === 'function') window.changeLanguage(window.currentLang);
                    if (typeof window.updateAlertBadge === 'function') window.updateAlertBadge();
                    if (typeof window.renderLevel1 === 'function') window.renderLevel1();

                    if (!window.snapshotData || window.snapshotData.length === 0) {
                        const loadingEl = document.getElementById('loadingText');
                        if (loadingEl && loadingEl.parentElement) {
                            loadingEl.parentElement.innerHTML = `<div class="col-span-2 flex flex-col items-center justify-center p-6 text-center"><p class="text-slate-600 dark:text-slate-300 font-bold mb-4">未偵測到快照數據，請點擊重試。</p><button onclick="window.location.reload()" class="bg-[#345B8C] text-white px-6 py-2.5 rounded-xl font-bold active:scale-95 shadow-sm">重新連線</button></div>`;
                        }
                    }

                    const urlParams = new URLSearchParams(window.location.search);
                    const sharedQuery = urlParams.get('q');
                    
                    if (sharedQuery) {
                        const input = document.getElementById('globalSearchInput');
                        if (input) {
                            input.value = sharedQuery;
                            
                            let checkAttempts = 0;
                            const checkInterval = setInterval(() => {
                                checkAttempts++;
                                if (window.snapshotData && window.snapshotData.length > 0 && typeof window.triggerGlobalSearch === 'function') {
                                    clearInterval(checkInterval);
                                    window.triggerGlobalSearch();
                                } else if (checkAttempts > 25) { 
                                    clearInterval(checkInterval);
                                }
                            }, 200); 
                        }
                    }

                } catch (uiErr) { console.error("渲染 UI 時發生錯誤:", uiErr); }
            }
        };

        window.init();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(console.error); });
        }
    </script>
</body>
</html>
