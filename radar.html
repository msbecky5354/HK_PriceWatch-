<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跨超市海鮮價雷達 | 慳真D🔎</title>
    <script src="lang.js?v=9"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class', }
    </script>
    <style> th { white-space: nowrap; } </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <!-- 🌟 100% 同步 index.html 嘅完美 Header -->
    <header class="bg-white border-b flex-none z-30 px-3 py-3 shadow-sm sticky top-0 dark:bg-slate-900 dark:border-slate-800 transition-colors duration-300">
        <div class="flex justify-between items-center w-full max-w-7xl mx-auto">
            
            <div onclick="window.location.href='index.html?lang=' + currentLang" class="flex items-center gap-2.5 cursor-pointer active:scale-[0.97] transition-transform shrink-0" title="返回主頁">
                <img src="logo.JPG" alt="Logo" class="w-10 h-10 object-cover rounded-xl border border-slate-100 shadow-sm dark:border-slate-700">
                <div class="flex flex-col justify-center gap-1">
                    <h1 id="appTitle" class="text-[16px] bg-gradient-to-r from-indigo-600 to-blue-700 bg-clip-text text-transparent font-black tracking-tight leading-none dark:from-indigo-400 dark:to-blue-400">慳真D</h1>
                    <span id="todayStatusLabel" class="text-[9px] text-slate-400 font-medium whitespace-nowrap leading-none">載入中...</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2.5 shrink-0">
                <div class="flex items-center gap-1">
                    <span class="hidden min-[390px]:block text-[10px] font-bold text-slate-400 leading-none">EN/中</span>
                    <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-slate-100 border-none text-[11px] font-bold text-slate-700 rounded-md px-1.5 py-1 outline-none cursor-pointer dark:bg-slate-800 dark:text-slate-200 transition-colors">
                        <option value="zh-Hant">繁體</option>
                        <option value="zh-Hans">简体</option>
                        <option value="en">Eng</option>
                    </select>
                </div>

                <div class="flex items-center gap-1.5">
                    <button onclick="toggleTheme()" id="themeBtn" class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-50 text-slate-600 border border-slate-200 shadow-sm active:scale-95 transition-all dark:bg-slate-800 dark:border-slate-700">☀️</button>
                    <!-- 提示：點擊鈴鐺/分享會跳返去主頁 -->
                    <button onclick="window.location.href='index.html?lang=' + currentLang" class="relative w-7 h-7 flex items-center justify-center rounded-full bg-rose-50 text-rose-600 border border-rose-100 shadow-sm active:scale-95 transition-all dark:bg-rose-900/30 dark:border-rose-800">🔔</button>
                    <button onclick="openManual()" class="w-7 h-7 flex items-center justify-center rounded-full bg-amber-50 text-amber-600 border border-amber-100 shadow-sm text-[12px] active:scale-95 transition-all dark:bg-amber-900/30 dark:border-amber-800">📖</button>
                    <button onclick="window.location.href='index.html?lang=' + currentLang" class="w-7 h-7 flex items-center justify-center rounded-full bg-blue-50 text-blue-600 border border-blue-100 shadow-sm active:scale-95 transition-all dark:bg-blue-900/30 dark:border-blue-800">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto md:mt-6 md:mb-8 md:rounded-2xl bg-white dark:bg-slate-800 shadow-sm border-b md:border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors duration-300">
        
        <!-- 頁面專屬標題 -->
        <div class="p-4 md:p-5 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white dark:bg-slate-800">
            <h1 class="text-[17px] md:text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                <span class="text-xl md:text-2xl">📡</span> 
                <span id="pageTitleText">跨超市海鮮價雷達</span>
            </h1>
            <button id="backBtn" onclick="window.location.href='index.html?lang=' + currentLang" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-[13px] font-bold text-slate-600 dark:text-slate-300 transition active:scale-95">返回</button>
        </div>

        <!-- 🖥️ 桌面版 -->
        <div class="hidden md:block overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-50/50 dark:bg-slate-700/50">
                        <th id="th-brand" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-center">品牌</th>
                        <th id="th-name" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700">貨品名稱</th>
                        <th id="th-maxP" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-right">全城最貴 ($)</th>
                        <th id="th-minP" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-right">全城最平 ($)</th>
                        <th id="th-diffP" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-right">慳幾多 ($)</th>
                        <th id="th-percent" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-right">相差 (%)</th>
                        <th id="th-bestSm" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700">推薦超市</th>
                    </tr>
                </thead>
                <tbody id="radarTableBody">
                    <tr><td colspan="7" class="text-center py-10 text-slate-400 dark:text-slate-500" id="loadingText1">正在掃描全城數據...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 📱 手機版 -->
        <div id="radarMobileList" class="md:hidden flex flex-col gap-3 p-3 bg-slate-50 dark:bg-slate-900 transition-colors">
            <div class="text-center py-10 text-slate-400 dark:text-slate-500" id="loadingText2">正在掃描全城數據...</div>
        </div>
    </div>

    <script>
        function initTheme() {
            const themeBtn = document.getElementById('themeBtn');
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if (themeBtn) themeBtn.textContent = '🌙';
            } else {
                document.documentElement.classList.remove('dark');
                if (themeBtn) themeBtn.textContent = '☀️';
            }
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const themeBtn = document.getElementById('themeBtn');
            if (document.documentElement.classList.contains('dark')) {
                themeBtn.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                themeBtn.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }
        initTheme();

        // 💡 已經修正咗呢行嘅 URLSearchParams！
        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || localStorage.getItem('appLang') || 'zh-Hant';
        let cachedData = [];
        let lastUpdatedTime = null;

        function formatDateTime(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}`;
        }

        function openManual() {
            if (currentLang === 'zh-Hans') window.location.href = 'manual_cn.html';
            else if (currentLang === 'en') window.location.href = 'manual_en.html';
            else window.location.href = 'manual_tw.html';
        }

        const uiDict = {
            'zh-Hant': { appTitle: "慳真D", title: "跨超市海鮮價雷達", brand: "品牌", name: "貨品名稱", maxP: "全城最貴 ($)", minP: "全城最平 ($)", diffP: "慳幾多 ($)", percent: "相差 (%)", bestSm: "推薦超市", loading: "正在掃描全城數據...", fail: "讀取失敗", cheapest: "全城最平", exp: "全城最貴", gap: "差價", noData: "暫時未有數據 🤷‍♂️", lastUpdated: "更新於: " },
            'zh-Hans': { appTitle: "悭真D", title: "跨超市海鲜价雷达", brand: "品牌", name: "商品名称", maxP: "全城最贵 ($)", minP: "全城最平 ($)", diffP: "省多少 ($)", percent: "相差 (%)", bestSm: "推荐超市", loading: "正在扫描全城数据...", fail: "读取失败", cheapest: "全城最平", exp: "全城最贵", gap: "差价", noData: "暂无数据 🤷‍♂️", lastUpdated: "更新于: " },
            'en': { appTitle: "HK Smart Price", title: "Price Gap Radar", brand: "Brand", name: "Product Name", maxP: "Max Price ($)", minP: "Min Price ($)", diffP: "Save ($)", percent: "Diff (%)", bestSm: "Best Supermarket", loading: "Scanning citywide data...", fail: "Load Failed", cheapest: "Lowest", exp: "Highest", gap: "Gap", noData: "No Data Found 🤷‍♂️", lastUpdated: "Updated: " }
        };

        function getSmName(code, lang) {
            let c = (code || '').toUpperCase();
            if (typeof supermarketDict !== 'undefined' && supermarketDict[lang] && supermarketDict[lang][c]) {
                return supermarketDict[lang][c];
            }
            return c; 
        }

        function changeLanguage(lang) {
            try {
                currentLang = lang;
                localStorage.setItem('appLang', lang); 
                
                const langSel = document.getElementById('langSelector');
                if(langSel) langSel.value = lang;

                let d = uiDict[lang] || uiDict['zh-Hant'];
                
                if(document.getElementById('appTitle')) document.getElementById('appTitle').innerText = d.appTitle;
                if(document.getElementById('pageTitleText')) document.getElementById('pageTitleText').innerText = d.title;
                if(document.getElementById('th-brand')) document.getElementById('th-brand').innerText = d.brand;
                if(document.getElementById('th-name')) document.getElementById('th-name').innerText = d.name;
                if(document.getElementById('th-maxP')) document.getElementById('th-maxP').innerText = d.maxP;
                if(document.getElementById('th-minP')) document.getElementById('th-minP').innerText = d.minP;
                if(document.getElementById('th-diffP')) document.getElementById('th-diffP').innerText = d.diffP;
                if(document.getElementById('th-percent')) document.getElementById('th-percent').innerText = d.percent;
                if(document.getElementById('th-bestSm')) document.getElementById('th-bestSm').innerText = d.bestSm;
                if(document.getElementById('loadingText1')) document.getElementById('loadingText1').innerText = d.loading;
                if(document.getElementById('loadingText2')) document.getElementById('loadingText2').innerText = d.loading;
                
                if (lastUpdatedTime && document.getElementById('todayStatusLabel')) {
                    document.getElementById('todayStatusLabel').innerText = (d.lastUpdated || '更新於: ') + formatDateTime(lastUpdatedTime);
                }

                if(cachedData.length > 0) processAndRender(cachedData);
            } catch(e) { console.warn(e); }
        }

        async function loadRadarData() {
            try {
                // 同步讀取時間同數據
                const [timeRes, dataRes] = await Promise.all([
                    fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/update_log.txt"),
                    fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/pricewatch.json")
                ]);

                if (timeRes.ok) {
                    const timeText = await timeRes.text();
                    lastUpdatedTime = new Date(timeText.trim());
                    changeLanguage(currentLang); 
                }

                if(!dataRes.ok) throw new Error("HTTP " + dataRes.status);
                const rawData = await dataRes.json();
                cachedData = Array.isArray(rawData) ? rawData : (rawData.data || []);
                processAndRender(cachedData);
            } catch (e) {
                const failMsg = uiDict[currentLang] ? uiDict[currentLang].fail : "Failed";
                document.getElementById('radarTableBody').innerHTML = `<tr><td colspan="7" class="text-center py-10 text-red-500 font-bold">${failMsg}</td></tr>`;
                document.getElementById('radarMobileList').innerHTML = `<div class="text-center py-10 text-red-500 font-bold">${failMsg}</div>`;
            }
        }

        function processAndRender(items) {
            let radarList = [];
            items.forEach(item => {
                let rawName = typeof item.name === 'object' ? (item.name[currentLang] || item.name['zh-Hant'] || item.name['en']) : item.name;
                let brandObj = item.brand || item.brandName || '';
                let brand = (typeof brandObj === 'object' ? (brandObj[currentLang] || brandObj['zh-Hant'] || brandObj['en']) : brandObj) || '-';

                if (Array.isArray(item.prices) && item.prices.length >= 2) {
                    let validPrices = item.prices.map(p => {
                        let smCode = (p.supermarketCode || (typeof p.supermarket === 'string' ? p.supermarket : "UNKNOWN")).toUpperCase();
                        return { 
                            smDisplayName: getSmName(smCode, currentLang), 
                            price: parseFloat(p.price) 
                        };
                    }).filter(p => !isNaN(p.price));
                    
                    if (validPrices.length >= 2) {
                        let minObj = validPrices.reduce((prev, curr) => prev.price < curr.price ? prev : curr);
                        let maxObj = validPrices.reduce((prev, curr) => prev.price > curr.price ? prev : curr);
                        if (minObj.price > 0 && maxObj.price > minObj.price) {
                            let diff = maxObj.price - minObj.price;
                            let percent = (diff / minObj.price) * 100;
                            radarList.push({ brand, name: rawName, maxP: maxObj.price, minP: minObj.price, diffP: diff, percent, bestSm: minObj.smDisplayName });
                        }
                    }
                }
            });
            radarList.sort((a, b) => b.percent - a.percent);
            renderUI(radarList.slice(0, 100));
        }

        function renderUI(list) {
            let d = uiDict[currentLang];
            if (list.length === 0) {
                document.getElementById('radarTableBody').innerHTML = `<tr><td colspan="7" class="text-center py-10 text-slate-500">${d.noData}</td></tr>`;
                document.getElementById('radarMobileList').innerHTML = `<div class="text-center py-10 text-slate-500">${d.noData}</div>`;
                return;
            }

            document.getElementById('radarTableBody').innerHTML = list.map(item => `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/40 transition border-b border-slate-100 dark:border-slate-700 last:border-none">
                    <td class="py-3 px-4 text-sm text-slate-600 dark:text-slate-400 text-center">${item.brand}</td>
                    <td class="py-3 px-4 text-sm font-medium text-slate-800 dark:text-slate-100">${item.name}</td>
                    <td class="py-3 px-4 text-sm text-slate-600 dark:text-slate-400 text-right">${item.maxP.toFixed(1)}</td>
                    <td class="py-3 px-4 text-sm font-bold text-green-600 dark:text-green-400 text-right">${item.minP.toFixed(1)}</td>
                    <td class="py-3 px-4 text-sm text-slate-600 dark:text-slate-400 text-right">${item.diffP.toFixed(1)}</td>
                    <td class="py-3 px-4 text-sm font-bold text-red-500 dark:text-red-400 text-right">+${item.percent.toFixed(1)}%</td>
                    <td class="py-3 px-4 text-sm font-bold text-blue-600 dark:text-blue-400">${item.bestSm}</td>
                </tr>
            `).join('');

            document.getElementById('radarMobileList').innerHTML = list.map(item => `
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 shadow-sm flex flex-col relative overflow-hidden transition-colors">
                    <div class="absolute top-0 right-0 bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 border-b border-l border-red-200 dark:border-red-800 text-[10px] font-black px-2 py-1 rounded-bl-lg">${d.gap} ${item.percent.toFixed(0)}%</div>
                    <div class="text-[11px] text-blue-500 dark:text-blue-400 font-bold uppercase mb-1">${item.brand}</div>
                    <div class="text-[14px] font-bold text-slate-800 dark:text-slate-100 leading-snug pr-12">${item.name}</div>
                    <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-slate-400 dark:text-slate-500 font-bold mb-0.5">${d.cheapest} (${item.bestSm})</span>
                            <span class="text-[18px] font-black text-green-600 dark:text-green-400 leading-none">$${item.minP.toFixed(1)}</span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-[10px] text-slate-400 dark:text-slate-500 font-bold mb-0.5">${d.exp}</span>
                            <span class="text-[14px] font-bold text-slate-500 dark:text-slate-400 line-through leading-none">$${item.maxP.toFixed(1)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        changeLanguage(currentLang);
        loadRadarData();
    </script>
</body>
</html>
