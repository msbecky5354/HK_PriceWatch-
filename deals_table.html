<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日劈價排行榜 | 慳真D🔎</title>
    <script src="lang.js?v=9"></script>
    <script src="promoEngine.js?v=9"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class', }
    </script>
    <style> th { white-space: nowrap; } </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <!-- 🌟 100% 同步 index.html 嘅完美 Header -->
    <header class="bg-white border-b flex-none z-30 px-3 py-3 shadow-sm sticky top-0 dark:bg-slate-900 dark:border-slate-800 transition-colors duration-300">
        <div class="flex justify-between items-center w-full max-w-7xl mx-auto">
            
            <div onclick="window.location.href='index.html?lang=' + currentLang" class="flex items-center gap-2.5 cursor-pointer active:scale-[0.97] transition-transform shrink-0" title="返回主頁">
                <img src="logo.JPG" alt="Logo" class="w-10 h-10 object-cover rounded-xl border border-slate-100 shadow-sm dark:border-slate-700">
                <div class="flex flex-col justify-center gap-1">
                    <h1 id="appTitle" class="text-[16px] bg-gradient-to-r from-indigo-600 to-blue-700 bg-clip-text text-transparent font-black tracking-tight leading-none dark:from-indigo-400 dark:to-blue-400">慳真D</h1>
                    <span id="todayStatusLabel" class="text-[9px] text-slate-400 font-medium whitespace-nowrap leading-none">載入中...</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2.5 shrink-0">
                <div class="flex items-center gap-1">
                    <span class="hidden min-[390px]:block text-[10px] font-bold text-slate-400 leading-none">EN/中</span>
                    <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-slate-100 border-none text-[11px] font-bold text-slate-700 rounded-md px-1.5 py-1 outline-none cursor-pointer dark:bg-slate-800 dark:text-slate-200 transition-colors">
                        <option value="zh-Hant">繁體</option>
                        <option value="zh-Hans">简体</option>
                        <option value="en">Eng</option>
                    </select>
                </div>

                <div class="flex items-center gap-1.5">
                    <button onclick="toggleTheme()" id="themeBtn" class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-50 text-slate-600 border border-slate-200 shadow-sm active:scale-95 transition-all dark:bg-slate-800 dark:border-slate-700">☀️</button>
                    <!-- 提示：點擊鈴鐺/分享會跳返去主頁，確保功能正常運作 -->
                    <button onclick="window.location.href='index.html?lang=' + currentLang" class="relative w-7 h-7 flex items-center justify-center rounded-full bg-rose-50 text-rose-600 border border-rose-100 shadow-sm active:scale-95 transition-all dark:bg-rose-900/30 dark:border-rose-800">🔔</button>
                    <button onclick="openManual()" class="w-7 h-7 flex items-center justify-center rounded-full bg-amber-50 text-amber-600 border border-amber-100 shadow-sm text-[12px] active:scale-95 transition-all dark:bg-amber-900/30 dark:border-amber-800">📖</button>
                    <button onclick="window.location.href='index.html?lang=' + currentLang" class="w-7 h-7 flex items-center justify-center rounded-full bg-blue-50 text-blue-600 border border-blue-100 shadow-sm active:scale-95 transition-all dark:bg-blue-900/30 dark:border-blue-800">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto md:mt-6 md:mb-8 md:rounded-2xl bg-white dark:bg-slate-800 shadow-sm border-b md:border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors duration-300">
        
        <!-- 頁面專屬標題 (不再 Sticky) -->
        <div class="p-4 md:p-5 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white dark:bg-slate-800">
            <h1 class="text-[17px] md:text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                <span class="text-xl md:text-2xl">🛠️</span> 
                <span id="pageTitleText">今日劈價排行榜</span>
            </h1>
            <button id="backBtn" onclick="window.location.href='index.html?lang=' + currentLang" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-[13px] font-bold text-slate-600 dark:text-slate-300 transition active:scale-95">返回</button>
        </div>

        <!-- 🖥️ 桌面版 -->
        <div class="hidden md:block overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-50/50 dark:bg-slate-700/50">
                        <th id="th-sm" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-center">超市</th>
                        <th id="th-label" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700">貨品</th>
                        <th id="th-percent" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-right">減價幅度 (%)</th>
                        <th id="th-original" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-right">原價</th>
                        <th id="th-effective" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700 text-right">折實價</th>
                        <th id="th-promo" class="py-4 px-4 text-sm font-bold text-blue-500 dark:text-blue-400 border-b border-blue-100 dark:border-slate-700">優惠內容</th>
                    </tr>
                </thead>
                <tbody id="dealsTableBody">
                    <tr><td colspan="6" class="text-center py-10 text-slate-400 dark:text-slate-500" id="loadingText1">正在計算減價幅度...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 📱 手機版 -->
        <div id="dealsMobileList" class="md:hidden flex flex-col gap-3 p-3 bg-slate-50 dark:bg-slate-900 transition-colors">
            <div class="text-center py-10 text-slate-400 dark:text-slate-500" id="loadingText2">正在計算減價幅度...</div>
        </div>
    </div>

    <script>
        function initTheme() {
            const themeBtn = document.getElementById('themeBtn');
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if (themeBtn) themeBtn.textContent = '🌙';
            } else {
                document.documentElement.classList.remove('dark');
                if (themeBtn) themeBtn.textContent = '☀️';
            }
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const themeBtn = document.getElementById('themeBtn');
            if (document.documentElement.classList.contains('dark')) {
                themeBtn.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                themeBtn.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }
        initTheme();

        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || localStorage.getItem('appLang') || 'zh-Hant';
        let cachedData = [];
        let lastUpdatedTime = null;

        function formatDateTime(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}`;
        }

        function openManual() {
            if (currentLang === 'zh-Hans') window.location.href = 'manual_cn.html';
            else if (currentLang === 'en') window.location.href = 'manual_en.html';
            else window.location.href = 'manual_tw.html';
        }

        window.extractDeepPromoText = window.extractDeepPromoText || function(obj, lang) {
            if (!obj) return "";
            if (typeof obj === 'string') return obj;
            if (obj[lang]) return obj[lang];
            if (lang === 'zh-Hans' && obj['zh-Hant']) return obj['zh-Hant']; 
            if (obj.desc && obj.desc[lang]) return obj.desc[lang];
            if (obj.promotionDesc && obj.promotionDesc[lang]) return obj.promotionDesc[lang];
            return JSON.stringify(obj);
        };

      const uiDict = {
            'zh-Hant': { appTitle: "慳真D", title: "今日劈價排行榜", back: "返回", sm: "超市", label: "貨品", percent: "減價幅度 (%)", original: "原價", effective: "折實價", promo: "優惠內容", loading: "正在計算減價幅度...", fail: "讀取失敗", avgEff: "平均折實價", singleOrig: "單件原價", cut: "劈", noData: "暫時未有劈價優惠 🤷‍♂️", lastUpdated: "更新於: " },
            'zh-Hans': { appTitle: "悭真D", title: "今日降价排行榜", back: "返回", sm: "超市", label: "商品", percent: "降价幅度 (%)", original: "原价", effective: "折实价", promo: "优惠内容", loading: "正在计算降价幅度...", fail: "读取失败", avgEff: "平均折实价", singleOrig: "单件原价", cut: "降", noData: "暂无降价优惠 🤷‍♂️", lastUpdated: "更新于: " },
            'en': { appTitle: "HK Smart Price", title: "Top Deals Ranking", back: "Back", sm: "Store", label: "Product", percent: "Discount (%)", original: "Original", effective: "Effective", promo: "Promo Detail", loading: "Calculating discounts...", fail: "Load Failed", avgEff: "Avg Price", singleOrig: "Original", cut: "Save", noData: "No major deals found 🤷‍♂️", lastUpdated: "Updated: " }
        };

        function getSmName(code, lang) {
            let c = (code || '').toUpperCase();
            if (typeof supermarketDict !== 'undefined' && supermarketDict[lang] && supermarketDict[lang][c]) {
                return supermarketDict[lang][c];
            }
            return c; 
        }

        function changeLanguage(lang) {
            try {
                currentLang = lang;
                localStorage.setItem('appLang', lang); 
                
                const langSel = document.getElementById('langSelector');
                if(langSel) langSel.value = lang;

                let d = uiDict[lang] || uiDict['zh-Hant'];
                
                if(document.getElementById('appTitle')) document.getElementById('appTitle').innerText = d.appTitle;
                if(document.getElementById('pageTitleText')) document.getElementById('pageTitleText').innerText = d.title;
               // 💡 就係加返呢行！救返個「返回」掣！
                if(document.getElementById('backBtn')) document.getElementById('backBtn').innerText = d.back;
                if(document.getElementById('th-sm')) document.getElementById('th-sm').innerText = d.sm;
                if(document.getElementById('th-label')) document.getElementById('th-label').innerText = d.label;
                if(document.getElementById('th-percent')) document.getElementById('th-percent').innerText = d.percent;
                if(document.getElementById('th-original')) document.getElementById('th-original').innerText = d.original;
                if(document.getElementById('th-effective')) document.getElementById('th-effective').innerText = d.effective;
                if(document.getElementById('th-promo')) document.getElementById('th-promo').innerText = d.promo;
                if(document.getElementById('loadingText1')) document.getElementById('loadingText1').innerText = d.loading;
                if(document.getElementById('loadingText2')) document.getElementById('loadingText2').innerText = d.loading;
                
                if (lastUpdatedTime && document.getElementById('todayStatusLabel')) {
                    document.getElementById('todayStatusLabel').innerText = (d.lastUpdated || '更新於: ') + formatDateTime(lastUpdatedTime);
                }
                
                if(cachedData.length > 0) processAndRender(cachedData);
            } catch(e) { console.warn(e); }
        }

        async function loadDealsData() {
            try {
                if (typeof calculateAvgPrice !== 'function') throw new Error("promoEngine.js 載入失敗！");
                
                // 同步讀取時間同數據
                const [timeRes, dataRes] = await Promise.all([
                    fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/update_log.txt"),
                    fetch("https://raw.githubusercontent.com/msbecky5354/HK_PriceWatch-/main/data/pricewatch.json")
                ]);

                if (timeRes.ok) {
                    const timeText = await timeRes.text();
                    lastUpdatedTime = new Date(timeText.trim());
                    changeLanguage(currentLang); 
                }

                if (!dataRes.ok) throw new Error("HTTP " + dataRes.status);
                const rawData = await dataRes.json();
                cachedData = Array.isArray(rawData) ? rawData : (rawData.data || []);
                processAndRender(cachedData);
            } catch (e) {
                const failMsg = uiDict[currentLang] ? uiDict[currentLang].fail : "Failed";
                document.getElementById('dealsTableBody').innerHTML = `<tr><td colspan="6" class="text-center py-10 text-red-500 font-bold">${failMsg} : ${e.message}</td></tr>`;
                document.getElementById('dealsMobileList').innerHTML = `<div class="text-center py-10 text-red-500 font-bold">${failMsg}</div>`;
            }
        }

        function processAndRender(items) {
            let dealsList = [];
            items.forEach(item => {
                let rawName = typeof item.name === 'object' ? (item.name[currentLang] || item.name['zh-Hant'] || item.name['en']) : item.name;
                if (Array.isArray(item.prices)) {
                    item.prices.forEach(p => {
                        let smCode = (p.supermarketCode || (typeof p.supermarket === 'string' ? p.supermarket : "UNKNOWN")).toUpperCase();
                        let smDisplayName = getSmName(smCode, currentLang);
                        let originalPrice = parseFloat(p.price);
                        let promoCalcStr = "";
                        let promoDisplayStr = "";
                        const promoKeys = ['offers', 'promotions', 'promotion', 'offer', 'promoDisplay', 'promoCalc'];
                        
                        for (let key of promoKeys) {
                            if (Array.isArray(item[key])) {
                                let matchingOffer = item[key].find(o => o.supermarketCode === p.supermarketCode || o.supermarket === p.supermarketCode);
                                if (matchingOffer) {
                                    promoDisplayStr = extractDeepPromoText(matchingOffer, currentLang);
                                    promoCalcStr = extractDeepPromoText(matchingOffer, 'en');
                                    break;
                                }
                            } else if (p[key]) {
                                promoDisplayStr = extractDeepPromoText(p[key], currentLang);
                                promoCalcStr = extractDeepPromoText(p[key], 'en');
                                break;
                            }
                        }

                        if (!isNaN(originalPrice) && promoCalcStr && typeof calculateAvgPrice === 'function') {
                            let effectivePrice = calculateAvgPrice(promoCalcStr, originalPrice);
                            if (effectivePrice && effectivePrice > 0 && effectivePrice < originalPrice) {
                                let discountPercent = ((originalPrice - effectivePrice) / originalPrice) * 100;
                                dealsList.push({ 
                                    sm: smDisplayName, 
                                    label: rawName,
                                    percent: discountPercent, 
                                    original: originalPrice, 
                                    effective: effectivePrice, 
                                    promoDetail: promoDisplayStr || promoCalcStr 
                                });
                            }
                        }
                    });
                }
            });

            dealsList.sort((a, b) => b.percent - a.percent);
            renderUI(dealsList.slice(0, 100));
        }

        function renderUI(list) {
            let d = uiDict[currentLang];
            if (list.length === 0) {
                document.getElementById('dealsTableBody').innerHTML = `<tr><td colspan="6" class="text-center py-10 text-slate-500">${d.noData}</td></tr>`;
                document.getElementById('dealsMobileList').innerHTML = `<div class="text-center py-10 text-slate-500">${d.noData}</div>`;
                return;
            }

            document.getElementById('dealsTableBody').innerHTML = list.map(item => `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/40 transition border-b border-slate-100 dark:border-slate-700 last:border-none">
                    <td class="py-3 px-4 text-sm text-slate-700 dark:text-slate-300 text-center font-bold">${item.sm}</td>
                    <td class="py-3 px-4 text-sm font-medium text-slate-800 dark:text-slate-100">${item.label}</td>
                    <td class="py-3 px-4 text-sm font-black text-red-500 dark:text-red-400 text-right">-${item.percent.toFixed(1)}%</td>
                    <td class="py-3 px-4 text-sm text-slate-500 dark:text-slate-400 text-right line-through">$${item.original.toFixed(1)}</td>
                    <td class="py-3 px-4 text-sm font-bold text-green-600 dark:text-green-400 text-right">$${item.effective.toFixed(1)}</td>
                    <td class="py-3 px-4 text-xs text-slate-600 dark:text-slate-300"><span class="bg-red-50 dark:bg-red-900/30 px-2 py-1 rounded text-red-600 dark:text-red-400 border border-red-100 dark:border-red-800 font-bold">${item.promoDetail}</span></td>
                </tr>
            `).join('');

            document.getElementById('dealsMobileList').innerHTML = list.map(item => `
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 shadow-sm flex flex-col relative transition-colors">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded border border-blue-100 dark:border-blue-800">${item.sm}</span>
                        <span class="text-[11px] font-black text-red-500 dark:text-red-400 bg-red-50 dark:bg-red-900/30 px-2 py-0.5 rounded border border-red-100 dark:border-red-800">${d.cut} ${item.percent.toFixed(1)}%</span>
                    </div>
                    <div class="text-[14px] font-bold text-slate-800 dark:text-slate-100 leading-snug mb-3">${item.label}</div>
                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-700">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-slate-400 dark:text-slate-500 font-bold mb-0.5">${d.avgEff}</span>
                            <span class="text-[18px] font-black text-green-600 dark:text-green-400 leading-none">$${item.effective.toFixed(1)}</span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-[10px] text-slate-400 dark:text-slate-500 font-bold mb-0.5">${d.singleOrig}</span>
                            <span class="text-[14px] font-bold text-slate-500 dark:text-slate-400 line-through leading-none">$${item.original.toFixed(1)}</span>
                        </div>
                    </div>
                    <div class="mt-3 text-[11px] font-bold text-red-500 dark:text-red-400 bg-red-50 dark:bg-red-900/30 p-2 rounded-lg border border-red-100 dark:border-red-800 break-words">
                        🏷️ ${item.promoDetail}
                    </div>
                </div>
            `).join('');
        }
        
        changeLanguage(currentLang);
        loadDealsData();
    </script>
</body>
</html>
