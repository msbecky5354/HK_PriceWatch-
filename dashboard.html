<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

<div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden w-full max-w-5xl mx-auto my-8">
    <div class="p-6 border-b border-slate-100 bg-slate-50/50">
        <h2 class="text-2xl font-black text-slate-800 flex items-center gap-3">
            <span>🔲</span> 慳真D：全城降價戰力版圖
        </h2>
        <p class="text-slate-500 mt-2 text-sm">數據來源：香港消委會 | 面積代表真實降價商品總數</p>
    </div>
    <div class="p-4 flex justify-center items-center">
        <div id="treemapChart" class="w-full h-[600px] md:h-[700px]"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const chartDom = document.getElementById('treemapChart');
    const myChart = echarts.init(chartDom);

    // 顯示高質感的加載動畫
    myChart.showLoading({
        text: '情報雷達掃描中...',
        color: '#3b82f6',
        textColor: '#64748b',
        maskColor: 'rgba(255, 255, 255, 0.8)'
    });

    // ⚠️ 請將此 URL 替換為您 GitHub / Server 真實託管 bi_treemap.json 的網址
    const jsonUrl = 'https://your-github-pages-url/data/bi_treemap.json';

    fetch(jsonUrl)
        .then(response => response.json())
        .then(payload => {
            myChart.hideLoading();

            // 算出全城降價總件數 (供 Tooltip 計算百分比使用)
            const totalItems = payload.data.reduce((sum, item) => sum + item.value, 0);

            const option = {
                tooltip: {
                    formatter: function (info) {
                        const percent = ((info.value / totalItems) * 100).toFixed(1);
                        return `<div class="font-bold text-slate-800 text-lg mb-1">${info.name}</div>
                                <div class="text-sm text-slate-500">真實降價件數：<span class="text-blue-600 font-black">${info.value} 件</span></div>
                                <div class="text-sm text-slate-500">全城火力佔比：<span class="font-black">${percent}%</span></div>`;
                    },
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',
                    borderColor: '#e2e8f0',
                    textStyle: { color: '#1e293b' }
                },
                series: [{
                    type: 'treemap',
                    width: '100%', height: '100%',
                    roam: false, nodeClick: false, breadcrumb: { show: false },
                    itemStyle: { borderColor: '#ffffff', borderWidth: 4, gapWidth: 2, borderRadius: 8 },
                    // 🌟 絕對服從：直接吃 n8n 算好的 data 陣列
                    data: payload.data, 
                    label: {
                        show: true,
                        position: 'inside',
                        formatter: function(params) {
                            // n8n 已經幫我們把太小的標籤設為 show: false，這裡只需專心排版大方塊
                            return `{logo|}\n\n{name|${params.name}}\n{count|${params.value} 件}`;
                        },
                        rich: {
                            name: { fontSize: 16, fontWeight: 'bold', color: '#ffffff', textShadowColor: 'rgba(0,0,0,0.3)', textShadowBlur: 3, align: 'center', lineHeight: 25 },
                            count: { fontSize: 22, fontWeight: 'black', color: '#ffffff', textShadowColor: 'rgba(0,0,0,0.3)', textShadowBlur: 3, align: 'center', backgroundColor: 'rgba(0,0,0,0.2)', padding: [4, 8], borderRadius: 6 }
                        }
                    }
                }]
            };

            myChart.setOption(option);
            
            // 讓圖表隨視窗縮放
            window.addEventListener('resize', () => { myChart.resize(); });
        })
        .catch(error => {
            console.error('戰力版圖載入失敗:', error);
            myChart.hideLoading();
            chartDom.innerHTML = '<div class="text-red-500 text-center mt-20 font-bold">無法載入戰情報告，請稍後再試。</div>';
        });
});
</script>
