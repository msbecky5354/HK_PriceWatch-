<script>
    let currentLang = (typeof window.currentLang !== 'undefined') ? window.currentLang : (localStorage.getItem('appLang') || 'zh-Hant');
    let mainUpdatedTime = null;   // 主網時間 (Logo 旁邊)
    let battleUpdatedTime = null; // 戰情時間 (綠色 Badge)
    let globalLeaderboardData = []; 
    // 防止重複觸發 loading
    let isFetchingData = false;

    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return '';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function getSmName(code, lang) {
        let c = (code || '').toUpperCase();
        if (typeof window.supermarketDict !== 'undefined' && window.supermarketDict[lang] && window.supermarketDict[lang][c]) return window.supermarketDict[lang][c];
        if (typeof window.supermarketDict !== 'undefined' && window.supermarketDict['zh-Hant'] && window.supermarketDict['zh-Hant'][c]) return window.supermarketDict['zh-Hant'][c];
        return c;
    }

    function getCatName(rawCat, lang) {
        let c = (rawCat || '').toString().trim();
        if (window.categoryDict && window.categoryDict[lang] && window.categoryDict[lang][c]) {
            return window.categoryDict[lang][c];
        }
        return c; 
    }

    function goToProductSearch(productName) {
        window.location.href = 'index.html?lang=' + currentLang + '&q=' + encodeURIComponent(productName);
    }

    function openMechanismModal() { document.getElementById('mechanismModal').classList.remove('hidden'); }
    function closeMechanismModal() { document.getElementById('mechanismModal').classList.add('hidden'); }

    // 🚀 全新解包函數
    function unwrapData(d) {
        if (!d) return [];
        let rawData = d;
        if (!Array.isArray(rawData) && (rawData.results || rawData.data)) rawData = rawData.results || rawData.data;
        if (!Array.isArray(rawData)) rawData = [rawData];
        if (rawData.length > 0) {
            if (rawData[0] && rawData[0].json && rawData[0].json.snapshot_data) return rawData[0].json.snapshot_data;
            if (rawData[0] && rawData[0].snapshot_data) return rawData[0].snapshot_data;
            if (rawData[0] && rawData[0].json) return rawData.map(i => i.json);
        }
        if (rawData.length === 1 && rawData[0] && rawData[0].snapshot_data) return rawData[0].snapshot_data;
        return rawData;
    }

    async function loadBattleSummaryData() {
        if (isFetchingData) return;
        isFetchingData = true;

        try {
            const container = document.getElementById('battleSummaryContainer');
            let loadingStr = currentLang === 'en' ? '⏳ Calculating Live Battle Data...' : (currentLang === 'zh-Hans' ? '⏳ 正在即时运算战情数据...' : '⏳ 正在即時運算戰情數據...');
            if (container) container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500 dark:text-slate-400 animate-pulse text-[15px]">${loadingStr}</div>`;

            const nocache = new Date().getTime();
            const dataUrl = `https://raw.githubusercontent.com/msbecky5354/JSON/main/data/snapshot_${currentLang}.json?v=${nocache}`;

            const dataRes = await fetch(dataUrl, { cache: 'no-store' });
            if (!dataRes.ok) throw new Error("無法取得最新官方價格數據");
            
            let rawData = await dataRes.json();
            const flatSnapshotData = unwrapData(rawData);

            let productGroups = {};
            flatSnapshotData.forEach(item => {
                let smCode = (item.sm || '').toUpperCase();
                if (smCode === 'ZTORE' || !smCode) return;
                
                let effPrice = parseFloat(item.ce_p);
                if (isNaN(effPrice) || effPrice <= 0) return;

                let n = item.n || 'Unknown';
                let b = item.b || '';
                let c = item.c1 || '';

                let pId = item.id || `${b}_${n}`;
                
                if (!productGroups[pId]) {
                    productGroups[pId] = { name: n, brand: b, categoryRaw: c, prices: [] };
                }
                productGroups[pId].prices.push({ smCode: smCode, effPrice: effPrice });
            });

            let leaderboard = [];

            Object.values(productGroups).forEach(group => {
                if (group.prices.length < 2) return; 
                let avgPrice = group.prices.reduce((acc, curr) => acc + curr.effPrice, 0) / group.prices.length;
                let winner = group.prices.reduce((prev, curr) => prev.effPrice < curr.effPrice ? prev : curr);
                if (winner.effPrice >= avgPrice) return; 
                let discountPct = ((avgPrice - winner.effPrice) / avgPrice) * 100;
                if (discountPct <= 0) return;
                
                leaderboard.push({
                    name: group.name,
                    brand: group.brand,
                    categoryRaw: group.categoryRaw,
                    smCode: winner.smCode,
                    effectivePrice: winner.effPrice,
                    realDiscountPct: discountPct
                });
            });

            globalLeaderboardData = leaderboard; 
            renderBattleSummary();

        } catch (e) {
            console.error("載入失敗:", e);
            const container = document.getElementById('battleSummaryContainer');
            if (container) container.innerHTML = `<div class="col-span-full p-10 text-center text-red-500 font-bold">資料載入失敗: ${e.message}</div>`;
        } finally {
            isFetchingData = false;
        }
    }

    function renderBattleSummary() {
        const container = document.getElementById('battleSummaryContainer');
        if (!container || !globalLeaderboardData || globalLeaderboardData.length === 0) {
            const noDataMsg = currentLang === 'en' ? 'No significant price drops today.' : (currentLang === 'zh-Hans' ? '今日暂无显著差价货品。' : '今日暫無顯著差價貨品。');
            if (container) container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500">${noDataMsg}</div>`;
            return;
        }

        const smGroups = {};
        globalLeaderboardData.forEach(item => {
            if (!smGroups[item.smCode]) smGroups[item.smCode] = [];
            smGroups[item.smCode].push(item);
        });

        container.innerHTML = '';
        
        const smOrder = ['PARKNSHOP', 'WELLCOME', 'MARKETPLACE', 'WATSONS', 'MANNINGS', 'AEON'];
        const availableSms = Object.keys(smGroups).sort((a, b) => {
            let idxA = smOrder.indexOf(a); let idxB = smOrder.indexOf(b);
            if (idxA === -1) idxA = 999; if (idxB === -1) idxB = 999;
            return idxA - idxB;
        });

        if (availableSms.length === 0) {
            const noDataMsg = currentLang === 'en' ? 'No significant price drops today.' : (currentLang === 'zh-Hans' ? '今日暂无显著差价货品。' : '今日暫無顯著差價貨品。');
            container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500">${noDataMsg}</div>`;
            return;
        }

        const totalItemsText = currentLang === 'en' ? 'Items' : (currentLang === 'zh-Hans' ? '总火力' : '總火力');
        const countText = currentLang === 'en' ? '' : (currentLang === 'zh-Hans' ? ' 件' : ' 件');

        availableSms.forEach(smCode => {
            const items = smGroups[smCode];
            items.sort((a, b) => b.realDiscountPct - a.realDiscountPct); 
            const top3 = items.slice(0, 3); 

            let style = (typeof window.supermarketStyleDict !== 'undefined' && window.supermarketStyleDict[smCode]) ? window.supermarketStyleDict[smCode] : (typeof window.supermarketStyleDict !== 'undefined' ? window.supermarketStyleDict['DEFAULT'] : { badgeBg: '', badgeText: '', badgeBorder: ''});
            
            let itemsHTML = top3.map((item, index) => {
                let rankMedal = index === 0 ? '🥇' : index === 1 ? '🥈' : '🥉';
                let safeName = String(item.name).replace(/'/g, "\\'");
                let displayCat = getCatName(item.categoryRaw, currentLang);

                return `
                    <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm mb-2 hover:bg-blue-50 dark:hover:bg-slate-700/50 transition-colors">
                        <div class="flex items-start gap-2.5 overflow-hidden pr-2">
                            <span class="text-lg leading-none pt-0.5">${rankMedal}</span>
                            <div class="flex flex-col min-w-0">
                                <span class="text-[10px] text-slate-500 font-bold uppercase truncate">${item.brand} | ${displayCat}</span>
                                <a href="javascript:void(0)" onclick="goToProductSearch(this.getAttribute('data-query'))" data-query="${safeName} ${item.smCode}" class="text-[14px] font-bold text-slate-800 dark:text-slate-100 truncate hover:text-[#345B8C] dark:hover:text-blue-400 transition-colors block w-full">${item.name}</a>
                            </div>
                        </div>
                        <div class="flex flex-col items-end shrink-0">
                            <span class="text-[15px] font-black text-blue-600 dark:text-blue-400">$${item.effectivePrice.toFixed(1)}</span>
                            <span class="text-[10px] font-bold text-red-500 bg-red-50 dark:bg-red-900/30 px-1.5 py-0.5 rounded border border-red-100 dark:border-red-800">▼ ${item.realDiscountPct.toFixed(1)}%</span>
                        </div>
                    </div>
                `;
            }).join('');

            const cardHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col">
                    <div class="p-4 ${style.badgeBg} ${style.badgeText} border-b ${style.badgeBorder} flex justify-between items-center">
                        <h3 class="font-black text-[16px] tracking-wide">${getSmName(smCode, currentLang)}</h3>
                        <span class="bg-white/80 dark:bg-slate-800/80 px-2 py-0.5 rounded text-[11px] font-bold">${totalItemsText}: ${items.length}${countText}</span>
                    </div>
                    <div class="p-3 md:p-4 bg-slate-50/50 dark:bg-slate-900/50 flex-1">
                        ${itemsHTML}
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function updateLocalLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);

        const appTitle = document.getElementById('appTitle');
        if (appTitle) appTitle.innerText = lang === 'en' ? 'SmartDeal' : '慳真D';

        // ✅ 1. 處理主站時間 (Logo 旁邊)
        const statusLabel = document.getElementById('todayStatusLabel');
        if (statusLabel) {
            if (mainUpdatedTime && !isNaN(mainUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Updated: ' : (lang === 'zh-Hans' ? '更新于: ' : '更新於: ');
                statusLabel.innerText = prefix + formatDateTime(mainUpdatedTime);
            } else {
                statusLabel.innerText = lang === 'en' ? 'Loading...' : (lang === 'zh-Hans' ? '载入中...' : '載入中...');
            }
        }

        // ✅ 2. 處理戰情時間 (綠色 Badge)
        const battleLabel = document.getElementById('battleStatusLabel');
        if (battleLabel) {
            if (battleUpdatedTime && !isNaN(battleUpdatedTime.getTime())) {
                const prefix = lang === 'en' ? 'Battle Updated: ' : (lang === 'zh-Hans' ? '战情更新于: ' : '戰情更新於: ');
                battleLabel.innerText = prefix + formatDateTime(battleUpdatedTime);
            } else {
                battleLabel.innerText = lang === 'en' ? 'Loading...' : (lang === 'zh-Hans' ? '载入中...' : '載入中...');
            }
        }
        
        const setTxt = (id, txt) => { const el = document.getElementById(id); if (el) el.innerText = txt; };
        const isEn = lang === 'en';
        const isSc = lang === 'zh-Hans';

        document.title = isEn ? "Battle Summary | SmartDeal" : (isSc ? "战情总结 | 悭真D" : "戰情總結 | 慳真D");
        setTxt('pageTitleText', isEn ? 'Battle Summary' : (isSc ? '战情总结' : '戰情總結'));
        setTxt('subTitleText', isEn ? 'Top 3 Price Drops by Supermarket' : (isSc ? '各大超市即时 Top 3 劈价排行榜' : '各大超市即時 Top 3 劈價排行榜'));
        setTxt('backBtn', isEn ? 'Back' : '返回');
        setTxt('listTitle', isEn ? '🏆 Supermarket Leaderboard' : (isSc ? '🏆 各大超市战况' : '🏆 各大超市戰況'));

        const uiDict = (typeof window.uiText !== 'undefined' && window.uiText[lang]) ? window.uiText[lang] : (typeof window.uiText !== 'undefined' ? window.uiText['zh-Hant'] : null);
        const setElTxt = (id, text) => { const el = document.getElementById(id); if (el && text) el.innerText = text; };
        const setElHtml = (id, html) => { const el = document.getElementById(id); if (el && html) el.innerHTML = html; };

        if (uiDict) {
            setElTxt('miniFooterLinks', uiDict.miniFooterLinks || '關於我們、條款及免責聲明');
            setElTxt('miniFooterCopy', uiDict.miniFooterCopy || '© 2026 慳真D');
            setElTxt('disclaimerTitle', uiDict.disclaimerTitle || '免責聲明及服務條款');
            setElHtml('disclaimerBody', uiDict.disclaimerText || '請參閱首頁免責聲明內容。');
            setElTxt('modalCloseBtn', uiDict.modalBtn || '我明白及接受');
        }

        const devTeam = document.getElementById('footerDevTeam');
        if (devTeam) devTeam.innerText = lang === 'en' ? 'Developed by: ' : (lang === 'zh-Hans' ? '开发团队: ' : '開發團隊: ');

        const devName = document.getElementById('footerDevName');
        if (devName) devName.innerText = lang === 'en' ? 'Lazy Tools Station' : (lang === 'zh-Hans' ? '懒人工具站' : '懶人工具駅');

        const mechText = {
            'zh-Hant': {

    window.addEventListener('languageChanged', (e) => {
        updateLocalLanguage(e.detail.lang);
        const container = document.getElementById('battleSummaryContainer');
        if (container) {
            container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500 animate-pulse">切換語言中 / Changing language...</div>`;
            setTimeout(() => { loadBattleSummaryData(); }, 300);
        }
    });

    window.changeLanguage = function(lang) {
        if (typeof globalChangeLang === 'function') globalChangeLang(lang);
        updateLocalLanguage(lang); 
        
        const container = document.getElementById('battleSummaryContainer');
        if (container) {
            container.innerHTML = `<div class="col-span-full p-10 text-center font-bold text-slate-500 animate-pulse">切換語言中 / Changing language...</div>`;
            setTimeout(() => { loadBattleSummaryData(); }, 300);
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof window.currentLang !== 'undefined') {
            updateLocalLanguage(window.currentLang);
        } else {
            updateLocalLanguage(currentLang);
        }
        
        const nocache = new Date().getTime();

        // 🟢 路線 A：獨立拉取主站時間 (update_log.txt)
        fetch(`https://raw.githubusercontent.com/msbecky5354/JSON/main/data/update_log.txt?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.ok ? res.text() : Promise.reject('Failed to load main date'))
            .then(text => {
                let safeTimeStr = text.trim();
                mainUpdatedTime = new Date(safeTimeStr);
                if (isNaN(mainUpdatedTime.getTime())) {
                    safeTimeStr = safeTimeStr.replace(/-/g, '/').replace('T', ' '); 
                    mainUpdatedTime = new Date(safeTimeStr);
                }
                updateLocalLanguage(currentLang); 
            })
            .catch(e => console.warn("主時間紀錄載入失敗", e));

        // 🟢 路線 B：獨立拉取戰情室時間 (update_log_TrueDiscount.txt)
        fetch(`https://raw.githubusercontent.com/msbecky5354/JSON/main/data/update_log_TrueDiscount.txt?v=${nocache}`, { cache: 'no-store' })
            .then(res => res.ok ? res.text() : Promise.reject('Failed to load battle date'))
            .then(text => {
                let safeTimeStr = text.trim();
                battleUpdatedTime = new Date(safeTimeStr);
                if (isNaN(battleUpdatedTime.getTime())) {
                    safeTimeStr = safeTimeStr.replace(/-/g, '/').replace('T', ' '); 
                    battleUpdatedTime = new Date(safeTimeStr);
                }
                // 成功載入後顯示綠色 Badge
                const badge = document.getElementById('battleStatusLabel');
                if(badge) badge.classList.remove('hidden');
                updateLocalLanguage(currentLang); 
            })
            .catch(e => console.warn("戰情時間紀錄載入失敗", e));

        loadBattleSummaryData();
    });
</script>
